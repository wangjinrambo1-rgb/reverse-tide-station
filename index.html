    // === 轻量 Web Audio 复古铜管喇叭、拱门铜钟与水闸音效合成器 ===
    let audioCtx = null;
    function playHornTone(freq = 261.63, duration = 0.42, toneType = "brass") {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const filter = audioCtx.createBiquadFilter();
        const gain = audioCtx.createGain();
        osc.type = toneType === "error" ? "sawtooth" : "triangle";
        osc2.type = "sine";
        osc.frequency.setValueAtTime(freq, now);
        osc2.frequency.setValueAtTime(toneType === "error" ? freq * 1.06 : freq * 2.0, now);
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(Math.min(3200, freq * 3.8), now);
        filter.Q.setValueAtTime(1.6, now);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(toneType === "error" ? 0.18 : 0.24, now + 0.045);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc.connect(filter);
        osc2.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc2.start(now);
        osc.stop(now + duration);
        osc2.stop(now + duration);
      } catch (e) {}
    }

    function playBellChime() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const now = audioCtx.currentTime;
        [220.0, 440.0, 523.25, 659.25].forEach((f, idx) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = "sine";
          o.frequency.setValueAtTime(f, now);
          const peak = idx === 0 ? 0.22 : (0.14 / idx);
          g.gain.setValueAtTime(0.001, now);
          g.gain.exponentialRampToValueAtTime(peak, now + 0.025);
          g.gain.exponentialRampToValueAtTime(0.001, now + 2.4 - idx * 0.25);
          o.connect(g);
          g.connect(audioCtx.destination);
          o.start(now);
          o.stop(now + 2.45);
        });
      } catch (e) {}
    }

    function playWaterRush() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const now = audioCtx.currentTime;
        const len = Math.floor(audioCtx.sampleRate * 0.65);
        const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        const bp = audioCtx.createBiquadFilter();
        bp.type = "bandpass";
        bp.frequency.setValueAtTime(680, now);
        bp.frequency.exponentialRampToValueAtTime(240, now + 0.62);
        bp.Q.setValueAtTime(1.2, now);
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0.001, now);
        g.gain.exponentialRampToValueAtTime(0.16, now + 0.08);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.64);
        src.connect(bp);
        bp.connect(g);
        g.connect(audioCtx.destination);
        src.start(now);
        src.stop(now + 0.65);
      } catch (e) {}
    }

    /** 机械铜齿轮棘轮咔哒音效，赋予拖动旋转阀轮的真实段位手感。 */
    function playRatchetTick(pitchFactor = 1.0) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const filt = audioCtx.createBiquadFilter();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(520 * pitchFactor, now);
        osc.frequency.exponentialRampToValueAtTime(175 * pitchFactor, now + 0.042);
        filt.type = "bandpass";
        filt.frequency.setValueAtTime(1150 * pitchFactor, now);
        filt.Q.setValueAtTime(2.6, now);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(0.14, now + 0.006);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.046);
        osc.connect(filt);
        filt.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.05);
      } catch (e) {}
    }

    /** 多层金属泛音铜铃音效（含示范音、玩家敲击音与节奏偏差低沉提示音）。 */
    function playRhythmBell(beatIdx = 0, isDemo = false, isError = false) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const now = audioCtx.currentTime;
        if (isError) {
          [170.0, 184.0].forEach((f) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = "triangle";
            o.frequency.setValueAtTime(f, now);
            g.gain.setValueAtTime(0.001, now);
            g.gain.exponentialRampToValueAtTime(0.13, now + 0.02);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.48);
            o.connect(g);
            g.connect(audioCtx.destination);
            o.start(now);
            o.stop(now + 0.50);
          });
          return;
        }
        const notes = [392.0, 493.88, 587.33, 783.99];
        const base = notes[beatIdx % notes.length];
        const tail = beatIdx === 3 ? 2.0 : 1.35;
        const partials = [
          [1.0, "sine", isDemo ? 0.16 : 0.20, tail],
          [2.0, "triangle", isDemo ? 0.08 : 0.10, tail * 0.72],
          [2.76, "sine", 0.06, tail * 0.50],
        ];
        partials.forEach(([mul, type, pk, dur]) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = type;
          o.frequency.setValueAtTime(base * mul, now);
          g.gain.setValueAtTime(0.001, now);
          g.gain.exponentialRampToValueAtTime(pk, now + 0.012);
          g.gain.exponentialRampToValueAtTime(0.001, now + dur);
          o.connect(g);
          g.connect(audioCtx.destination);
          o.start(now);
          o.stop(now + dur + 0.03);
        });
        // 清脆敲击瞬态
        const strike = audioCtx.createOscillator();
        const sg = audioCtx.createGain();
        strike.type = "sine";
        strike.frequency.setValueAtTime(base * 4.2, now);
        strike.frequency.exponentialRampToValueAtTime(base * 2.1, now + 0.045);
        sg.gain.setValueAtTime(0.001, now);
        sg.gain.exponentialRampToValueAtTime(0.075, now + 0.005);
        sg.gain.exponentialRampToValueAtTime(0.001, now + 0.065);
        strike.connect(sg);
        sg.connect(audioCtx.destination);
        strike.start(now);
        strike.stop(now + 0.07);
      } catch (e) {}
    }

    // 沿塔顶喇叭开口方向发射的定向声波涟漪（清晰展示声波射向）
    function spawnDirectionalWave(origin, dirVec, colorHex = 0x5ff0ff, count = 3, reach = 1.85) {
      const dir = dirVec.clone().normalize();
      const quat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir);
      for (let i = 0; i < count; i++) {
        const ring = new THREE.Mesh(
          new THREE.RingGeometry(0.18, 0.28, 24),
          new THREE.MeshBasicMaterial({ color: colorHex, side: THREE.DoubleSide, transparent: true, opacity: 0.0 })
        );
        ring.material.userData.outlineParameters = { visible: false };
        ring.position.copy(origin);
        ring.quaternion.copy(quat);
        levelRoot.add(ring);
        let life = -i * 0.14;
        animHooks.push((dt) => {
          if (!ring.parent) return;
          life += dt;
          if (life < 0) return;
          const t = life / 0.68;
          if (t >= 1.0) { levelRoot.remove(ring); return; }
          ring.position.copy(origin).addScaledVector(dir, t * reach);
          const sc = 0.75 + t * 2.2;
          ring.scale.set(sc, sc, 1);
          ring.material.opacity = Math.sin(t * Math.PI) * 0.88;
        });
      }
    }

        if (ventCapL) ventCapL.rotation.z += (capTarget - ventCapL.rotation.z) * 0.14;
        if (ventCapR) ventCapR.rotation.z += (-capTarget - ventCapR.rotation.z) * 0.14;

        // 解锁蓄能环呼吸脉冲
        ventUnlockRing.visible = readyGlow;
        if (readyGlow) {
          const pulse = 0.85 + Math.sin(now * 0.008) * 0.25;
          ventUnlockRing.scale.setScalar(pulse * 1.45);
          ventUnlockRing.material.opacity = 0.55 + Math.sin(now * 0.008) * 0.25;
        }

        // 蒸汽排气口烟雾与三灯解锁后金青共振蒸汽柱
        steamBurst = Math.max(0, steamBurst - dt * 0.85);
        steamPuffs.forEach((p) => {
          const speed = readyGlow ? (0.72 + steamBurst * 0.55) : (st.leverPulled ? (0.45 + steamBurst * 0.65) : 0.18);
          p.userData.phase = (p.userData.phase + dt * speed) % 1.0;
          const t = p.userData.phase;
          const rise = readyGlow ? 2.15 : (st.leverPulled ? 1.25 : 0.65);
          const sway = Math.sin(t * 5.0 + now * 0.002 + p.userData.idx) * (readyGlow ? 0.14 : 0.11);
          p.position.set(-2.6 + sway + t * 0.14, 2.30 + t * rise, 1.55 - t * 0.05);
          const sc = (readyGlow ? 0.85 : (st.leverPulled ? 0.68 : 0.36)) + t * (readyGlow ? 1.55 : (1.2 + steamBurst * 0.6));
          p.scale.setScalar(sc);
          if (readyGlow) {
            p.material.color.setHex(p.userData.idx % 2 === 0 ? 0x6ef6ff : 0xffdc78);
            p.material.opacity = Math.sin(t * Math.PI) * 0.78;
          } else {
            p.material.color.setHex(0xf9f3ef);
            p.material.opacity = Math.sin(t * Math.PI) * (st.leverPulled ? 0.56 : 0.24);
          }
        });

        // 3+1 声律锁控屏灯珠光晕呼吸脉冲
        noteGlows.forEach((g, idx) => {
          if (!g || !g.group.visible) return;
          const pulse = 0.88 + Math.sin(now * 0.007 + idx * 1.1) * 0.22;
          g.sphere.scale.setScalar(pulse);
          const rt = ((now * 0.0011 + idx * 0.25) % 1.0);
          g.ring.scale.setScalar(0.85 + rt * 1.15);
          g.ring.material.opacity = (1.0 - rt) * (idx === 3 ? 0.92 : 0.72);
        });

        // 拉闸旋动下压 & 闸门沉降
        if (leverHandle) {
          const levTarget = st.leverPulled ? -Math.PI * 0.16 : Math.PI * 0.16;
          leverHandle.rotation.z += (levTarget - leverHandle.rotation.z) * 0.16;
        }
        const gateY = st.leverPulled ? 0.92 : 1.65;
        stairGateGroup.position.y += (gateY - stairGateGroup.position.y) * 0.14;

        // 绞盘摇把转动联动中央齿轮箱/标徽红手轮/2.06m旋转桥合拢/视差铜管显形伸出
        const rbTarget = st.pipesOut ? 0 : Math.PI / 2;
        rearBridgeGroup.rotation.y += (rbTarget - rearBridgeGroup.rotation.y) * 0.11;
        if (st.pipesOut) {
          winchAngle += dt * 3.2;
          if (winchCrankNode) winchCrankNode.rotation.z = winchAngle;
          gbSpin.forEach((g) => g.node.rotateY(dt * g.speed));
          wheelSpinGroup.rotation.y += dt * 1.4;
          pipeLRoot.visible = true;
          pipeRRoot.visible = true;
          pipeLRoot.scale.x += (1.0 - pipeLRoot.scale.x) * 0.11;
          pipeRRoot.scale.x += (1.0 - pipeRRoot.scale.x) * 0.11;
        } else {
          pipeLRoot.visible = false;
          pipeRRoot.visible = false;
        }

        // 双压力表红指针实时响应系统压力（+2.09=0压 -> -2.00=满压）
        if (steamNeedle) {
          const sTarget = st.pipesOut ? (-1.55 + Math.sin(now * 0.015) * 0.04) : (st.leverPulled ? 0.35 : 2.09);
          steamNeedle.rotation.z += (sTarget - steamNeedle.rotation.z) * 0.12;
        }
        if (waterNeedle) {
          const stages = (st.pipeConnected ? 1 : 0) + (st.pumpFrontDone ? 1 : 0) + (st.pumpRearDone ? 1 : 0);
          const wMap = [2.09, 0.70, -0.65, -2.00];
          waterNeedle.rotation.z += (wMap[stages] - waterNeedle.rotation.z) * 0.10;
        }

        // 水箱水位三档分步攀升（0.01 -> 0.35 -> 0.70 -> 1.00）
        const stages = (st.pipeConnected ? 1 : 0) + (st.pumpFrontDone ? 1 : 0) + (st.pumpRearDone ? 1 : 0);
        const targetFill = [0.01, 0.35, 0.70, 1.00][stages];
        fillProgress += (targetFill - fillProgress) * 0.08;
        if (waterFillNode) waterFillNode.scale.y = Math.max(0.01, fillProgress);

        // 塔顶喇叭与靠塔壁蜗杆转向箱红箭舵轮联动旋转（示范及敲击回响时附带舵轮回弹震颤）
        horns.forEach((h, i) => {
          h.rotation.y += (hornTargetAngles[i] - h.rotation.y) * 0.14;
          if (dialWheels[i]) {
            let kick = 0;
            if (dialKickTimer[i] > 0) {
              dialKickTimer[i] = Math.max(0, dialKickTimer[i] - dt);
              kick = Math.sin(dialKickTimer[i] * 28.0) * 0.24;
            }
            dialWheels[i].rotation.y += (hornTargetAngles[i] + kick - dialWheels[i].rotation.y) * 0.18;
          }
        });

        // 水箱外四层共振音律环随旋律进度与示范节拍逐层显现并呼吸脉冲
        tankResonanceRings.forEach((r, k) => {
          const active = !st.melodySolved && (k < st.melodyProgress || k === demoFlashIdx);
          r.visible = active;
          if (active) {
            const p = 1.0 + Math.sin(now * 0.009 + k * 0.9) * 0.045;
            r.scale.set(p, p, 1.0);
          }
        });

        // 加压泵活塞往复压动动画
        for (let i = 0; i < 2; i++) {
          if (pumpAnimTimer[i] > 0) {
            pumpAnimTimer[i] = Math.max(0, pumpAnimTimer[i] - dt);
            if (pumpPistons[i]) {
              const ph = Math.max(0, Math.sin((1.65 - pumpAnimTimer[i]) * Math.PI * 3.6));
              pumpPistons[i].position.y = pumpBaseY[i] - ph * 0.22;
            }
          } else if (pumpPistons[i]) {
            pumpPistons[i].position.y += (pumpBaseY[i] - pumpPistons[i].position.y) * 0.16;
          }
        }

        // 右阶主水阀转轮与错位漏水喷溅动画
        if (valveReboundTimer > 0) {
          valveReboundTimer = Math.max(0, valveReboundTimer - dt);
          if (valveReboundTimer <= 0 && !st.pipeConnected) valveTarget = 0;
        }
        valveAngle += (valveTarget - valveAngle) * 0.16;
        if (valveWheel) valveWheel.rotation.y = valveAngle;

        if (leakTimer > 0) {
          leakTimer = Math.max(0, leakTimer - dt);
          leakDrops.forEach((d) => {
            d.userData.phase = (d.userData.phase + dt * 1.45) % 1.0;
            const t = d.userData.phase;
            d.visible = true;
            d.position.set(-0.31 + t * 0.12, 4.42 - t * 1.35, -0.26);
            d.material.opacity = (1.0 - t) * Math.min(1.0, leakTimer * 2.0) * 0.85;
          });
        } else {
          leakDrops.forEach((d) => { d.visible = false; });
        }

        // 仅在真正通水时呈现管道水流脉动与高亮（不在 135° 下预先发光剧透）
        if (pipeFlowTimer > 0) pipeFlowTimer = Math.max(0, pipeFlowTimer - dt);
        const flowing = st.pipeConnected && !st.melodySolved && pipeFlowTimer > 0;
        if (flowing) {
          pipePulseGroup.visible = true;
          const p1 = (now * 0.0012) % 1.0;
          const p2 = (now * 0.0012 + 0.5) % 1.0;
          pulseCore.scale.setScalar(1.15);
          pulseRing1.scale.setScalar(0.50 + p1 * 1.10);
          pulseRing1.material.opacity = (1.0 - p1) * 0.85;
          pulseRing2.scale.setScalar(0.50 + p2 * 1.10);
          pulseRing2.material.opacity = (1.0 - p2) * 0.85;
          pipeMats.forEach((m) => {
            m.emissive.setHex(0xffb030);
            m.emissiveIntensity = 0.42 + Math.sin(now * 0.012) * 0.16;
          });
        } else {
          pipePulseGroup.visible = false;
          pipeMats.forEach((m) => { m.emissive.setHex(0x000000); m.emissiveIntensity = 0.0; });
        }

        // 三灯齐亮蓄能待发时的持续微弱声纹提示
        if (readyGlow) {
          readyEchoTimer += dt;
          if (readyEchoTimer > 1.85) {
            readyEchoTimer = 0;
            spawnDirectionalWave(horns[0].position.clone().add(new THREE.Vector3(0.45, 0.56, 0)), new THREE.Vector3(1, 0, 0), 0x4de6ff, 2, 1.5);
            spawnDirectionalWave(horns[1].position.clone().add(new THREE.Vector3(0.40, 0.50, 0)), new THREE.Vector3(1, 0, 0), 0xffd15c, 2, 1.5);
          }
        }

        // 共振触发后：拼花地板门下翻露布尔深井 -> 满水水箱旋转沉井隐没 -> 双门闭平 -> 过渡翻板搭接
        if (st.melodySolved) {
          towerDropTime += dt;
          const smooth = (x) => { const t = Math.max(0, Math.min(1, x)); return t * t * (3 - 2 * t); };
          const maxAng = Math.PI * 0.48;
          if (towerDropTime < 0.90) {
            const k = smooth(towerDropTime / 0.90);
            if (hatchDoorL) hatchDoorL.rotation.z = -maxAng * k;
            if (hatchDoorR) hatchDoorR.rotation.z = maxAng * k;
            waterTowerGroup.position.y = ROOF_Y + 0.16 * Math.sin(k * Math.PI * 0.5);
            waterTowerGroup.rotation.y += dt * 1.4;
          } else if (towerDropTime < 2.40) {
            const k = smooth((towerDropTime - 0.90) / 1.50);
            if (hatchDoorL) hatchDoorL.rotation.z = -maxAng;
            if (hatchDoorR) hatchDoorR.rotation.z = maxAng;
            waterTowerGroup.position.y = ROOF_Y + 0.16 - k * 2.15;
            waterTowerGroup.scale.setScalar(0.78 - 0.08 * k);
            waterTowerGroup.rotation.y += dt * 2.2;
            if (waterTowerGroup.position.y < ROOF_Y - 1.60) waterTowerGroup.visible = false;
          } else {
            const k = 1.0 - smooth((towerDropTime - 2.40) / 1.00);
            if (hatchDoorL) hatchDoorL.rotation.z = -maxAng * k;
            if (hatchDoorR) hatchDoorR.rotation.z = maxAng * k;
            waterTowerGroup.visible = false;
          }
          if (towerDropTime > 2.00) {
            exitFlapGroup.rotation.z += (0.0 - exitFlapGroup.rotation.z) * 0.12;
          }
        }
      });

                : "随着水泵加压，水箱水位又高了一截。", 3200);
              syncAct2();
            }
          }, u.idx === 1 ? "后廊还过不去。" : "眼下还操作不了。");
        } else if (u.type === "act2_dial" || u.type === "act2_horn") {
          const idx = u.idx;
          walkToAndRun(idx === 0 ? "dial_L_pos" : "dial_R_pos", () => {
            // 若水满且双号已共同朝东，锁定机械朝向并切入「四拍双号回声记忆复现」阶段
            if (isResonanceReady() && !st.melodySolved) {
              if (!st.melodyHeard) {
                playHornTone(185.0, 0.25);
                showToast("总锁刚刚才开，不妨先去塔前听听声音。", 3200);
                return;
              }
              if (st.melodyPlaying) {
                showToast("回声还在回荡，稍候片刻。", 2000);
                return;
              }
              dialKickTimer[idx] = 0.45;
              if (idx === MELODY_SEQ[st.melodyProgress]) {
                st.melodyProgress += 1;
                if (st.melodyProgress >= MELODY_SEQ.length) {
                  st.melodySolved = true;
                  demoFlashIdx = -1;
                  steamBurst = 1.6;
                  pulseHorn(idx, 0.65);
                  spawnDirectionalWave(horns[0].position.clone().add(new THREE.Vector3(0.45, 0.56, 0)), new THREE.Vector3(1, 0, 0), 0x4de6ff, 5, 4.8);
                  spawnDirectionalWave(horns[1].position.clone().add(new THREE.Vector3(0.40, 0.50, 0)), new THREE.Vector3(1, 0, 0), 0xffd15c, 5, 5.2);
                  setTimeout(() => { if (window.__act2Token === act2Token) playHornTone(idx === 0 ? 369.99 : 246.94, 0.85); }, 180);
                  setTimeout(() => { if (window.__act2Token === act2Token) playHornTone(493.88, 1.0); }, 320);
                  focusCutscene({ x: BOILER_X, y: ROOF_Y + 0.45, z: BOILER_Z }, 1.72, 4200);
                  showToast("四拍合鸣！水匣旋沉入井，翻板缓缓搭平。", 4200);
                } else {
                  pulseHorn(idx, 0.48);
                  showToast("声浪击中水匣，光环随之点亮。", 2400);
                }
              } else {
                st.melodyProgress = 0;
                playHornTone(146.83, 0.36, "error");
                showToast("四声回音消散在双塔间。", 2800);
              }
              syncAct2();
              return;

            if (st.melodySolved) {

              pulseHorn(idx, 0.35);
              showToast("回声已定，拼花屋顶通行无阻。", 2400);

            hornTargetAngles[idx] -= Math.PI / 2;
            setTimeout(() => { if (window.__act2Token === act2Token) pulseHorn(idx, 0.42); }, 180);

            if (isResonanceReady() && !st.resonanceUnlocked) {

            }
          });
        } else if (u.type === "act2_goal") {

            "balcony_goal",
            navNodes.balcony_goal.onArrive,
            "前方阻断，翻板还没有搭下来。"

    // =========================================================================

      const sctx = starCanvas.getContext("2d");
      const drawStars = () => {
        starCanvas.width = window.innerWidth;
        starCanvas.height = window.innerHeight;
        sctx.clearRect(0, 0, starCanvas.width, starCanvas.height);
        for (let i = 0; i < 140; i++) {
          const sx = ((Math.sin(i * 12.9898) * 43758.5453) % 1 + 1) % 1;
          const sy = ((Math.sin(i * 78.233) * 29431.713) % 1 + 1) % 1;
          const r = (i % 7 === 0) ? 1.55 : ((i % 3 === 0) ? 1.05 : 0.72);
          const a = (i % 5 === 0) ? 0.88 : 0.50;
          sctx.fillStyle = (i % 9 === 0) ? `rgba(182, 224, 255, ${a})` : `rgba(255, 250, 232, ${a})`;
          sctx.beginPath();
          sctx.arc(sx * starCanvas.width, sy * starCanvas.height * 0.72, r, 0, Math.PI * 2);
          sctx.fill();
        }
      };
      drawStars();
      window.addEventListener("resize", drawStars);
      act1Cleanups.push(() => window.removeEventListener("resize", drawStars));
      wrap.prepend(starCanvas);

      function playShipWhistle() {
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === "suspended") audioCtx.resume();
          const now = audioCtx.currentTime;
          [110.0, 146.83, 220.0].forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const filt = audioCtx.createBiquadFilter();
            const g = audioCtx.createGain();
            osc.type = idx === 2 ? "triangle" : "sawtooth";
            osc.frequency.setValueAtTime(freq, now);
            osc.frequency.exponentialRampToValueAtTime(freq * 0.96, now + 2.1);
            filt.type = "lowpass";
            filt.frequency.setValueAtTime(520, now);
            g.gain.setValueAtTime(0.001, now);
            g.gain.exponentialRampToValueAtTime(idx === 0 ? 0.22 : 0.12, now + 0.18);
            g.gain.setValueAtTime(idx === 0 ? 0.20 : 0.10, now + 1.45);
            g.gain.exponentialRampToValueAtTime(0.001, now + 2.35);
            osc.connect(filt);
            filt.connect(g);
            g.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 2.40);
          });
        } catch (e) {}
      }

        const hub = new THREE.Mesh(new THREE.CylinderGeometry(rOut * 0.36, rOut * 0.36, thick * 1.38, 16), matHub);

        g.add(rim, hub);
        const nTeeth = 12;
        for (let k = 0; k < nTeeth; k++) {

          const tooth = new THREE.Mesh(new THREE.BoxGeometry(rOut * 0.22, thick * 0.92, rOut * 0.18), matRim);

      [-0.032, 0.032].forEach((ox) => {

      document.getElementById("a3-bp-close").addEventListener("click", (e) => { e.stopPropagation(); closeAct3Pads(); });

      function completeSeaValveOpen() {
        if (st.steamOpened) return;
        st.steamOpened = true;
        seaValveTarget = Math.PI * 3.0;
        closeAct3Pads();
        playWaterRush();
        showToast("海水蒸汽涌入控制箱管路，压力指针缓缓拉满。", 3800);
        syncAct3();
      }

      function completeBellBoltOpen() {
        if (!st.steamOpened) {
          boltShakeTimer = 0.45;
          playHornTone(146.83, 0.24, "error");
          showToast("管内尚无海水蒸汽，螺栓咬合不起动大钟。", 2800);
          return;
        }
        if (st.bellBoltOpened) return;
        st.bellBoltOpened = true;
        bellBoltTarget = Math.PI * 5.0;
        closeAct3Pads();
        playRatchetTick(1.1);
        showToast("螺栓旋开咬合！齿轮传动拉响拱门大钟。", 3600);
        // 大钟三连鸣并反哺机箱蓄电
        [0, 620, 1260].forEach((ms, k) => {
          setTimeout(() => {
            if (window.__act3Token !== act3Token) return;
            bellSwing = Math.max(bellSwing, 0.34 + k * 0.04);
            bellPowerBoost = 2.6;
            playBellChime();
            if (k === 2) {
              st.bellCharged = true;
              showToast("钟声余韵传回机箱，控制箱流转起暖金电力。", 3800);
              syncAct3();
            }
          }, ms);
        });
        syncAct3();
      }

      function pullBellForGate() {
        if (!st.lockUnlocked) {
          bellSwing = Math.max(bellSwing, 0.16);
          playBellChime();
          showToast("钟声沉郁，船闸处的链轮似乎还被锁着。", 3000);
          return;
        }
        if (st.gateRaised) {
          bellSwing = Math.max(bellSwing, 0.18);
          playBellChime();
          showToast("重木闸门已沉入水下锁定。", 2400);
          return;
        }
        bellBoltTarget += Math.PI * 1.2;
        bellSwing = Math.min(0.46, Math.max(bellSwing, 0.28) + 0.14);
        bellPowerBoost = 3.8;
        triggerHeroInteract();
        gateLiftTarget = Math.min(1.0, +(gateLiftTarget + 0.20).toFixed(2));
        playBellChime();
        playRatchetTick(0.95 + gateLiftTarget * 0.45);
        const pct = Math.round(gateLiftTarget * 100);
        if (liftFillEl) liftFillEl.style.width = `${pct}%`;
        if (gateLiftTarget >= 0.99) {
          st.gateRaised = true;
          if (bpSubEl) bpSubEl.textContent = "✨ 重木闸门已完全沉入水下，航道畅通！";
          showToast("伴随最后一声洪亮钟鸣，重木闸门缓缓沉入水下，夜海航道洞开。", 4200);
          setTimeout(() => {
            if (window.__act3Token === act3Token) bellPad.classList.remove("show");
          }, 950);
        } else {
          if (bpSubEl) bpSubEl.textContent = `链轮下放中：船闸门开启 ${pct}%`;
          showToast("大钟摇晃驱动链轮，重木闸门缓缓向下沉降。", 2200);
        }
        syncAct3();
      }

      document.getElementById("a3-btn-turn-bolt").addEventListener("click", (e) => {
        e.stopPropagation();
        triggerHeroInteract();
        completeBellBoltOpen();
      });

      document.getElementById("a3-btn-pull").addEventListener("click", (e) => {
        e.stopPropagation();
        pullBellForGate();
      });

      const onVpDown = (e) => {
        if (currentAct !== 3 || st.steamOpened) return;
        e.preventDefault(); e.stopPropagation();
        vpActive = true; vpStartX = e.clientX;
      };
      const onBtDown = (e) => {
        if (currentAct !== 3 || !st.steamOpened || st.bellBoltOpened) return;
        e.preventDefault(); e.stopPropagation();
        bpActive = true; bpStartX = e.clientX;
      };
      const onVpMove = (e) => {
        if (vpActive) {
          const dx = Math.max(-96, Math.min(96, e.clientX - vpStartX));
          valveKnobEl.style.transform = `translateX(${dx}px)`;
          if (dx >= 0) {
            valveFillEl.style.left = "50%";
            valveFillEl.style.width = `${dx}px`;
            valveFillEl.style.background = "linear-gradient(90deg, rgba(63,208,184,0.35), rgba(242,192,86,0.78))";
          } else {
            valveFillEl.style.left = `calc(50% + ${dx}px)`;
            valveFillEl.style.width = `${-dx}px`;
            valveFillEl.style.background = "linear-gradient(90deg, rgba(242,192,86,0.78), rgba(63,208,184,0.35))";
          }
          seaValveTarget = (dx / 72) * Math.PI * 1.4;
          if (Math.abs(dx) >= 72) {
            completeSeaValveOpen();
          }
        }
        if (bpActive) {
          const dx = Math.max(-96, Math.min(96, e.clientX - bpStartX));
          boltKnobEl.style.transform = `translateX(${dx}px)`;
          if (dx >= 0) {
            boltFillEl.style.left = "50%";
            boltFillEl.style.width = `${dx}px`;
            boltFillEl.style.background = "linear-gradient(90deg, rgba(63,208,184,0.35), rgba(242,192,86,0.78))";
          } else {
            boltFillEl.style.left = `calc(50% + ${dx}px)`;
            boltFillEl.style.width = `${-dx}px`;
            boltFillEl.style.background = "linear-gradient(90deg, rgba(242,192,86,0.78), rgba(63,208,184,0.35))";
          }
          bellBoltTarget = (dx / 72) * Math.PI * 1.8;
          if (Math.abs(dx) >= 72) {
            completeBellBoltOpen();
          }
        }
      };
      const onVpUp = () => {
        if (vpActive) {
          vpActive = false;
          if (!st.steamOpened) seaValveTarget = 0;
          if (valveKnobEl) valveKnobEl.style.transform = "translateX(0px)";
          if (valveFillEl) { valveFillEl.style.left = "50%"; valveFillEl.style.width = "0px"; }
        }
        if (bpActive) {
          bpActive = false;
          if (!st.bellBoltOpened) bellBoltTarget = 0;
          if (boltKnobEl) boltKnobEl.style.transform = "translateX(0px)";
          if (boltFillEl) { boltFillEl.style.left = "50%"; boltFillEl.style.width = "0px"; }
        }
      };
      valveTrackEl.addEventListener("pointerdown", onVpDown);
      boltTrackEl.addEventListener("pointerdown", onBtDown);
      window.addEventListener("pointermove", onVpMove);
      window.addEventListener("pointerup", onVpUp);
      window.addEventListener("pointercancel", onVpUp);
      act1Cleanups.push(() => {
        valveTrackEl.removeEventListener("pointerdown", onVpDown);
        boltTrackEl.removeEventListener("pointerdown", onBtDown);
        window.removeEventListener("pointermove", onVpMove);
        window.removeEventListener("pointerup", onVpUp);
        window.removeEventListener("pointercancel", onVpUp);
      });

      // 3D 直接拖拽拧阀 / 旋螺栓 / 摇钟支持（点击则走上相应点位弹出浮条）
      const drag3D = { active: false, kind: null, startX: 0, maxAbs: 0, lastPullX: 0 };
      const onAct3DragDown = (e) => {
        if (currentAct !== 3 || e.button !== 0 || e.target !== renderer.domElement) return;
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const hits = raycaster.intersectObjects(clickables.filter(isObjWorldVisible), false);
        if (!hits.length) return;
        const u = hits[0].object.userData || {};
        if (u.type === "act3_sea_valve" && !st.steamOpened) {
          e.stopImmediatePropagation(); e.preventDefault();
          closeNpcDialog();
          drag3D.active = true; drag3D.kind = "valve"; drag3D.startX = e.clientX; drag3D.maxAbs = 0;
        } else if (u.type === "act3_bell_bolt" && st.steamOpened && !st.bellBoltOpened) {
          e.stopImmediatePropagation(); e.preventDefault();
          closeNpcDialog();
          drag3D.active = true; drag3D.kind = "bolt"; drag3D.startX = e.clientX; drag3D.maxAbs = 0;
        } else if ((u.type === "act3_bell_bolt" || u.type === "act3_bell_rope") && st.lockUnlocked && !st.gateRaised) {
          e.stopImmediatePropagation(); e.preventDefault();
          closeNpcDialog();
          drag3D.active = true; drag3D.kind = "bell"; drag3D.startX = e.clientX; drag3D.maxAbs = 0; drag3D.lastPullX = e.clientX;
        }
      };
      const onAct3DragMove = (e) => {
        if (!drag3D.active) return;
        e.stopImmediatePropagation();
        const dx = e.clientX - drag3D.startX;
        drag3D.maxAbs = Math.max(drag3D.maxAbs, Math.abs(dx));
        if (drag3D.kind === "valve") {
          seaValveTarget = (dx / 80) * Math.PI * 1.4;
          if (Math.abs(dx) >= 80) {
            drag3D.active = false;
            walkToAndRun("sea_valve", () => completeSeaValveOpen(), unreachText());
          }
        } else if (drag3D.kind === "bolt") {
          bellBoltTarget = (dx / 75) * Math.PI * 1.8;
          if (Math.abs(dx) >= 75) {
            drag3D.active = false;
            walkToAndRun("stair_top", () => completeBellBoltOpen(), unreachText());
          }
        } else if (drag3D.kind === "bell") {
          if (Math.abs(e.clientX - drag3D.lastPullX) >= 66) {
            drag3D.lastPullX = e.clientX;
            walkToAndRun("stair_top", () => pullBellForGate(), unreachText());
          }
        }
      };
      const onAct3DragUp = (e) => {
        if (!drag3D.active) return;
        e.stopImmediatePropagation();
        const wasClick = drag3D.maxAbs < 12;
        const kind = drag3D.kind;
        drag3D.active = false;
        if (!st.steamOpened && kind === "valve") seaValveTarget = 0;
        if (!st.bellBoltOpened && kind === "bolt") bellBoltTarget = 0;
        if (wasClick) {
          if (kind === "valve") {
            walkToAndRun("sea_valve", () => {
              closeNpcDialog();
              closeAct3Pads();
              syncBottomFloatPanels();
              valvePad.classList.add("show");
            }, unreachText());
          } else if (kind === "bolt") {
            walkToAndRun("stair_top", () => {
              closeNpcDialog();
              closeAct3Pads();
              syncBottomFloatPanels();
              boltPad.classList.add("show");
            }, unreachText());
          } else if (kind === "bell") {
            walkToAndRun("stair_top", () => {
              closeNpcDialog();
              closeAct3Pads();
              syncBottomFloatPanels();
              if (liftFillEl) liftFillEl.style.width = `${Math.round(gateLiftTarget * 100)}%`;
              bellPad.classList.add("show");
              pullBellForGate();
            }, unreachText());
          }
        }
      };
      renderer.domElement.addEventListener("pointerdown", onAct3DragDown, true);
      window.addEventListener("pointermove", onAct3DragMove, true);
      window.addEventListener("pointerup", onAct3DragUp, true);
      window.addEventListener("pointercancel", onAct3DragUp, true);
      act1Cleanups.push(() => {
        renderer.domElement.removeEventListener("pointerdown", onAct3DragDown, true);
        window.removeEventListener("pointermove", onAct3DragMove, true);
        window.removeEventListener("pointerup", onAct3DragUp, true);
        window.removeEventListener("pointercancel", onAct3DragUp, true);
      });

      // 独立 3D 星海明月终局动画（真实 Rodin 3D 明轮船模型沿月光海路向正前方满月远航的船尾背影镜头）
      function showFinaleMoonSea() {
        if (st.finaleShown) return;
        st.finaleShown = true;
        closeNpcDialog();
        closeAct3Pads();

        const titleEl = document.getElementById("a3-finale-title");
        const poemEl = document.getElementById("a3-finale-poem");
        if (storyMemory.endingChoice === "broadcast") {
          titleEl.textContent = "破晓回响 · 星海远航";
          poemEl.textContent = "重木闸门已沉入夜海，明轮犁开月光海路；待第一缕晨风抵达云港，整座城都会听见蜡筒里的真实钟声。";
        } else if (storyMemory.endingChoice === "ferry") {
          titleEl.textContent = "暗夜渡火 · 明月归途";
          poemEl.textContent = "缆绳尽解，明轮船护着底层证人与校时副本悄悄驶入银辉夜海，星辰与月色正为微光引航。";
        } else {
          titleEl.textContent = "夜潮启航 · 月海长途";
          poemEl.textContent = "拱门古钟的余韵渐远，满载余温的蒸汽明轮船驶向星海尽头的皎洁明月。";
        }

        const curtainEl = document.getElementById("a3-finale-curtain");
        let finaleDisposed = false;
        const ownedDisposables = [];
        const trackOwn = (obj) => { if (obj) ownedDisposables.push(obj); return obj; };

        const FINALE_SEA_VERT = `
          varying vec3 vWorldPos;
          void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPos = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `;
        const FINALE_SEA_FRAG = `
          precision highp float;
          uniform float uTime;
          uniform vec3 uCamPos;
          uniform vec3 uShipPos;
          varying vec3 vWorldPos;

          float waveSample(vec2 p, vec2 dir, float freq, float spd, out vec2 grad) {
            float ph = dot(p, dir) * freq + uTime * spd;
            float s = sin(ph);
            float c = cos(ph);
            grad = dir * freq * c;
            return s;
          }

          void main() {
            vec2 wp = vWorldPos.xz;
            vec2 g1, g2, g3, g4;
            waveSample(wp, normalize(vec2( 0.35,  0.94)), 1.55, -2.10, g1);
            waveSample(wp, normalize(vec2(-0.52,  0.85)), 2.85, -1.75, g2);
            waveSample(wp, normalize(vec2( 0.78, -0.62)), 4.60,  2.40, g3);
            waveSample(wp, normalize(vec2(-0.88, -0.47)), 7.20,  2.95, g4);
            vec2 gradSum = g1 * 0.015 + g2 * 0.011 + g3 * 0.007 + g4 * 0.004;
            vec3 N = normalize(vec3(-gradSum.x, 1.0, -gradSum.y));

            vec3 V = normalize(uCamPos - vWorldPos);
            float fresnel = pow(1.0 - clamp(dot(N, V), 0.0, 1.0), 4.0);
            vec3 deepCol = vec3(0.016, 0.052, 0.145);
            vec3 midCol  = vec3(0.036, 0.112, 0.270);
            vec3 skyRefl = vec3(0.088, 0.215, 0.455);
            vec3 col = mix(deepCol, midCol, 0.38 + 0.28 * N.z);
            col = mix(col, skyRefl, fresnel * 0.72);

            // 严格对准正前方满月 (0.0, 26.0, -195.0) 的双层碎金月光海路高光
            vec3 moonDir = normalize(vec3(0.0, 26.0, -195.0) - vWorldPos);
            vec3 H = normalize(V + moonDir);
            float ndh = max(dot(N, H), 0.0);
            float moonRoadBroad = pow(ndh, 38.0) * 0.42;
            float moonRoadSpark = pow(ndh, 240.0) * 1.45;
            col += vec3(0.68, 0.80, 1.00) * moonRoadBroad;
            col += vec3(1.00, 0.90, 0.64) * moonRoadSpark;

            // 船尾对称 V 形开浪波纹与克制中轴明轮泡沫（严格随船位移动）
            float dz = vWorldPos.z - (uShipPos.z + 2.55);
            float dx = abs(vWorldPos.x - uShipPos.x);
            if (dz > 0.0) {
              float fadeTail = exp(-dz * 0.072) * smoothstep(0.0, 0.85, dz);
              float vLine = abs(dx - (0.76 + dz * 0.33));
              float vWave = exp(-vLine * vLine * 3.8) * (0.55 + 0.45 * sin(dz * 3.2 - uTime * 4.4));
              float midFoam = exp(-dx * dx * 3.4) * exp(-dz * 0.16) * (0.52 + 0.48 * sin(dz * 5.0 - uTime * 6.2 + wp.x * 4.0));
              float wakeAlpha = clamp((vWave * 0.48 + midFoam * 0.36) * fadeTail, 0.0, 0.44);
              col = mix(col, vec3(0.76, 0.88, 1.00), wakeAlpha);
            }

            // 围绕明轮船暖光船舱的水波金辉倒影
            vec2 sOff = (wp - uShipPos.xz) * vec2(0.82, 0.48);
            float boatGlow = exp(-dot(sOff, sOff) * 0.075);
            float rippleMod = 0.62 + 0.38 * sin(N.x * 18.0 + N.z * 24.0 + uTime * 2.5);
            col += vec3(1.00, 0.72, 0.30) * boatGlow * rippleMod * 0.34;

            // 远海平滑融入海天夜雾 (#132d64 近似线性色调)
            float camDist = length(uCamPos - vWorldPos);
            float fogFactor = 1.0 - exp(-pow(camDist * 0.0040, 2.0));
            col = mix(col, vec3(0.042, 0.118, 0.290), clamp(fogFactor, 0.0, 1.0));

            gl_FragColor = vec4(col, 1.0);
          }
        `;

        // 构建独立 3D 终局远航场景
        const finaleScene = new THREE.Scene();
        finaleScene.background = new THREE.Color(0x030a1e);
        finaleScene.fog = new THREE.FogExp2(0x091b42, 0.0040);
        finaleScene.environment = duskEnvTex;
        finaleScene.environmentIntensity = 0.65;

        const syncFinaleCam = (w, h) => {
          const a = w / Math.max(h, 1);
          finaleCam.aspect = a;
          finaleCam.fov = a < 1.0 ? Math.min(62, Math.round(42 / Math.pow(Math.max(a, 0.46), 0.50))) : 42;
          finaleCam.updateProjectionMatrix();
        };
        const finaleCam = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.2, 600);
        syncFinaleCam(window.innerWidth, window.innerHeight);

        // 1. 渐层夜空球穹 + 正前方月亮微华散射
        const skyDomeGeo = trackOwn(new THREE.SphereGeometry(360, 32, 24));
        const skyDomeMat = trackOwn(new THREE.ShaderMaterial({
          side: THREE.BackSide,
          depthWrite: false,
          fog: false,
          vertexShader: `varying vec3 vDir; void main() { vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
          fragmentShader: `
            varying vec3 vDir;
            void main() {
              float h = clamp(vDir.y, 0.0, 1.0);
              vec3 zenith  = vec3(0.008, 0.024, 0.086);
              vec3 midSky  = vec3(0.024, 0.082, 0.220);
              vec3 horizon = vec3(0.075, 0.176, 0.392);
              vec3 c = mix(horizon, midSky, smoothstep(0.0, 0.22, h));
              c = mix(c, zenith, smoothstep(0.20, 0.72, h));
              float moonHalo = max(dot(normalize(vDir), normalize(vec3(0.0, 0.135, -1.0))), 0.0);
              c += vec3(0.18, 0.28, 0.48) * pow(moonHalo, 6.0) * 0.45;
              gl_FragColor = vec4(c, 1.0);
            }
          `,
        }));
        finaleScene.add(new THREE.Mesh(skyDomeGeo, skyDomeMat));

        // 2. 460 颗上半球闪烁繁星 + 偶发流星
        const STAR_CNT = 460;
        const starPos = new Float32Array(STAR_CNT * 3);
        const starCol = new Float32Array(STAR_CNT * 3);
        const starSeed = new Float32Array(STAR_CNT);
        const starPalette = [
          new THREE.Color(0xffffff),
          new THREE.Color(0xbce0ff),
          new THREE.Color(0xffe6ad),
        ];
        for (let i = 0; i < STAR_CNT; i++) {
          const theta = ((Math.sin(i * 12.9898) * 43758.5453) % 1 + 1) % 1 * Math.PI * 2;
          const phi = Math.acos(0.05 + 0.92 * (((Math.sin(i * 78.233) * 29431.71) % 1 + 1) % 1));
          const r = 310;
          starPos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
          starPos[i * 3 + 1] = r * Math.cos(phi);
          starPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
          const cc = starPalette[i % 9 === 0 ? 1 : (i % 13 === 0 ? 2 : 0)];
          starCol[i * 3] = cc.r; starCol[i * 3 + 1] = cc.g; starCol[i * 3 + 2] = cc.b;
          starSeed[i] = ((Math.sin(i * 45.164) * 18432.1) % 1 + 1) % 1 * 10.0;
        }
        const starGeo = trackOwn(new THREE.BufferGeometry());
        starGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
        starGeo.setAttribute("aColor", new THREE.BufferAttribute(starCol, 3));
        starGeo.setAttribute("aSeed", new THREE.BufferAttribute(starSeed, 1));
        const starMat = trackOwn(new THREE.ShaderMaterial({
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          fog: false,
          uniforms: { uTime: { value: 0 } },
          vertexShader: `
            attribute vec3 aColor;
            attribute float aSeed;
            uniform float uTime;
            varying vec3 vColor;
            varying float vAlpha;
            void main() {
              vColor = aColor;
              vAlpha = 0.42 + 0.58 * (0.5 + 0.5 * sin(uTime * (1.2 + mod(aSeed, 2.2)) + aSeed * 6.28));
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              gl_PointSize = 1.6 + mod(aSeed * 7.0, 2.2);
            }
          `,
          fragmentShader: `
            varying vec3 vColor;
            varying float vAlpha;
            void main() {
              float d = length(gl_PointCoord - vec2(0.5));
              if (d > 0.5) discard;
              float soft = smoothstep(0.5, 0.08, d);
              gl_FragColor = vec4(vColor, soft * vAlpha);
            }
          `,
        }));
        finaleScene.add(new THREE.Points(starGeo, starMat));

        const meteorGeo = trackOwn(new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(-12, 5.5, 0),
        ]));
        const meteorMat = trackOwn(new THREE.LineBasicMaterial({ color: 0xeaf4ff, transparent: true, opacity: 0.0, fog: false }));
        const meteorLine = new THREE.Line(meteorGeo, meteorMat);
        finaleScene.add(meteorLine);

        // 3. 正前方高悬硕大皎洁满月 + 双层渐晕月华
        const moonC = document.createElement("canvas");
        moonC.width = 256; moonC.height = 256;
        const mctx = moonC.getContext("2d");
        const mBg = mctx.createRadialGradient(108, 104, 18, 128, 128, 128);
        mBg.addColorStop(0.0, "#fffef6");
        mBg.addColorStop(0.68, "#f9ecc6");
        mBg.addColorStop(1.0, "#e5d29f");
        mctx.fillStyle = mBg;
        mctx.fillRect(0, 0, 256, 256);
        mctx.fillStyle = "rgba(196, 178, 138, 0.22)";
        [[92, 96, 30], [156, 118, 36], [116, 162, 24], [148, 78, 18], [76, 146, 20]].forEach(([mx, my, mr]) => {
          mctx.beginPath(); mctx.arc(mx, my, mr, 0, Math.PI * 2); mctx.fill();
        });
        const moonTex = trackOwn(new THREE.CanvasTexture(moonC));
        moonTex.colorSpace = THREE.SRGBColorSpace;
        const moonGeo = trackOwn(new THREE.SphereGeometry(14.5, 36, 28));
        const moonMat = trackOwn(new THREE.MeshBasicMaterial({ map: moonTex, fog: false }));
        const moonMesh = new THREE.Mesh(moonGeo, moonMat);
        moonMesh.position.set(0.0, 26.0, -195.0);
        finaleScene.add(moonMesh);

        const makeHaloTex = (innerCol, midCol) => {
          const hc = document.createElement("canvas");
          hc.width = 128; hc.height = 128;
          const hctx = hc.getContext("2d");
          const hg = hctx.createRadialGradient(64, 64, 6, 64, 64, 64);
          hg.addColorStop(0.0, innerCol);
          hg.addColorStop(0.42, midCol);
          hg.addColorStop(1.0, "rgba(8, 22, 58, 0.0)");
          hctx.fillStyle = hg;
          hctx.fillRect(0, 0, 128, 128);
          return trackOwn(new THREE.CanvasTexture(hc));
        };
        const haloInTex = makeHaloTex("rgba(255, 246, 212, 0.62)", "rgba(255, 226, 158, 0.20)");
        const haloOutTex = makeHaloTex("rgba(182, 218, 255, 0.26)", "rgba(102, 162, 240, 0.08)");
        const haloInMat = trackOwn(new THREE.SpriteMaterial({ map: haloInTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
        const haloOutMat = trackOwn(new THREE.SpriteMaterial({ map: haloOutTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
        const haloIn = new THREE.Sprite(haloInMat);
        haloIn.scale.set(56, 56, 1);
        haloIn.position.copy(moonMesh.position);
        const haloOut = new THREE.Sprite(haloOutMat);
        haloOut.scale.set(138, 138, 1);
        haloOut.position.copy(moonMesh.position);
        finaleScene.add(haloOut, haloIn);

        // 4. 独立无垠动态夜海平面（Shader）
        const seaGeo = trackOwn(new THREE.PlaneGeometry(520, 420, 1, 1));
        seaGeo.rotateX(-Math.PI / 2);
        const seaUniforms = {
          uTime: { value: 0 },
          uCamPos: { value: new THREE.Vector3() },
          uShipPos: { value: new THREE.Vector3(0, -0.22, -1.5) },
        };
        const seaMat = trackOwn(new THREE.ShaderMaterial({
          uniforms: seaUniforms,
          vertexShader: FINALE_SEA_VERT,
          fragmentShader: FINALE_SEA_FRAG,
        }));
        const seaMesh = new THREE.Mesh(seaGeo, seaMat);
        seaMesh.position.set(0, 0, -145);
        finaleScene.add(seaMesh);

        // 5. 电影级三点夜海布光
        const rimMoonLight = new THREE.DirectionalLight(0xd2e4ff, 1.85);
        rimMoonLight.position.set(0, 32, -160);
        const hemiNight = new THREE.HemisphereLight(0x5276b8, 0x102048, 0.95);
        finaleScene.add(rimMoonLight, hemiNight);

        // 6. 真实 Rodin 3D 明轮船背影（船尾朝 +Z 镜头，船头朝 -Z 满月）
        const finaleShipGroup = new THREE.Group();
        finaleShipGroup.position.set(0.0, -0.22, -1.5);
        finaleScene.add(finaleShipGroup);

        const attachSteamer = (srcScene) => {
          const clone = srcScene.clone(true);
          clone.scale.setScalar(3.35);
          clone.rotation.y = Math.PI;
          finaleShipGroup.add(clone);
        };
        if (glbCache["act3_paddle_steamer"]) {
          attachSteamer(glbCache["act3_paddle_steamer"]);
        } else {
          gltfLoader.load("./assets/act3_paddle_steamer.glb?v=38", (gltf) => {
            if (finaleDisposed) return;
            enhanceMaterials(gltf.scene);
            glbCache["act3_paddle_steamer"] = gltf.scene;
            attachSteamer(gltf.scene);
          }, undefined, () => {});
        }

        // 随船暖金点光源组（映亮船尾雕花、船舱暖窗与两侧明轮）
        const fLightStern = new THREE.PointLight(0xffbd56, 6.5, 11.0, 1.4);
        fLightStern.position.set(0.0, 2.35, 3.65);
        const fLightPort = new THREE.PointLight(0xffb448, 4.5, 10.0, 1.4);
        fLightPort.position.set(-2.2, 1.50, 0.20);
        const fLightStbd = new THREE.PointLight(0xffb448, 4.5, 10.0, 1.4);
        fLightStbd.position.set(2.2, 1.50, 0.20);
        const fLightBow = new THREE.PointLight(0xffc966, 3.5, 9.0, 1.4);
        fLightBow.position.set(0.0, 2.20, -3.50);
        finaleShipGroup.add(fLightStern, fLightPort, fLightStbd, fLightBow);

        // 船尾露台面向满月远眺的主角背影（接入 Rodin 骨骼绑定主角：Idle 海风呼吸）
        const finaleHero = new THREE.Group();
        const fhFallback = new THREE.Group();
        const fhBody = new THREE.Mesh(trackOwn(new THREE.CylinderGeometry(0.18, 0.24, 1.15, 16)), MAT.hero);
        fhBody.position.y = 0.575;
        const fhHead = new THREE.Mesh(trackOwn(new THREE.SphereGeometry(0.19, 16, 12)), MAT.ivory);
        fhHead.position.y = 1.32;
        fhFallback.add(fhBody, fhHead);
        finaleHero.add(fhFallback);
        finaleHero.scale.setScalar(0.68);
        finaleHero.position.set(0.0, 1.62, 3.05);
        finaleShipGroup.add(finaleHero);

        let finaleHeroActor = null;
        loadRiggedCharacter("char_hero_rigged", (srcScene, clips) => {
          if (finaleDisposed) return;
          finaleHeroActor = createRiggedActor(srcScene, clips, { castShadow: false, receiveShadow: false, defaultAnim: "Idle" });
          finaleHeroActor.root.rotation.y = Math.PI;
          finaleHero.add(finaleHeroActor.root);
          fhFallback.visible = false;
          trackOwn({ dispose: () => { if (finaleHeroActor) { finaleHeroActor.dispose(); finaleHeroActor = null; } } });
        });

        // 双侧动态旋转明轮外翼片
        const wheelBladeGeo = trackOwn(new THREE.BoxGeometry(0.20, 0.72, 0.08));
        const wheelHubGeo = trackOwn(new THREE.CylinderGeometry(0.14, 0.14, 0.26, 12));
        const fWheels = [-1.42, 1.42].map((wx) => {
          const wg = new THREE.Group();
          wg.position.set(wx, 0.74, 0.68);
          const hub = new THREE.Mesh(wheelHubGeo, MAT.copper);
          hub.rotation.z = Math.PI / 2;
          wg.add(hub);
          for (let k = 0; k < 6; k++) {
            const a = (k / 6) * Math.PI * 2;
            const blade = new THREE.Mesh(wheelBladeGeo, MAT.brass);
            blade.position.set(0, Math.sin(a) * 0.34, Math.cos(a) * 0.34);
            blade.rotation.x = -a;
            wg.add(blade);
          }
          finaleShipGroup.add(wg);
          return wg;
        });

        // 双烟囱白烟粒子（16 团）与船尾水雾浪花（12 枚）
        const puffGeo = trackOwn(new THREE.SphereGeometry(0.22, 10, 8));
        const fSmokePuffs = Array.from({ length: 16 }, (_, i) => {
          const m = trackOwn(new THREE.MeshBasicMaterial({ color: 0xe6f0ff, transparent: true, opacity: 0.0 }));
          const sp = new THREE.Mesh(puffGeo, m);
          sp.userData = { ph: i / 16, stack: i % 2 };
          finaleShipGroup.add(sp);
          return sp;
        });
        const sprayGeo = trackOwn(new THREE.SphereGeometry(0.15, 8, 6));
        const fSprayPuffs = Array.from({ length: 12 }, (_, i) => {
          const m = trackOwn(new THREE.MeshBasicMaterial({ color: 0xffe7b2, transparent: true, opacity: 0.0 }));
          const sp = new THREE.Mesh(sprayGeo, m);
          sp.userData = { ph: i / 12, side: i % 2 === 0 ? -1 : 1 };
          finaleShipGroup.add(sp);
          return sp;
        });

        const disposeFinaleResources = () => {
          if (finaleDisposed) return;
          finaleDisposed = true;
          while (ownedDisposables.length) {
            const d = ownedDisposables.pop();
            try { if (d && d.dispose) d.dispose(); } catch (e) {}
          }
        };

        const cleanupFinale3D = () => {
          disposeFinaleResources();
          if (customFinaleRenderer && customFinaleRenderer._tag === act3Token) {
            customFinaleRenderer = null;
          }
          document.body.classList.remove("finale-3d-mode");
          if (curtainEl) curtainEl.classList.remove("dark");
          finaleOverlay.classList.remove("show");
        };

        let startSecMs = null;

        // 7. 平滑黑幕转场入画
        if (curtainEl) curtainEl.classList.add("dark");
        const tEnter = setTimeout(() => {
          if (finaleDisposed || window.__act3Token !== act3Token) return;
          startSecMs = performance.now();
          document.body.classList.add("finale-3d-mode");
          finaleOverlay.classList.add("show");
          customFinaleRenderer = {
            _tag: act3Token,
            resize(w, h) {
              syncFinaleCam(w, h);
            },
            render(dt, now) {
              if (finaleDisposed) return;
              const sec = Math.max(0, (now - startSecMs) * 0.001);
              starMat.uniforms.uTime.value = sec;
              seaUniforms.uTime.value = sec;

              // 船沿 -Z 月光海路平滑驶向远方满月（前 4 秒近距离清晰观赏船尾雕花，随后缓缓航入深海）
              const sailDist = 26.0 * (1.0 - Math.exp(-sec * 0.055));
              finaleShipGroup.position.set(
                Math.sin(sec * 0.45) * 0.16,
                -0.22 + Math.sin(sec * 1.9) * 0.06,
                -1.5 - sailDist
              );
              finaleShipGroup.rotation.x = Math.sin(sec * 1.7) * 0.018;
              finaleShipGroup.rotation.z = Math.sin(sec * 1.35 + 0.6) * 0.022;
              seaUniforms.uShipPos.value.copy(finaleShipGroup.position);

              // 明轮旋转、烟囱白烟、船尾水雾粒子与船尾主角骨骼更新
              if (finaleHeroActor) finaleHeroActor.update(dt);
              fWheels.forEach((wg) => { wg.rotation.x += dt * 4.2; });
              fSmokePuffs.forEach((sp, idx) => {
                const ph = (sp.userData.ph + dt * 0.34) % 1.0;
                sp.userData.ph = ph;
                const bz = sp.userData.stack === 0 ? 0.65 : 1.01;
                sp.position.set(0.22 + ph * 0.55 + Math.sin(ph * 6.0 + idx) * 0.10, 2.94 + ph * 2.15, bz + ph * 2.10);
                sp.scale.setScalar(0.55 + ph * 1.85);
                sp.material.opacity = Math.sin(ph * Math.PI) * 0.36;
              });
              fSprayPuffs.forEach((sp, idx) => {
                const ph = (sp.userData.ph + dt * 1.05) % 1.0;
                sp.userData.ph = ph;
                sp.position.set(sp.userData.side * (0.62 + ph * 0.85) + Math.sin(idx * 2.1) * 0.12, 0.25 + Math.sin(ph * Math.PI) * 0.34, 3.25 + ph * 2.40);
                sp.scale.setScalar(0.65 + ph * 1.35);
                sp.material.opacity = (1.0 - ph) * 0.45;
              });

              // 偶发左上夜空流星
              const metCycle = sec % 6.0;
              if (metCycle < 1.2) {
                const mp = metCycle / 1.2;
                meteorLine.position.set(-48 + mp * 44, 42 - mp * 18, -145);
                meteorMat.opacity = Math.sin(mp * Math.PI) * 0.85;
              } else {
                meteorMat.opacity = 0.0;
              }

              // 电影尾随镜头：船尾背影居于中下沿月光海路，满月稳居正前方偏上
              const ease = 1.0 - Math.exp(-sec * 0.09);
              const camX = 1.45 - 1.10 * ease;
              const camY = 3.45 + 0.75 * ease + Math.sin(sec * 0.9) * 0.06;
              const camZ = 9.2 - 1.6 * ease;
              finaleCam.position.set(camX, camY, camZ);
              finaleCam.lookAt(0.0, 2.95, -42.0);
              seaUniforms.uCamPos.value.copy(finaleCam.position);

              renderer.setRenderTarget(null);
              renderer.render(finaleScene, finaleCam);
            },
            dispose: disposeFinaleResources,
          };
          customFinaleRenderer._cleanup = cleanupFinale3D;

          const tReveal = setTimeout(() => {
            if (!finaleDisposed && window.__act3Token === act3Token && curtainEl) {
              curtainEl.classList.remove("dark");
            }
          }, 120);
          act1Cleanups.push(() => clearTimeout(tReveal));
        }, 650);

        act1Cleanups.push(() => {
          clearTimeout(tEnter);
          disposeFinaleResources();
        });
      }

      document.getElementById("a3-btn-replay").addEventListener("click", () => loadAct3());
      document.getElementById("a3-btn-port").addEventListener("click", () => {
        if (customFinaleRenderer && customFinaleRenderer._cleanup) {
          customFinaleRenderer._cleanup();
        } else {
          if (customFinaleRenderer) {
            try { customFinaleRenderer.dispose(); } catch (e) {}
            customFinaleRenderer = null;
          }
          document.body.classList.remove("finale-3d-mode");
          finaleOverlay.classList.remove("show");
        }
      });

      function unreachText() {
        if ((heroNode === "lock_top" || heroNode === "seam_B") && viewIdx !== 1) {
          return "身处高闸顶，换个角度才下得去。";
        }
        return "眼下还走不到那里。";
      }

      navEdgesFn = () => {
        const e = [
          ["pier_start", "plaza_front"],
          ["plaza_front", "sea_valve"],
          ["plaza_front", "stair_bottom"],
          ["sea_valve", "stair_bottom"],
          ["stair_bottom", "stair_mid"],
          ["stair_mid", "stair_top"],
          ["stair_bottom", "bell_box"],
          ["plaza_front", "bell_box"],
          ["bell_box", "dock_sw_0"],
          ["dock_sw_0", "dock_bollard_0"],
          ["dock_bollard_0", "dock_sw_1"],
          ["dock_sw_1", "plank_entry"],
          ["plank_entry", "dock_sw_2"],
          ["dock_sw_2", "dock_bollard_1"],
          ["dock_bollard_1", "dock_sw_3"],
          ["dock_sw_3", "dock_bollard_2"],
          ["dock_bollard_2", "dock_sw_4"],
          ["dock_sw_4", "dock_bollard_3"],
        ];
        if (st.housesSolved) {
          e.push(["dock_sw_3", "sky_corridor"], ["dock_sw_2", "sky_corridor"], ["sky_corridor", "seam_A"]);
        }
        if (isParallaxAligned()) {
          e.push(["seam_A", "seam_B", true], ["seam_B", "lock_top"]);
        }
        if (st.plankDown && !st.boarded) {
          e.push(["plank_entry", "plank_mid"], ["plank_mid", "ship_deck"]);
        }
        return e;
      };

      function syncAct3() {
        for (let i = 0; i < 5; i++) {
          const on = !!st.houses[i] && st.boxChecked;
          const m = winGlassMats[i];
          if (m) {
            if (on) {
              m.color.setHex(0xffe082);
              m.emissive.setHex(0xffb428);
              m.emissiveIntensity = 3.2;
            } else {
              m.color.setHex(0x0c1426);
              m.emissive.setHex(0x000000);
              m.emissiveIntensity = 0.0;
            }
          }
          if (houseLights[i]) houseLights[i].intensity = on ? 4.4 : 0.0;
          if (switchBulbMats[i]) {
            const bulbCol = !st.boxChecked ? 0x263248 : (st.houses[i] ? 0xffd566 : 0x567298);
            switchBulbMats[i].color.setHex(bulbCol);
          }
        }
        if (st.boxChecked) {
          boxPowerOrbMat.color.setHex(0x6af5d8);
          pBoxLight.intensity = 3.2;
        } else if (st.bellCharged) {
          boxPowerOrbMat.color.setHex(0xffd25a);
          pBoxLight.intensity = 2.6;
        } else {
          boxPowerOrbMat.color.setHex(0x2a3c58);
          pBoxLight.intensity = st.steamOpened ? 1.8 : 1.1;
        }
        if (st.bellBoltOpened) {
          boltOrbMat.color.setHex(0x6af5d8);
        } else if (st.steamOpened) {
          boltOrbMat.color.setHex(0xff9b38);
        } else {
          boltOrbMat.color.setHex(0x2a3c58);
        }
        if (lockPinOrbMat) lockPinOrbMat.color.setHex(st.lockUnlocked ? 0x4ef59e : 0xe25b45);

        const boatGlowMult = st.housesSolved ? 1.25 : 0.92;
        shipLightA.intensity = 5.0 * boatGlowMult;
        shipLightB.intensity = 5.0 * boatGlowMult;
        refreshNodeHighlights(true);

        if (st.departed) {
          updateQuestUI("夜港船闸", "已通关", "🎉 钟鸣闸开、解缆启航，明轮船正驶向星海与明月。", "", [], "");
        } else {
          updateQuestUI("夜港船闸", "探索中", "海风低沉，古钟与船闸之间正待蒸气、灯火与潮声重新咬合。", "", [], "");
        }
      }

      animHooks.push((dt, now) => {
        const skyTargetY = st.housesSolved ? 0.0 : -3.6;
        skyTowerGroup.position.y += (skyTargetY - skyTowerGroup.position.y) * 0.09;

        for (let i = 0; i < 5; i++) {
          if (switchHandles[i]) {
            const tx = switchFlipped[i] ? -0.45 : 0.45;
            switchHandles[i].rotation.x += (tx - switchHandles[i].rotation.x) * 0.18;
          }
        }

        // 海水蒸汽阀轮旋转 & 表针跳升 & 蒸汽粒子
        seaValveAngle += (seaValveTarget - seaValveAngle) * Math.min(1.0, dt * 10.0);
        seaWheelPivot.rotation.z = -seaValveAngle;
        const nTarget = st.steamOpened ? -0.85 : 0.85;
        svGaugeNeedle.rotation.z += (nTarget - svGaugeNeedle.rotation.z) * 0.12;
        valveSteamPuffs.forEach((vp) => {
          if (!st.steamOpened) { vp.material.opacity = 0.0; return; }
          vp.userData.phase = (vp.userData.phase + dt * 0.72) % 1.0;
          const t = vp.userData.phase;
          vp.position.set(-7.18 + t * 0.14, 1.82 + t * 1.10, 1.50 + Math.sin(t * 5.0) * 0.06);
          vp.scale.setScalar(0.50 + t * 1.05);
          vp.material.opacity = Math.sin(t * Math.PI) * 0.44;
        });

        // 楼梯顶旋转螺栓转动、螺纹微升与未供汽震颤反馈
        if (boltShakeTimer > 0) {
          boltShakeTimer = Math.max(0, boltShakeTimer - dt);
          bellBoltPivot.rotation.z = Math.sin(now * 0.065) * 0.14 * boltShakeTimer;
        } else {
          bellBoltPivot.rotation.z = 0;
        }
        bellBoltAngle += (bellBoltTarget - bellBoltAngle) * Math.min(1.0, dt * 9.0);
        bellBoltPivot.rotation.y = -bellBoltAngle;
        bellBoltPivot.position.y = 0.08 + (st.bellBoltOpened ? 0.07 : 0.0);
        if (st.steamOpened && !st.bellBoltOpened) {
          boltOrbMat.color.setHSL(0.08, 0.92, 0.56 + Math.sin(now * 0.006) * 0.14);
        }

        // ★ 全部齿轮统一绕自身法线（局部 Y 轴 rotateY）同轴自转，彻底消除偏轴翻转
        bellPowerBoost = Math.max(0.0, bellPowerBoost - dt * 1.4);
        const isLifting = Math.abs(gateLiftTarget - st.gateLift) > 0.01;
        const archGearSpeed = st.bellBoltOpened ? (0.85 + bellPowerBoost * 1.6 + (isLifting ? 2.4 : 0.0)) : 0.0;
        if (archTopGearF) archTopGearF.rotateY(dt * archGearSpeed);
        if (archTopGearB) archTopGearB.rotateY(-dt * archGearSpeed * 1.15);

        const boxGearSpeed = st.bellBoltOpened
          ? (0.95 + bellPowerBoost * 1.4 + (st.boxChecked ? 0.55 : 0.0))
          : (st.steamOpened ? 0.28 : 0.0);
        boxGear1.rotateY(dt * boxGearSpeed);
        boxGear2.rotateY(-dt * boxGearSpeed * 1.42);

        const lockGearSpeed = (isLifting || st.departed) ? 3.2 : (st.lockUnlocked ? 0.65 : 0.0);
        if (lockGear1) lockGear1.rotateY(-dt * lockGearSpeed);
        if (lockGear2) lockGear2.rotateY(-dt * lockGearSpeed);

        // 控制箱右后铜烟囱轻烟（供汽后显著浓郁）
        boxPuffs.forEach((bm) => {
          bm.userData.phase = (bm.userData.phase + dt * 0.48) % 1.0;
          const t = bm.userData.phase;
          bm.position.set(-3.49 + Math.sin(t * 4.0) * 0.07, 3.66 + t * 0.88, 0.94 - t * 0.10);
          bm.scale.setScalar(0.55 + t * 1.05);
          bm.material.opacity = Math.sin(t * Math.PI) * (st.steamOpened ? 0.56 : 0.14);
        });

        // 明轮船双烟囱白烟
        shipPuffs.forEach((p, idx) => {
          p.userData.phase = (p.userData.phase + dt * (st.departed ? 0.68 : (st.housesSolved ? 0.48 : 0.34))) % 1.0;
          const t = p.userData.phase;
          const xBase = p.userData.stack === 0 ? -0.42 : -0.10;
          p.position.set(xBase - t * (st.departed ? 1.15 : 0.55), 2.38 + t * 1.28, Math.sin(t * 4 + idx) * 0.10);
          p.scale.setScalar(0.68 + t * 1.40);
          p.material.opacity = Math.sin(t * Math.PI) * (st.departed ? 0.62 : (st.housesSolved ? 0.50 : 0.32));
        });

        // 船闸顶拉杆与重木船闸门平滑向下沉入水下动画
        if (winchLever) {
          const wTarget = st.lockUnlocked ? -0.48 : 0.35;
          winchLever.rotation.z += (wTarget - winchLever.rotation.z) * 0.16;
        }
        st.gateLift += (gateLiftTarget - st.gateLift) * Math.min(1.0, dt * 3.4);
        const gateY = 0.68 - st.gateLift * 3.56; // 缓缓向下沉入水下至 -2.88m（门顶 3.50m 完全没入水面以下）
        lockGateGroup.position.y = gateY;
        lockGateGroup.visible = st.gateLift < 0.995;
        const ringTopY = gateY + 3.45;
        const chainEndY = Math.max(0.66, ringTopY);
        const chainSpan = Math.max(0.08, 4.70 - chainEndY);
        const chainMidY = chainEndY + chainSpan * 0.5;
        [[-1.75, gateChainL], [1.35, gateChainR]].forEach(([cz, cm]) => {
          cm.visible = chainEndY < 4.65;
          cm.scale.y = chainSpan;
          cm.position.set(8.55, chainMidY, cz);
        });
        if (gateLiftSoundCooldown > 0) gateLiftSoundCooldown -= dt;

        // 大钟左右摆动
        if (bellSwing > 0.004) {
          const sw = Math.sin(now * 0.011) * bellSwing;
          if (bellBodyObj) bellBodyObj.rotation.z = sw;
          else bellPivot.rotation.z = sw;
          bellSwing *= 0.986;
        }

        // 错序点击缆绳的震颤回弹
        mooringRopes.forEach((mr) => {
          if (mr.shakeTimer > 0) {
            mr.shakeTimer = Math.max(0, mr.shakeTimer - dt);
            mr.group.position.x = Math.sin(now * 0.065) * 0.045 * mr.shakeTimer;
          } else {
            mr.group.position.x = 0;
          }
        });

        // 登船甲板跳板开合动画
        const plankTargetRot = (st.plankDown && !st.boarded) ? 0.0 : Math.PI * 0.48;
        gangplankGroup.rotation.x += (plankTargetRot - gangplankGroup.rotation.x) * Math.min(1.0, dt * 6.5);

        // 明轮船穿闸出港航行 & 明轮拨水尾迹
        if (st.departed) {
          paddleAngle += dt * 4.8;
          paddleWheelGroup.rotation.z = -paddleAngle;
          shipSailTimer += dt;
          const speed = Math.min(2.85, 0.75 + shipSailTimer * 0.65);
          shipGroup.position.x += dt * speed;
          shipGroup.position.y = 0.64 + Math.sin(now * 0.0032) * 0.035;
          shipWakePuffs.forEach((wp) => {
            wp.userData.phase = (wp.userData.phase + dt * 1.1) % 1.0;
            const t = wp.userData.phase;
            wp.position.set(-1.10 - t * 2.8, 0.08 + t * 0.12, (Math.sin(t * 9) * 0.25));
            wp.scale.setScalar(0.55 + t * 1.35);
            wp.material.opacity = (1.0 - t) * 0.62;
          });
          if (!st.finaleShown) {
            camTarget.x += (Math.min(7.8, shipGroup.position.x * 0.55) - camTarget.x) * 0.035;
          }
        }
      });
