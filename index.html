<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>《逆潮钟站》一关一绝活 · 隐藏动画与多元视差白模原型</title>
  <style>
    :root {
      --font-title: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "KaiTi", Georgia, serif;
      --font-body: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      font-family: var(--font-body);
      background: #e6dfd8;
      color: #2b221b;
    }
    #canvas-wrap {
      width: 100vw; height: 100vh; height: 100dvh; position: relative; cursor: grab;
      touch-action: none;
      background: radial-gradient(ellipse at 32% 24%, #fce7d8 0%, #efc4b6 48%, #c98f9b 100%);
    }
    body.act1-mode #canvas-wrap {
      background: linear-gradient(122deg, #e0f4ec 0%, #c6e8de 38%, #cbe8ea 70%, #a9d8d2 100%);
    }
    body.night-mode #canvas-wrap {
      background: linear-gradient(180deg, #0a2052 0%, #091d4a 48%, #05112e 100%);
    }
    #canvas-wrap #night-stars {
      position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh;
      pointer-events: none; z-index: 0; display: none;
    }
    body.night-mode #canvas-wrap #night-stars { display: block; }
    #canvas-wrap canvas:not(#night-stars) { position: relative; z-index: 1; touch-action: none; display: block; }
    #canvas-wrap:active { cursor: grabbing; }

    .hud-top {
      position: fixed; top: 12px; left: 14px; right: 14px;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
      pointer-events: none; z-index: 10;
    }

    /* === 复古蒸汽朋克 × 新中式九宫格面板体系 === */
    .panel {
      background: transparent;
      border-style: solid;
      border-width: 20px;
      border-color: transparent;
      border-image: url("./ui/ui_frame_day_9slice.png?v=35") 124 fill stretch;
      border-radius: 0;
      padding: 4px 8px;
      filter: drop-shadow(0 8px 20px rgba(34, 24, 16, 0.22));
      pointer-events: auto;
    }
    body.act1-mode .panel {
      background: transparent;
      border-image-source: url("./ui/ui_frame_act1_9slice.png?v=35");
      filter: drop-shadow(0 8px 20px rgba(16, 52, 42, 0.18));
    }
    body.night-mode .panel {
      background: transparent;
      border-image-source: url("./ui/ui_frame_night_9slice.png?v=35");
      filter: drop-shadow(0 10px 26px rgba(2, 6, 18, 0.52));
      color: #f4eadc;
    }

    .quest-box { max-width: 446px; border-width: 22px; padding: 3px 8px; }
    .quest-box h1 {
      font-family: var(--font-title);
      font-size: 16px; font-weight: 800; color: #243154;
      display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
      padding-bottom: 5px;
      border-bottom: 1px solid rgba(182, 134, 52, 0.36);
    }
    /* 朱砂方印与青铜鎏金牌匾徽标 */
    .step-badge {
      font-family: var(--font-body);
      font-size: 11px; padding: 2px 8px; border-radius: 4px;
      background: linear-gradient(135deg, #b83a28 0%, #8f2314 100%);
      color: #fff6e6; font-weight: 700; letter-spacing: 0.4px;
      border: 1px solid rgba(242, 202, 118, 0.72);
      box-shadow: inset 0 1px 0 rgba(255, 232, 186, 0.35), 0 2px 5px rgba(95, 22, 12, 0.22);
    }
    .type-badge {
      font-family: var(--font-body);
      font-size: 11px; padding: 2px 8px; border-radius: 4px;
      background: linear-gradient(135deg, rgba(212, 162, 72, 0.22), rgba(176, 126, 42, 0.14));
      color: #6f490b; font-weight: 700;
      border: 1px solid rgba(182, 134, 52, 0.55);
    }
    .quest-goal {
      margin-top: 6px; font-size: 12.8px; font-weight: 600; color: #7e2c1e; line-height: 1.5;
    }
    .quest-hint {
      margin-top: 6px; font-size: 11.8px; color: #4c3e32; line-height: 1.52;
      background: linear-gradient(90deg, rgba(212, 166, 78, 0.18), rgba(248, 240, 224, 0.72));
      padding: 7px 10px; border-radius: 5px;
      border: 1px solid rgba(186, 138, 56, 0.36);
      border-left: 3.5px solid #b5832c; display: none;
    }
    .quest-hint.visible { display: block; }
    .quest-actions { margin-top: 7px; display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }

    .act-tabs { display: flex; gap: 7px; flex-wrap: wrap; border-width: 16px; padding: 2px 5px; }
    .btn {
      font-family: var(--font-body);
      border: 1px solid rgba(164, 122, 52, 0.62);
      box-shadow: inset 0 1px 0 rgba(255, 250, 236, 0.75), 0 2px 5px rgba(42, 30, 16, 0.14);
      background: linear-gradient(180deg, #fbf4e4 0%, #efe1c4 100%);
      color: #2c2119;
      padding: 6px 11px;
      border-radius: 6px;
      font-size: 12.2px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
      cursor: pointer;
      transition: transform 0.14s ease, filter 0.14s ease, box-shadow 0.14s ease;
    }
    .btn:hover {
      transform: translateY(-1px);
      background: linear-gradient(180deg, #fff8ea 0%, #f5e5c2 100%);
      box-shadow: inset 0 1px 0 rgba(255, 252, 240, 0.9), 0 4px 10px rgba(176, 128, 42, 0.28);
    }
    .btn:active { transform: translateY(0) scale(0.98); }
    .btn.active {
      background: linear-gradient(180deg, #2e457d 0%, #1e2e58 100%);
      color: #ffe9b8; border-color: #d6a449;
      box-shadow: inset 0 1px 0 rgba(255, 224, 152, 0.35), 0 3px 8px rgba(24, 36, 72, 0.32);
    }
    .btn.coral {
      background: linear-gradient(180deg, #d85642 0%, #ad3524 100%);
      color: #fff8eb; border-color: #e6b868;
      box-shadow: inset 0 1px 0 rgba(255, 226, 178, 0.42), 0 2px 6px rgba(135, 34, 20, 0.28);
    }
    .btn.coral:hover {
      background: linear-gradient(180deg, #e56450 0%, #be3e2b 100%);
    }
    .btn.sm { padding: 4px 10px; font-size: 11.8px; }

    /* 底部含实时旋转罗盘仪表栏 */
    .hud-bottom {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; align-items: center; z-index: 10; pointer-events: none;
      width: max-content; max-width: 96vw; transition: opacity 0.18s ease;
    }
    body.npc-dialog-open .hud-bottom { opacity: 0; pointer-events: none; }
    .hud-bottom .panel {
      display: flex; gap: 8px; row-gap: 4px; align-items: center; justify-content: center; flex-wrap: wrap;
      border-width: 15px; padding: 1px 7px;
    }
    .ui-compass-dial {
      width: 38px; height: 38px; flex: 0 0 38px;
      object-fit: contain;
      filter: drop-shadow(0 2px 5px rgba(26, 20, 12, 0.28));
      transition: transform 0.36s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .inv-slot {
      font-size: 11.8px; padding: 4px 10px; border-radius: 5px; white-space: nowrap;
      background: rgba(196, 154, 76, 0.16); color: #2b385c; font-weight: 700;
      border: 1px solid rgba(182, 134, 52, 0.42);
    }
    .inv-slot.has-item {
      background: linear-gradient(135deg, rgba(226, 178, 78, 0.32), rgba(204, 146, 54, 0.22));
      color: #6b4205; border-color: rgba(196, 138, 38, 0.72);
    }
    .inv-slot.parallax-ok {
      background: linear-gradient(135deg, rgba(46, 156, 118, 0.24), rgba(30, 120, 88, 0.16));
      color: #0e5a3e; border-color: rgba(42, 148, 108, 0.62);
    }
    .hud-drag-note {
      font-size: 11px; opacity: 0.76; white-space: nowrap;
    }

    #toast {
      position: fixed; top: 175px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(180deg, rgba(28, 38, 64, 0.96) 0%, rgba(16, 24, 46, 0.97) 100%);
      color: #ffeec9;
      padding: 9px 22px; border-radius: 8px; font-size: 13px; font-weight: 600;
      border: 1.5px solid rgba(218, 168, 76, 0.78);
      box-shadow: inset 0 0 0 1px rgba(255, 224, 152, 0.22), 0 10px 26px rgba(0, 0, 0, 0.34);
      opacity: 0; transition: opacity 0.26s ease; pointer-events: none; z-index: 20;
      text-align: center; max-width: 84vw;
    }
    #toast.show { opacity: 1; }

    .hover-tag {
      position: fixed; pointer-events: none; z-index: 18;
      background: linear-gradient(180deg, rgba(26, 36, 60, 0.95) 0%, rgba(15, 22, 42, 0.96) 100%);
      color: #ffe7ad;
      padding: 5px 11px; border-radius: 6px; font-size: 12px; font-weight: 700;
      border: 1.2px solid rgba(218, 168, 76, 0.76);
      transform: translate(-50%, -135%); display: none; white-space: nowrap;
      box-shadow: 0 5px 14px rgba(0,0,0,0.30);
    }

    /* 第一幕：豆青瓷雅致配色叠加 */
    body.act1-mode .quest-box h1 { color: #164f44; border-bottom-color: rgba(62, 132, 114, 0.34); }
    body.act1-mode .step-badge {
      background: linear-gradient(135deg, #247264 0%, #174f45 100%);
      color: #f2fff9; border-color: rgba(196, 226, 178, 0.65);
    }
    body.act1-mode .type-badge {
      background: rgba(38, 134, 110, 0.14); color: #145e4c; border-color: rgba(58, 132, 112, 0.45);
    }
    body.act1-mode .quest-goal { color: #18584b; }
    body.act1-mode .inv-slot { color: #165448; background: rgba(44, 134, 112, 0.12); border-color: rgba(64, 138, 118, 0.42); }
    body.act1-mode .btn.active { background: linear-gradient(180deg, #287668 0%, #195348 100%); color: #f6fffb; border-color: #d6a449; }

    /* 第三幕：深夜港暖金配色叠加 */
    .night-mode .quest-box h1 { color: #ffe3a8; border-bottom-color: rgba(235, 185, 96, 0.38); }
    .night-mode .step-badge {
      background: linear-gradient(135deg, #c64532 0%, #8f2416 100%);
      border-color: rgba(255, 206, 108, 0.75);
    }
    .night-mode .type-badge { background: rgba(245, 200, 110, 0.16); color: #ffd982; border-color: rgba(238, 192, 98, 0.48); }
    .night-mode .quest-goal { color: #ffb29e; }
    .night-mode .quest-hint {
      color: #e2e9fa; background: rgba(20, 34, 70, 0.72);
      border-color: rgba(235, 185, 96, 0.40); border-left-color: #f0b854;
    }
    .night-mode .btn {
      background: linear-gradient(180deg, #253869 0%, #18264c 100%);
      color: #f6ecdc; border-color: rgba(226, 178, 86, 0.56);
      box-shadow: inset 0 1px 0 rgba(255, 224, 152, 0.18), 0 2px 6px rgba(2, 6, 20, 0.42);
    }
    .night-mode .btn:hover { background: linear-gradient(180deg, #324a88 0%, #223468 100%); }
    .night-mode .btn.active {
      background: linear-gradient(180deg, #cf4c38 0%, #9b2c1d 100%);
      color: #fff6e0; border-color: #ffd06b;
    }
    .night-mode .inv-slot { background: rgba(245, 200, 110, 0.14); color: #f6d892; border-color: rgba(235, 185, 96, 0.45); }
    .night-mode .inv-slot.parallax-ok { background: rgba(46, 184, 134, 0.25); color: #84f5ca; border-color: rgba(82, 212, 162, 0.55); }

    #act1-wheel-pad .wheel-pad-knob {
      position: relative; width: 30px; height: 30px; border-radius: 50%;
      background: radial-gradient(circle at 32% 30%, #f0765d, #c6412d 68%, #8f2618 100%);
      border: 2.5px solid #e6c67e;
      box-shadow: 0 3px 9px rgba(0,0,0,0.30), inset 0 1px 2px rgba(255,255,255,0.45);
      cursor: ew-resize; touch-action: none;
      display: flex; align-items: center; justify-content: center;
      color: #fff6dc; font-size: 13px; font-weight: 800;
    }
    #act1-wheel-drag-hud {
      position: fixed; pointer-events: none; z-index: 25; display: none;
      transform: translate(-50%, -135%);
      background: rgba(20, 38, 44, 0.94); color: #ffefc8;
      border: 1.5px solid rgba(216, 168, 76, 0.78);
      border-radius: 8px; padding: 6px 11px; min-width: 170px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.28); font-size: 11.5px; font-weight: 700;
    }
    #act1-wheel-drag-hud .wd-bar-bg {
      margin-top: 5px; height: 6px; border-radius: 3px;
      background: rgba(255,255,255,0.16); overflow: hidden;
    }
    #act1-wheel-drag-hud .wd-bar-fill {
      height: 100%; width: 0%; border-radius: 3px;
      background: linear-gradient(90deg, #5de4cb, #ffd978);
    }
    #act1-wheel-pad {
      position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%);
      z-index: 16; display: none; flex-direction: column; gap: 6px;
      min-width: 318px; max-width: 380px;
      background: transparent;
      border-style: solid; border-width: 18px; border-color: transparent;
      border-image: url("./ui/ui_frame_act1_9slice.png?v=35") 124 fill stretch;
      padding: 4px 8px;
      filter: drop-shadow(0 10px 26px rgba(16, 48, 38, 0.24));
      pointer-events: auto;
    }
    #act1-wheel-pad.show { display: flex; }
    #act1-wheel-pad .wp-head {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      font-family: var(--font-title); font-size: 13px; font-weight: 800; color: #175245;
    }
    #act1-wheel-pad .wp-sub { font-size: 11px; color: #2b685a; opacity: 0.92; }
    #act1-wheel-pad .wheel-pad-track {
      position: relative; height: 36px; border-radius: 18px;
      background: linear-gradient(90deg, rgba(46, 138, 114, 0.16), rgba(242, 249, 244, 0.95), rgba(217, 84, 67, 0.16));
      border: 2px solid rgba(182, 138, 58, 0.72);
      display: flex; align-items: center; justify-content: center;
      touch-action: none; user-select: none; cursor: ew-resize;
    }
    #act1-wheel-pad .wheel-pad-fill {
      position: absolute; top: 4px; bottom: 4px; left: 50%; width: 0;
      border-radius: 15px; pointer-events: none;
    }
    #act1-bell-panel {
      position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%);
      z-index: 18; display: none; flex-direction: column; gap: 8px; align-items: center;
      min-width: 350px; max-width: 440px;
      background: transparent;
      border-style: solid; border-width: 22px; border-color: transparent;
      border-image: url("./ui/ui_frame_act1_9slice.png?v=35") 124 fill stretch;
      padding: 4px 8px;
      filter: drop-shadow(0 12px 28px rgba(16, 48, 38, 0.26));
      pointer-events: auto;
    }
    #act1-bell-panel.show { display: flex; }
    #act1-bell-panel .bp-title {
      font-family: var(--font-title); font-size: 14px; font-weight: 800; color: #195649;
      display: flex; align-items: center; gap: 6px;
    }
    #act1-bell-panel .bp-status {
      font-size: 12px; color: #256455; font-weight: 600; text-align: center; line-height: 1.45;
    }
    #act1-bell-panel .bp-beats { display: flex; align-items: center; gap: 6px; padding: 4px 0; }
    #act1-bell-panel .bp-gap { font-size: 11px; font-weight: 800; color: #7a6a42; opacity: 0.72; }
    #act1-bell-panel .bp-dot {
      position: relative; width: 32px; height: 32px; border-radius: 50%;
      background: rgba(38, 107, 94, 0.12); border: 2px solid rgba(182, 138, 58, 0.65);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; transition: transform 0.16s, background 0.16s, border-color 0.16s;
    }
    @keyframes bellRipplePulse {
      0% { transform: scale(1); opacity: 0.9; }
      100% { transform: scale(2.05); opacity: 0; }
    }
    #act1-bell-panel .bp-dot.demo-hit {
      transform: scale(1.18); background: #5de8d1; border-color: #1d8a7a;
      box-shadow: 0 0 14px rgba(72, 224, 198, 0.75);
    }
    #act1-bell-panel .bp-dot.user-hit {
      transform: scale(1.22); background: #ffd86b; border-color: #c88618;
      box-shadow: 0 0 16px rgba(255, 206, 76, 0.85);
    }
    #act1-bell-panel .bp-dot.err-hit { background: #f59486; border-color: #c83e2b; }
    #act1-bell-panel .bp-dot.demo-hit::after,
    #act1-bell-panel .bp-dot.user-hit::after {
      content: ""; position: absolute; inset: -3px; border-radius: 50%;
      border: 2px solid currentColor; animation: bellRipplePulse 0.65s ease-out;
    }
    #act1-bell-panel .bp-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    @keyframes shakeSlight {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .shake-hint { animation: shakeSlight 0.32s ease-in-out; }

    /* === 全三幕剧情 NPC「瑟岚」精绘立绘九宫格对话卷轴匣 === */
    #npc-dialog-backdrop {
      position: fixed; inset: 0; z-index: 28; display: none;
      background: rgba(14, 18, 28, 0.12); pointer-events: none;
    }
    #npc-dialog-backdrop.show { display: block; }
    #npc-dialog {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      width: min(720px, 92vw); max-height: calc(100vh - 130px);
      overflow-y: auto; z-index: 32; display: none; flex-direction: column; gap: 9px;
      background: transparent;
      border-style: solid; border-width: 24px; border-color: transparent;
      border-image: url("./ui/ui_frame_day_9slice.png?v=35") 124 fill stretch;
      padding: 4px 10px;
      filter: drop-shadow(0 14px 34px rgba(24, 18, 12, 0.32));
      color: #2b221b; pointer-events: auto;
    }
    #npc-dialog.show { display: flex; }
    #npc-dialog .npc-main { display: flex; gap: 14px; align-items: flex-start; }
    #npc-dialog .npc-portrait {
      flex: 0 0 92px; width: 92px; height: 92px; border-radius: 10px;
      background: #f4ebd8;
      border: 2px solid #b58534;
      box-shadow: inset 0 0 0 2px rgba(247, 224, 168, 0.65), 0 4px 12px rgba(28, 20, 10, 0.22);
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    #npc-dialog .npc-portrait-img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    #npc-dialog .npc-body { flex: 1; min-width: 0; }
    #npc-dialog .npc-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
      margin-bottom: 6px; padding-bottom: 5px;
      border-bottom: 1px solid rgba(182, 134, 52, 0.36);
    }
    #npc-dialog .npc-title-wrap { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    #npc-dialog .npc-name {
      font-family: var(--font-title); font-size: 16px; font-weight: 800; color: #24335c;
    }
    #npc-dialog .npc-role {
      font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px;
      background: linear-gradient(135deg, rgba(212, 82, 62, 0.16), rgba(180, 52, 34, 0.10));
      color: #9e2d1d; border: 1px solid rgba(196, 76, 56, 0.38);
    }
    #npc-dialog .npc-stance {
      font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px;
      background: linear-gradient(135deg, rgba(218, 168, 72, 0.26), rgba(186, 136, 46, 0.16));
      color: #6b4506; border: 1px solid rgba(186, 138, 52, 0.56);
    }
    #npc-dialog .npc-close {
      border: 1px solid rgba(176, 132, 56, 0.65);
      background: linear-gradient(180deg, #fbf4e4 0%, #ead8b8 100%);
      color: #4a3520; border-radius: 5px; padding: 3px 9px; font-size: 12px; font-weight: 700;
      cursor: pointer; transition: all 0.15s;
    }
    #npc-dialog .npc-close:hover { background: #c4412e; color: #fff8eb; border-color: #e6b868; }
    #npc-dialog .npc-text { font-size: 13.5px; line-height: 1.66; color: #2d241c; }
    #npc-dialog .dlg-key {
      display: inline-block; padding: 0 6px; margin: 0 1px; border-radius: 4px;
      background: rgba(196, 65, 46, 0.13); color: #9c2919; font-weight: 700;
      border: 1px solid rgba(196, 65, 46, 0.32);
    }
    #npc-dialog .npc-guide-note {
      display: none; margin-top: 8px; padding: 7px 11px; border-radius: 5px;
      background: linear-gradient(90deg, rgba(214, 166, 76, 0.20), rgba(250, 242, 224, 0.72));
      border: 1px solid rgba(186, 138, 52, 0.38);
      border-left: 3.5px solid #b5832c;
      font-size: 12.2px; font-weight: 600; color: #644006; line-height: 1.5;
    }
    #npc-dialog .npc-guide-note.show { display: block; }
    #npc-dialog .dlg-choices { display: flex; flex-direction: column; gap: 6px; margin-top: 2px; }
    #npc-dialog .dlg-choice-btn {
      display: flex; align-items: center; gap: 9px; text-align: left; width: 100%;
      padding: 8px 12px; border-radius: 6px;
      border: 1px solid rgba(176, 132, 56, 0.45);
      border-left: 4px solid #263b6f;
      background: linear-gradient(90deg, rgba(255, 250, 238, 0.95), rgba(244, 232, 206, 0.90));
      color: #24242c; font-size: 12.8px; font-weight: 600; cursor: pointer;
      box-shadow: 0 2px 5px rgba(34, 24, 14, 0.08);
      transition: transform 0.14s ease, background 0.14s ease, border-color 0.14s ease;
    }
    #npc-dialog .dlg-choice-btn:hover {

    /* === 第三幕 深夜绀蓝鎏金交互浮条（海水蒸汽阀 / 旋转螺栓 / 摇钟驱动器）与星海明月终局画卷 === */
    #act3-valve-pad,
    #act3-bolt-pad,
    #act3-bell-panel {
      position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%);

    .a3-pad-head {

    #act3-valve-pad .a3-valve-fill,
    #act3-bolt-pad .a3-valve-fill {
      position: absolute; top: 4px; bottom: 4px; left: 50%; width: 0;
      border-radius: 14px; pointer-events: none;
    }
    #act3-valve-pad .a3-valve-knob,
    #act3-bolt-pad .a3-valve-knob {
      position: relative; width: 30px; height: 30px; border-radius: 50%;
      background: radial-gradient(circle at 32% 30%, #f0765d, #c6412d 68%, #8f2618 100%);
      border: 2.5px solid #e6c67e; box-shadow: 0 3px 10px rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center;
      color: #fff6dc; font-size: 13px; font-weight: 800; cursor: ew-resize; touch-action: none;
    }
    #act3-bell-panel .a3-lift-meter {
      width: 100%; height: 14px; border-radius: 7px; padding: 2px;
      background: rgba(8, 16, 38, 0.85);
      border: 1.5px solid rgba(235, 185, 96, 0.65); overflow: hidden;
    }
    #act3-bell-panel .a3-lift-fill {
      height: 100%; width: 0%; border-radius: 5px;
      background: linear-gradient(90deg, #3fd0b8 0%, #f2c056 60%, #ffdf88 100%);

    #act3-bolt-pad .a3-bell-actions,
    #act3-bell-panel .a3-bell-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

    body.finale-3d-mode .hud-top,
    body.finale-3d-mode .hud-bottom,
    body.finale-3d-mode #night-stars,
    body.finale-3d-mode #toast,
    body.finale-3d-mode #hover-tag,
    body.finale-3d-mode #act1-wheel-drag-hud,
    body.finale-3d-mode #act1-wheel-pad,
    body.finale-3d-mode #act1-bell-panel,

    #act3-finale-overlay {

    /* === V41 过关神圣云雾上升阶梯过场 HUD 与淡入幕布 === */
    #ascension-overlay {
      position: fixed; inset: 0; z-index: 46;

    /* 资源异步加载进度胶囊与移动端辅助按钮 */
    #loading-pill {

    .quest-toggle-btn { display: none; margin-left: auto; padding: 1px 7px !important; font-size: 11px !important; }

      .mobile-view-reset-btn.show { display: inline-flex; }

        text-shadow: 0 1px 6px rgba(240, 255, 249, 0.88);
      }
      body.night-mode .quest-goal {
        color: rgba(255, 214, 186, 0.90);
        text-shadow: 0 1px 8px rgba(4, 10, 28, 0.92);
      }

      .hud-bottom { display: none !important; }

      #mobile-gesture-hint {
        display: block; position: fixed;
        bottom: calc(14px + env(safe-area-inset-bottom)); left: 12px; right: 12px;

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
    import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";

    // === 卡通渲染：纪念碑谷风格强明暗三阶几何分级量化（保留环境反射、清漆与金属高光对比） ===
    (() => {
      const key = "vec3 irradiance = dotNL * directLight.color;";
      const chunk = THREE.ShaderChunk.lights_physical_pars_fragment;
      if (chunk.includes(key)) {
        THREE.ShaderChunk.lights_physical_pars_fragment =
          "float celBand( float x ) { float s1 = smoothstep( 0.08, 0.18, x ); float s2 = smoothstep( 0.50, 0.65, x ); return 0.02 + 0.46 * s1 + 0.72 * s2; }\n" +
          chunk.replace(key, "vec3 irradiance = celBand( dotNL ) * directLight.color;");
      } else {
        console.warn("[Toon] 未找到 RE_Direct_Physical 漫反射片段，跳过色带量化");
      }
    })();

    // 全局资源加载进度提示（支持移动端弱网与 Draco 异步解压反馈）
    (() => {
      const pill = document.getElementById("loading-pill");
      const lpText = document.getElementById("lp-text");
      const lpFill = document.getElementById("lp-fill");
      let hideTimer = null;
      const updateBar = (loaded, total) => {
        if (!pill || !total) return;
        clearTimeout(hideTimer);
        const pct = Math.min(100, Math.round((loaded / Math.max(total, 1)) * 100));
        if (lpText) lpText.textContent = `场景雕琢加载中 ${pct}% (${loaded}/${total})`;
        if (lpFill) lpFill.style.width = `${pct}%`;
        pill.classList.add("show");
      };
      THREE.DefaultLoadingManager.onStart = (_u, loaded, total) => updateBar(loaded, total);
      THREE.DefaultLoadingManager.onProgress = (_u, loaded, total) => updateBar(loaded, total);
      THREE.DefaultLoadingManager.onLoad = () => {
        if (!pill) return;
        if (lpFill) lpFill.style.width = "100%";
        if (lpText) lpText.textContent = "场景雕琢就绪 100%";
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => pill.classList.remove("show"), 350);
      };
      THREE.DefaultLoadingManager.onError = () => {
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => { if (pill) pill.classList.remove("show"); }, 800);
      };
    })();

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/libs/draco/gltf/");
    dracoLoader.preload();
    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);
    const glbCache = {};
    const glbAnimCache = {};

    /**
     * 加载带 Rodin 骨骼绑定的角色 GLB，缓存场景模型与全套 AnimationClip。
     */
    function loadRiggedCharacter(glbName, onReady) {
      if (glbCache[glbName] && glbAnimCache[glbName]) {
        onReady(glbCache[glbName], glbAnimCache[glbName]);
        return;
      }
      gltfLoader.load(`./assets/${glbName}.glb?v=52`, (gltf) => {
        enhanceMaterials(gltf.scene);
        const clips = (gltf.animations || []).map((clip) => {
          let minT = Infinity;
          (clip.tracks || []).forEach((tr) => {
            if (tr.times && tr.times.length && tr.times[0] < minT) minT = tr.times[0];
          });
          if (Number.isFinite(minT) && minT > 1e-4) {
            // 按原缓冲引用分配全新 Float32Array 拷贝，避免跨轨道或跨动作共享数组被重复扣减归零
            const shiftedMap = new Map();
            (clip.tracks || []).forEach((tr) => {
              const src = tr.times;
              if (!src || !src.length) return;
              let nextTimes = shiftedMap.get(src);
              if (!nextTimes) {
                nextTimes = new Float32Array(src.length);
                for (let i = 0; i < src.length; i++) {
                  nextTimes[i] = Math.max(0, src[i] - minT);
                }
                shiftedMap.set(src, nextTimes);
              }
              tr.times = nextTimes;
            });
            clip.resetDuration();
          }
          return clip;
        });
        glbCache[glbName] = gltf.scene;
        glbAnimCache[glbName] = clips;
        onReady(glbCache[glbName], glbAnimCache[glbName]);
      }, undefined, () => {});
    }

    /**
     * 基于 SkeletonUtils.clone 构建独立骨骼动画角色控制器（Idle/Walk/Ascend/Interact/Talk/Wave）。
     */
    function createRiggedActor(srcScene, animations, opt = {}) {
      const clone = SkeletonUtils.clone(srcScene);
      const bones = {};
      clone.traverse((child) => {
        if (child.isBone) bones[child.name] = child;
        if (child.isMesh || child.isSkinnedMesh) {
          child.castShadow = !!opt.castShadow;
          child.receiveShadow = !!opt.receiveShadow;
          child.frustumCulled = false;
        }
      });

      const mixer = new THREE.AnimationMixer(clone);
      const actions = {};
      const clipDurations = {};
      (animations || []).forEach((clip) => {
        if (clip && clip.name) {
          actions[clip.name] = mixer.clipAction(clip);
          clipDurations[clip.name] = clip.duration || 1.0;
        }
      });

      let curName = null;
      let curAction = null;
      const defaultAnim = opt.defaultAnim || (actions.Idle ? "Idle" : Object.keys(actions)[0]);

      const play = (name, fadeSec = 0.18, once = false, timeScale = null) => {
        const next = actions[name] || actions[defaultAnim];
        if (!next) return;
        const resolved = next === actions[name] ? name : defaultAnim;
        if (curName === resolved && !once) {
          if (timeScale !== null && curAction) curAction.setEffectiveTimeScale(timeScale);
          if (curAction && !curAction.isRunning()) curAction.play();
          return;
        }
        const prev = curAction;
        curName = resolved;
        curAction = next;
        // 清理除 prev 与 next 之外的残留渐变动画，防止连续快速切换导致权重互锁
        Object.values(actions).forEach((act) => {
          if (act !== prev && act !== next) {
            act.stopFading();
            act.stop();
          }
        });
        next.stopFading();
        next.enabled = true;
        next.reset();
        next.setLoop(once ? THREE.LoopOnce : THREE.LoopRepeat, once ? 1 : Infinity);
        next.clampWhenFinished = !!once;
        next.setEffectiveTimeScale(timeScale !== null ? timeScale : 1);
        next.setEffectiveWeight(1);
        if (prev && prev !== next && fadeSec > 1e-3) {
          prev.stopFading();
          prev.enabled = true;
          next.play();
          prev.crossFadeTo(next, fadeSec, false);
        } else {
          if (prev && prev !== next) {
            prev.stopFading();
            prev.stop();
          }
          next.play();
        }
      };

      const onFinished = (ev) => {
        if (ev && ev.action && ev.action.loop === THREE.LoopOnce) {
          curName = null;
          play(defaultAnim, 0.22, false);
        }
      };
      mixer.addEventListener("finished", onFinished);
      if (defaultAnim) play(defaultAnim, 0.0, false);

      return {
        root: clone,
        mixer,
        actions,
        get currentName() { return curName; },
        play,
        setTimeScale(name, scale) {
          if (actions[name]) actions[name].setEffectiveTimeScale(scale);
        },
        getClipDuration(name) {
          return clipDurations[name] || 0;
        },
        findBone(regex) {
          const hit = Object.keys(bones).find((k) => regex.test(k));
          return hit ? bones[hit] : null;
        },
        update(dt) { mixer.update(dt); },
        dispose() {
          mixer.removeEventListener("finished", onFinished);
          mixer.stopAllAction();
          mixer.uncacheRoot(clone);
        },
      };
    }

    // === V45 屏幕空间分层描边策略：仅小件/镂空/高曲率件只描外轮廓与分界，大型建筑保留大起伏折角棱线 ===
    const OUTLINE_SILHOUETTE_ONLY_SET = new Set([
      "act1_float_orb_rodin", "act1_float_buoy_cage_rodin", "act1_refill_valve_rodin",
      "act1_valve_wheel_rodin", "act1_drain_gate_rodin", "act1_lantern_rodin",
      "act1_gauge_stand_rodin", "act1_catcher_rodin_hollow", "act1_lotus_pad_rodin",
      "act1_boiler_pump_anim",
      "act2_gear_machine_bl", "act2_bridge_winch", "act2_crank_mount", "act2_water_valve",
      "act2_wheel_coral", "act2_pressure_lever", "act2_steam_vent", "act2_tower_horn_bl",
      "act2_interconnect_pipes", "act2_pipe_L", "act2_pipe_R", "act2_pipe_port",
      "act2_melody_plaque",
      "act3_control_box", "act3_lock_beam_winch", "act3_hanging_bell",
      "act3_arch_lantern", "act3_dock_switch", "act3_paddle_steamer",
    ]);
    let nextEdgePartId = 10;

    /**
     * 为对象子树分配屏幕空间部件 ID（正值允许大起伏折角描边，负值仅保留外轮廓与部件分界）。
     */
    function tagEdgePart(rootObj, silhouetteOnly = false, explicitId = null) {
      if (!rootObj) return;
      const rawId = explicitId != null ? Math.abs(explicitId) : nextEdgePartId++;
      const partId = silhouetteOnly ? -rawId : rawId;
      rootObj.traverse((child) => {
        if (child.isMesh || child.isSkinnedMesh) {
          child._edgePartId = partId;
          child.userData = child.userData || {};
          child.userData.__edgePartId = partId;
        }
      });
    }

    // === 异步加载 Web-GLB 并无感替换白模占位（支持标量或三轴 [sx,sy,sz] 缩放、透明深度修正与实例回调） ===
    function mountRodinModel(parent, glbName, pos, targetScale, rotYDeg = 0, hideOnLoad = [], meta = null, onLoaded = null) {
      const attach = (srcScene) => {
        if (!parent.parent && parent !== levelRoot) return;
        const clone = srcScene.clone(true);
        if (Array.isArray(targetScale)) {
          clone.scale.set(targetScale[0], targetScale[1], targetScale[2]);
        } else {
          clone.scale.setScalar(targetScale);
        }
        clone.position.set(pos[0], pos[1], pos[2]);
        clone.rotation.y = (rotYDeg * Math.PI) / 180;
        clone.traverse((child) => {
          if (child.isMesh) {
            const isTrans = !!(child.material && child.material.transparent && child.material.opacity < 0.99);
            child.castShadow = !isTrans;
            child.receiveShadow = !isTrans;
            if (isTrans && child.material) {
              child.material.depthWrite = false;
            }
            if (meta) {
              child.userData = meta;
              clickables.push(child);
            }
          }
        });
        tagEdgePart(clone, OUTLINE_SILHOUETTE_ONLY_SET.has(glbName));
        parent.add(clone);
        hideOnLoad.forEach((m) => { if (m) m.visible = false; });
        if (onLoaded) onLoaded(clone);
      };

      if (glbCache[glbName]) {
        attach(glbCache[glbName]);
        return;
      }
      gltfLoader.load(`./assets/${glbName}.glb?v=38`, (gltf) => {
        enhanceMaterials(gltf.scene);
        glbCache[glbName] = gltf.scene;
        attach(gltf.scene);
      }, undefined, () => {});
    }

    /**
     * 统一增强 GLB 材质（V5 释放真 PBR 金属拉丝与清漆质感）：
     * - 高金属优先保持低粗糙度（不再被 roughnessMap 判断误锁成 0.92 哑光）
     * - 烤漆与青瓷釉面砖转物理清漆材质，石材砖纹保持适度哑光立体凹凸
     */
    function enhanceMaterials(root) {
      const cache = new Map();
      const toPhysical = (m) => {
        const p = new THREE.MeshPhysicalMaterial();
        THREE.MeshStandardMaterial.prototype.copy.call(p, m);
        p.defines = { STANDARD: "", PHYSICAL: "" };
        return p;
      };
      const upgrade = (m) => {
        if (!m || !m.isMeshStandardMaterial) return m;
        if (cache.has(m)) return cache.get(m);
        let out = m;
        const n = m.name || "";
        if (/CavityDark/.test(n)) {
          // 齿轮箱内腔与锅炉深井内壁：保持极致哑光低反，突显前景金属对比度
          m.roughness = 0.96;
          m.metalness = 0.05;
          m.envMapIntensity = 0.08;
        } else if (/M_A1_IvoryTile|M_A1_PorcelainSmooth|M_A1_CeladonMint|M_A1_LotusPanel|M_A1_GaugeDial|M_A1_IvoryTileV2|M_A1_CeladonJade|M_A1_FloatSlabTop|M_A1_WaveRelief|M_A1_RedCrest/.test(n)) {
          // 第一幕专属清雅瓷釉砖面/玉釉青瓷/浮雕板/云纹方浮台/大压力表盘（透亮温润不灰暗）
          const p = toPhysical(m);
          p.roughness = /PorcelainSmooth|GaugeDial|FloatSlabTop|CeladonJade/.test(n) ? 0.24 : 0.34;
          p.clearcoat = 0.48;
          p.clearcoatRoughness = 0.22;
          p.envMapIntensity = 0.80;
          if (p.normalMap && p.normalScale) p.normalScale.set(0.95, 0.95);

        } else if (/M_A1_CarpetRed/.test(n)) {

        } else if (/M_A1_PorcelainDeckTop/.test(n)) {

          const p = toPhysical(m);

          p.clearcoat = 0.90;
          p.clearcoatRoughness = 0.12;
          p.envMapIntensity = 0.95;

        } else if (/M_A1_IvoryWarmV3|M_A1_CeladonAgedV3/.test(n)) {

          const p = toPhysical(m);
          p.roughness = /CeladonAged/.test(n) ? 0.24 : 0.28;

        } else if (/WoodWarm|WoodDark/.test(n)) {

          m.envMapIntensity = 0.45;
        } else if (/PlaqueNote_/.test(n)) {

          p.roughness = 0.16;
          p.metalness = 0.12;
          p.clearcoat = 1.0;
          p.clearcoatRoughness = 0.06;
          p.envMapIntensity = 1.45;

          m.roughness = /Iron/.test(n) ? 0.34 : 0.26;

          if (m.normalMap && m.normalScale) m.normalScale.set(1.25, 1.25);
        } else if (/Coral|RedTile|Indigo|CeladonTile|CeladonDeep|Cartouche/.test(n)) {

          if (/Coral|RedTile|Indigo/.test(n)) {
            p.roughness = 0.26;
            p.clearcoat = 0.82;
            p.clearcoatRoughness = 0.14;
            p.envMapIntensity = 1.22;
          } else if (/CeladonTile|CeladonDeep/.test(n)) {

            p.clearcoat = 0.38;
            p.clearcoatRoughness = 0.24;
            p.envMapIntensity = 0.52;
            if (p.normalMap && p.normalScale) p.normalScale.set(1.30, 1.30);
          } else {

            p.clearcoatRoughness = 0.24;
            p.envMapIntensity = 0.90;
          }
          out = p;
        } else if (/IvoryWarm|IvoryStone|BalconyTile|RampInlay|PinkStone/.test(n)) {
          // 哑光石材受直射太阳与冷紫蓝天光强烈切面对比（不被环境球洗平）

          m.envMapIntensity = 0.42;
          if (m.normalMap && m.normalScale) m.normalScale.set(1.25, 1.25);
        } else if (m.metalnessMap || m.roughnessMap) {

          p.roughness = 0.72;
          p.envMapIntensity = 0.92;
          p.clearcoat = 0.28;
          p.clearcoatRoughness = 0.26;
          out = p;
        } else {
          m.envMapIntensity = 0.85;
        }
        cache.set(m, out);
        return out;
      };
      root.traverse((o) => {
        if (!o.isMesh || !o.material) return;
        o.material = Array.isArray(o.material) ? o.material.map(upgrade) : upgrade(o.material);
      });
    }

    // === 正交等距相机（严格 45°/135°/225°/315° 整数比例视线向量） ===
    const wrap = document.getElementById("canvas-wrap");
    const hoverTag = document.getElementById("hover-tag");
    const isMobileLike = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || Math.min(window.innerWidth, window.innerHeight) <= 768;
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.10;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setClearColor(0x000000, 0);
    renderer.localClippingEnabled = true;
    wrap.appendChild(renderer.domElement);

    const isWebGL2 = renderer.capabilities.isWebGL2;
    const supportsHalfFloatRT = isWebGL2 || !!renderer.extensions.get("EXT_color_buffer_half_float");
    const rtType = supportsHalfFloatRT ? THREE.HalfFloatType : THREE.UnsignedByteType;
    const mainRtSamples = isWebGL2 ? 4 : 0;

    const scene = new THREE.Scene();
    const pmrem = new THREE.PMREMGenerator(renderer);
    // 三光箱柔和黄昏摄影棚环境球（强化金属/釉面反射对比，控制柔和光窗峰值杜绝 HDR 噪点白点）
    function buildDuskEnvScene() {
      const es = new THREE.Scene();
      const em = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        vertexShader: `varying vec3 vP; void main() { vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `varying vec3 vP;
          void main() {
            float h = vP.y;
            vec3 top = vec3(0.98, 0.88, 0.82);
            vec3 hor = vec3(1.00, 0.92, 0.84);
            vec3 bot = vec3(0.16, 0.20, 0.32);
            vec3 c = h > 0.0 ? mix(hor, top, smoothstep(0.0, 0.75, h)) : mix(hor, bot, smoothstep(0.0, 0.30, -h));
            c += vec3(0.55, 0.46, 0.32) * smoothstep(0.55, 0.94, dot(vP, normalize(vec3(0.50, 0.72, 0.48))));
            c += vec3(0.24, 0.36, 0.42) * smoothstep(0.45, 0.92, dot(vP, normalize(vec3(-0.62, 0.48, -0.62))));
            c += vec3(0.28, 0.20, 0.22) * smoothstep(0.50, 0.92, dot(vP, normalize(vec3(-0.65, 0.35, 0.68))));
            gl_FragColor = vec4(c, 1.0);
          }`,
      });
      es.add(new THREE.Mesh(new THREE.SphereGeometry(10, 48, 24), em));
      return es;
    }
    // 第一幕专属清润豆青绿摄影棚环境球（仅第一幕启用，第 2/3 幕 100% 沿用 duskEnvTex）
    function buildAct1CeladonEnvScene() {
      const es = new THREE.Scene();
      const em = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        vertexShader: `varying vec3 vP; void main() { vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `varying vec3 vP;
          void main() {
            float h = vP.y;
            vec3 top = vec3(0.84, 0.97, 0.93);
            vec3 hor = vec3(0.88, 0.98, 0.94);
            vec3 bot = vec3(0.14, 0.30, 0.36);
            vec3 c = h > 0.0 ? mix(hor, top, smoothstep(0.0, 0.75, h)) : mix(hor, bot, smoothstep(0.0, 0.30, -h));
            c += vec3(0.40, 0.52, 0.46) * smoothstep(0.55, 0.94, dot(vP, normalize(vec3(0.50, 0.72, 0.48))));
            c += vec3(0.24, 0.44, 0.40) * smoothstep(0.45, 0.92, dot(vP, normalize(vec3(-0.62, 0.48, -0.62))));
            c += vec3(0.22, 0.36, 0.34) * smoothstep(0.50, 0.92, dot(vP, normalize(vec3(-0.65, 0.35, 0.68))));
            gl_FragColor = vec4(c, 1.0);
          }`,
      });
      es.add(new THREE.Mesh(new THREE.SphereGeometry(10, 48, 24), em));
      return es;
    }
    const duskEnvTex = pmrem.fromScene(buildDuskEnvScene(), 0.025).texture;
    const act1CeladonEnvTex = pmrem.fromScene(buildAct1CeladonEnvScene(), 0.025).texture;
    scene.environment = duskEnvTex;
    scene.environmentIntensity = 0.78;
    // === V45 屏幕空间「纯外描边 + 部件分界 + 大起伏棱线」双通道后处理管线 ===
    const _rtSize = new THREE.Vector2();
    renderer.getDrawingBufferSize(_rtSize);
    const _initRtW = Math.max(1, Math.floor(_rtSize.x));
    const _initRtH = Math.max(1, Math.floor(_rtSize.y));

    const mainRT = new THREE.WebGLRenderTarget(_initRtW, _initRtH, {
      type: rtType,
      samples: mainRtSamples,
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      depthBuffer: true,
    });
    const edgeInfoRT = new THREE.WebGLRenderTarget(_initRtW, _initRtH, {
      type: rtType,
      samples: 0,
      minFilter: THREE.NearestFilter,
      magFilter: THREE.NearestFilter,
      depthBuffer: true,
    });

    const edgeInfoMat = new THREE.ShaderMaterial({
      uniforms: {
        uPartId: { value: 2.0 },
        uClipActive: { value: 0.0 },
        uClipY: { value: 0.0 },
      },
      side: THREE.DoubleSide,
      vertexShader: `
        #include <common>
        #include <skinning_pars_vertex>
        varying vec3 vViewNormal;
        varying float vViewDepth;
        varying float vWorldY;
        void main() {
          #include <beginnormal_vertex>
          #include <skinbase_vertex>
          #include <skinnormal_vertex>
          #include <begin_vertex>
          #include <skinning_vertex>
          #include <project_vertex>
          vViewNormal = normalize(normalMatrix * objectNormal);
          vViewDepth = -mvPosition.z;
          vWorldY = (modelMatrix * vec4(transformed, 1.0)).y;
        }
      `,
      fragmentShader: `
        uniform float uPartId;
        uniform float uClipActive;
        uniform float uClipY;
        varying vec3 vViewNormal;
        varying float vViewDepth;
        varying float vWorldY;
        void main() {

          if (n.z < 0.0) n = -n;
          float dNorm = (vViewDepth - 2.0) / 80.0;
          gl_FragColor = vec4(n.x * 0.5 + 0.5, n.y * 0.5 + 0.5, dNorm, uPartId);
        }

      blending: THREE.NoBlending,
      depthTest: true,
      depthWrite: true,
    });

    const compositeScene = new THREE.Scene();
    const compositeCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const compositeMat = new THREE.ShaderMaterial({
      uniforms: {
        tColor: { value: mainRT.texture },
        tEdge: { value: edgeInfoRT.texture },
        uTexelSize: { value: new THREE.Vector2(1.0 / _initRtW, 1.0 / _initRtH) },
        uEdgeStep: { value: 1.0 },
        uEdgeColor: { value: new THREE.Color(0.06, 0.09, 0.085) },
        uEdgeAlpha: { value: isMobileLike ? 0.68 : 0.78 },
        uIsMobile: { value: isMobileLike ? 1.0 : 0.0 },
        uCamSpin: { value: 0.0 },
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D tColor;
        uniform sampler2D tEdge;
        uniform vec2 uTexelSize;
        uniform float uEdgeStep;
        uniform vec3 uEdgeColor;
        uniform float uEdgeAlpha;
        uniform float uIsMobile;
        uniform float uCamSpin;
        varying vec2 vUv;

        vec3 decodeViewNormal(vec2 rg) {
          vec2 nxy = rg * 2.0 - 1.0;
          float lenSq = dot(nxy, nxy);
          if (lenSq > 1.0) {
            nxy *= inversesqrt(lenSq);
            lenSq = 1.0;
          }
          return vec3(nxy, sqrt(max(0.0, 1.0 - lenSq)));
        }

        float edgeDepth(vec4 e) {
          return e.a < 0.5 ? 1.5 : e.b;
        }

        float partGroup(float a) {
          return a < 0.5 ? 0.0 : floor(a * 0.5 + 0.1);
        }

        void main() {
          vec2 stepUv = uTexelSize * uEdgeStep;
          vec4 cMain = texture2D(tColor, vUv);

          // 3x3（9 点整数 texel）采样：提供旋转各向同性 Sobel 深度/法线梯度与 8 邻域抗锯齿覆盖率
          vec4 eC  = texture2D(tEdge, vUv);
          vec4 eL  = texture2D(tEdge, vUv - vec2(stepUv.x, 0.0));
          vec4 eR  = texture2D(tEdge, vUv + vec2(stepUv.x, 0.0));
          vec4 eU  = texture2D(tEdge, vUv + vec2(0.0, stepUv.y));
          vec4 eD  = texture2D(tEdge, vUv - vec2(0.0, stepUv.y));
          vec4 eUL = texture2D(tEdge, vUv + vec2(-stepUv.x,  stepUv.y));
          vec4 eUR = texture2D(tEdge, vUv + vec2( stepUv.x,  stepUv.y));
          vec4 eDL = texture2D(tEdge, vUv + vec2(-stepUv.x, -stepUv.y));
          vec4 eDR = texture2D(tEdge, vUv + vec2( stepUv.x, -stepUv.y));

          float dC  = edgeDepth(eC);
          float dL  = edgeDepth(eL);
          float dR  = edgeDepth(eR);
          float dU  = edgeDepth(eU);
          float dD  = edgeDepth(eD);
          float dUL = edgeDepth(eUL);
          float dUR = edgeDepth(eUR);
          float dDL = edgeDepth(eDL);
          float dDR = edgeDepth(eDR);

          float pC  = partGroup(eC.a);
          float pL  = partGroup(eL.a);
          float pR  = partGroup(eR.a);
          float pU  = partGroup(eU.a);
          float pD  = partGroup(eD.a);
          float pUL = partGroup(eUL.a);
          float pUR = partGroup(eUR.a);
          float pDL = partGroup(eDL.a);
          float pDR = partGroup(eDR.a);

          // 1. 3x3 旋转各向同性 Sobel 外轮廓（消除非 45° 旋转时的边线闪烁跳动）
          float dGx = (dUR + 2.0 * dR + dDR) - (dUL + 2.0 * dL + dDL);
          float dGy = (dUL + 2.0 * dU + dUR) - (dDL + 2.0 * dD + dDR);
          float dSobel = length(vec2(dGx, dGy)) * 0.25;
          float dDiffMax = max(max(abs(dC - dL), abs(dC - dR)), max(abs(dC - dU), abs(dC - dD)));
          float frontBias = (pC > 0.5) ? 1.0 : 0.42;
          float silhouetteEdge = smoothstep(0.0042, 0.0110, max(dSobel, dDiffMax * 0.85)) * frontBias;

          // 2. 8 邻域覆盖率部件分界线（平滑过渡斜边，根除旋转“蚂蚁爬行”锯齿）
          float bSum = 0.0;
          if (pC > 0.5) {
            if (pL  > 0.5 && abs(pC - pL)  >= 0.5 && dC <= dL  + 0.0028) bSum += 1.0;
            if (pR  > 0.5 && abs(pC - pR)  >= 0.5 && dC <= dR  + 0.0028) bSum += 1.0;
            if (pU  > 0.5 && abs(pC - pU)  >= 0.5 && dC <= dU  + 0.0028) bSum += 1.0;
            if (pD  > 0.5 && abs(pC - pD)  >= 0.5 && dC <= dD  + 0.0028) bSum += 1.0;
            if (pUL > 0.5 && abs(pC - pUL) >= 0.5 && dC <= dUL + 0.0028) bSum += 0.5;
            if (pUR > 0.5 && abs(pC - pUR) >= 0.5 && dC <= dUR + 0.0028) bSum += 0.5;
            if (pDL > 0.5 && abs(pC - pDL) >= 0.5 && dC <= dDL + 0.0028) bSum += 0.5;
            if (pDR > 0.5 && abs(pC - pDR) >= 0.5 && dC <= dDR + 0.0028) bSum += 0.5;
          }
          float boundaryEdge = smoothstep(0.45, 2.35, bSum) * 0.88;

          // 3. 建筑大起伏棱线（3x3 法线 Sobel 梯度 + 移动端旋转期间温和抑制高频细线闪烁）
          bool samePart = (pC > 0.5)
            && (abs(pC - pL)  < 0.5) && (abs(pC - pR)  < 0.5)
            && (abs(pC - pU)  < 0.5) && (abs(pC - pD)  < 0.5)
            && (abs(pC - pUL) < 0.5) && (abs(pC - pUR) < 0.5)
            && (abs(pC - pDL) < 0.5) && (abs(pC - pDR) < 0.5);
          bool allowCrease = samePart
            && (mod(floor(eC.a  + 0.5), 2.0) > 0.5)
            && (mod(floor(eL.a  + 0.5), 2.0) > 0.5)
            && (mod(floor(eR.a  + 0.5), 2.0) > 0.5)
            && (mod(floor(eU.a  + 0.5), 2.0) > 0.5)
            && (mod(floor(eD.a  + 0.5), 2.0) > 0.5)
            && (mod(floor(eUL.a + 0.5), 2.0) > 0.5)
            && (mod(floor(eUR.a + 0.5), 2.0) > 0.5)
            && (mod(floor(eDL.a + 0.5), 2.0) > 0.5)
            && (mod(floor(eDR.a + 0.5), 2.0) > 0.5);
          float creaseEdge = 0.0;
          if (allowCrease && silhouetteEdge < 0.25) {
            vec3 nL  = decodeViewNormal(eL.rg);
            vec3 nR  = decodeViewNormal(eR.rg);
            vec3 nU  = decodeViewNormal(eU.rg);
            vec3 nD  = decodeViewNormal(eD.rg);
            vec3 nUL = decodeViewNormal(eUL.rg);
            vec3 nUR = decodeViewNormal(eUR.rg);
            vec3 nDL = decodeViewNormal(eDL.rg);
            vec3 nDR = decodeViewNormal(eDR.rg);
            vec3 nGx = (nUR + 2.0 * nR + nDR) - (nUL + 2.0 * nL + nDL);
            vec3 nGy = (nUL + 2.0 * nU + nUR) - (nDL + 2.0 * nD + nDR);
            float nGrad = length(vec2(length(nGx), length(nGy))) * 0.25;
            float crLo = mix(0.58, 0.78, uIsMobile);
            float crHi = mix(0.94, 1.18, uIsMobile);
            creaseEdge = smoothstep(crLo, crHi, nGrad) * mix(0.80, 0.68, uIsMobile);
          }
          float spinAtten = clamp(uCamSpin, 0.0, 1.0) * uIsMobile;
          creaseEdge *= (1.0 - spinAtten * 0.72);

          float edgeStrength = max(max(silhouetteEdge, boundaryEdge), creaseEdge);
          float edgeAlpha = clamp(edgeStrength * uEdgeAlpha * mix(1.0, 0.84, spinAtten), 0.0, 1.0);

          // 线性色 unpremultiply -> ACESFilmicToneMapping -> sRGB -> 预乘 Porter-Duff SrcOver 合成
          vec3 sceneSrgb = vec3(0.0);
          if (cMain.a > 0.001) {
            vec3 rawLin = max(cMain.rgb / max(cMain.a, 0.001), vec3(0.0));

    const ACT1_WATER_FRAG = `

            float d = dot(r, r);
            if (d < md1) {
              md2 = md1;
              md1 = d;
            } else if (d < md2) {
              md2 = d;
            }
          }
        }
        return vec2(sqrt(md2) - sqrt(md1), sqrt(md1));
      }

      // 满池散落的微小锐利纯白闪烁星点（加密点阵、缩小点径与晕白）
      float evalSparkleDots(vec2 p, float t) {
        float s = 0.0;
        // 层1：清晰主星点（抽稀自然分布，安全内缩避免跨格裁切）
        vec2 p1 = p * 2.80 + vec2(t * 0.07, -t * 0.05);
        vec2 n1 = floor(p1);
        vec2 f1 = fract(p1);
        vec2 h1 = hash22(n1);
        if (h1.x > 0.30) {
          vec2 c1 = 0.20 + 0.60 * hash22(n1 + 19.3)
                  + 0.050 * vec2(sin(t * 1.1 + h1.y * 6.2831), cos(t * 0.9 + h1.x * 6.2831));
          float d1 = length(f1 - c1);
          float tw1 = 0.55 + 0.45 * pow(0.5 + 0.5 * sin(t * 2.0 + h1.x * 23.0 + h1.y * 17.0), 1.6);
          float core1 = smoothstep(0.068, 0.028, d1);
          float halo1 = smoothstep(0.110, 0.032, d1) * 0.12;
          s += (core1 + halo1) * tw1;
        }
        // 层2：更细小错位碎星点
        vec2 p2 = vec2(p.x * 3.90 + p.y * 0.70, -p.x * 0.70 + p.y * 3.90)
                + vec2(-t * 0.05, t * 0.06) + 11.7;
        vec2 n2 = floor(p2);
        vec2 f2 = fract(p2);
        vec2 h2 = hash22(n2 + 7.1);
        if (h2.y > 0.40) {
          vec2 c2 = 0.18 + 0.64 * hash22(n2 + 41.2)
                  + 0.045 * vec2(cos(t * 1.3 + h2.x * 6.2831), sin(t * 1.2 + h2.y * 6.2831));
          float d2 = length(f2 - c2);
          float tw2 = 0.38 + 0.62 * pow(0.5 + 0.5 * sin(t * 2.8 + h2.y * 31.0 + h2.x * 13.0), 2.1);
          float core2 = smoothstep(0.055, 0.020, d2);
          s += core2 * tw2 * 0.90;
        }
        return clamp(s, 0.0, 1.0);
      }

      void main() {
        vec2 w = vWorldXZ;
        // 1. 仅对真实池壁（经 uEdgeMask 与围栏实际起止坐标过滤内接缝）及全部涉水物体计算精准水际距离场
        // 注：PlaneGeometry 绕 X 轴转 -PI/2 后，vUv.x=0/1 为 minX/maxX，vUv.y=1/0 为 minZ/maxZ
        // uEdgeMask.z > 1.5 表示该北侧边缘仅在中-南分隔围栏区间 w.x ∈ [-2.69, 3.45] 有效，开放水道处平滑关闭
        float wallMinZMask = uEdgeMask.z > 1.5
          ? smoothstep(-2.78, -2.60, w.x) * (1.0 - smoothstep(3.38, 3.55, w.x))
          : uEdgeMask.z;
        float dMinX = mix(9.9, vUv.x * uPoolSize.x, uEdgeMask.x);
        float dMaxX = mix(9.9, (1.0 - vUv.x) * uPoolSize.x, uEdgeMask.y);
        float dMinZ = mix(9.9, (1.0 - vUv.y) * uPoolSize.y, wallMinZMask);
        float dMaxZ = mix(9.9, vUv.y * uPoolSize.y, uEdgeMask.w);
        float edgeDist = min(min(dMinX, dMaxX), min(dMinZ, dMaxZ));

        // 固定圆柱/基座类涉水物体（按 GLB 实测世界尺寸精密贴合）
        float dObj = 9.9;
        dObj = min(dObj, max(0.0, length(w - vec2(-0.20, -0.25)) - 0.79));   // 中央主水柱
        dObj = min(dObj, max(0.0, length(w - vec2(-2.39,  0.1014)) - 0.26)); // 接水石槽立柱
        dObj = min(dObj, max(0.0, length(w - vec2(-1.72, -3.45)) - 0.54));   // 顶层浮球标笼基座
        dObj = min(dObj, max(0.0, length(w - vec2(-3.00,  1.00)) - 0.24));   // 退水立桩
        dObj = min(dObj, max(0.0, length(w - vec2(-3.20,  2.12)) - 0.22));   // 宝瓶蓄水阀座
        dObj = min(dObj, max(0.0, length(w - vec2(-2.22, -2.48)) - 0.17));   // 北侧压力表立桩
        dObj = min(dObj, max(0.0, length(w - vec2(-1.72,  0.88)) - 0.17));   // 中侧压力表立桩

        // 4 块浸水圆角方浮台（严格对应 GLB 实测半宽：东侧 0.50x0.39，西南 0.45x0.35）
        dObj = min(dObj, max(0.0, sdRoundBox(w - vec2( 4.55, 0.45), vec2(0.50, 0.39), 0.13)));
        dObj = min(dObj, max(0.0, sdRoundBox(w - vec2( 4.85, 1.92), vec2(0.50, 0.39), 0.13)));
        dObj = min(dObj, max(0.0, sdRoundBox(w - vec2( 5.05, 3.40), vec2(0.50, 0.39), 0.13)));
        dObj = min(dObj, max(0.0, sdRoundBox(w - vec2(-4.40, 3.72), vec2(0.45, 0.35), 0.12)));

        // 北池 3 尊全程露水莲瓣圆瓷墩
        dObj = min(dObj, max(0.0, length(w - vec2( 1.65, -3.18)) - 0.30));
        dObj = min(dObj, max(0.0, length(w - vec2( 0.50, -3.18)) - 0.30));
        dObj = min(dObj, max(0.0, length(w - vec2(-0.65, -3.18)) - 0.30));

        // 南池 6 尊莲瓣圆瓷墩（仅在蓄水涨潮破水浮起 uPadsUp > 0.05 时启用贴边白波线）
        if (uPadsUp > 0.05) {
          float dSP = 9.9;
          dSP = min(dSP, max(0.0, length(w - vec2(-2.85, 3.22)) - 0.38));
          dSP = min(dSP, max(0.0, length(w - vec2(-1.62, 3.22)) - 0.38));
          dSP = min(dSP, max(0.0, length(w - vec2(-0.39, 3.22)) - 0.38));
          dSP = min(dSP, max(0.0, length(w - vec2( 0.84, 3.22)) - 0.38));
          dSP = min(dSP, max(0.0, length(w - vec2( 2.07, 3.22)) - 0.38));
          dSP = min(dSP, max(0.0, length(w - vec2( 3.30, 3.22)) - 0.38));
          dObj = min(dObj, mix(9.9, dSP, smoothstep(0.05, 0.65, uPadsUp)));
        }

        float wallD = min(edgeDist, dObj);
        float depthF = smoothstep(0.015, 0.38, wallD) * uDepthScale;
        float activeScale = smoothstep(0.14, 0.70, uDepthScale);

        // 2. 清透平滑的卡通泳池碧蓝渐变基底（收紧岸边过渡距离，保留窄槽饱满晴蔚蓝）
        vec3 waterBody = mix(uShallow, uMid, smoothstep(0.01, 0.36, depthF));
        waterBody = mix(waterBody, uDeep, smoothstep(0.32, 0.88, depthF));

        // 3. 轻柔细腻微荡与收敛白墙倒影冲白（保持通透清澈、池底红阀轮与圆墩清晰可辨）
        float dj = length(w - uJetPos);
        float jetEnv = exp(-dj * 1.25) * smoothstep(1.85, 0.10, dj) * uJetRipple;
        float jetPhase = dj * 34.0 - time * 6.5;
        vec2 jetDir = dj > 0.001 ? (w - uJetPos) / dj : vec2(0.0);

        float rx = sin(w.y * 7.2 + time * 1.45) * 0.50 + cos((w.x + w.y) * 9.8 - time * 1.20) * 0.28;
        float rz = cos(w.x * 6.8 + time * 1.35) * 0.50 + sin((w.x - w.y) * 9.2 + time * 1.15) * 0.28;
        vec2 waveGrad = vec2(rx, rz) * 0.38 + jetDir * sin(jetPhase) * jetEnv * 0.65;
        vec2 off = ripple > 0.0 ? waveGrad * ripple * mix(0.35, 1.0, activeScale) : vec2(0.0);

        vec2 uv = vUvProj.xy / vUvProj.w + off;
        vec2 d = texelSize * 1.10;
        vec4 c0 = texture2D(tMirror, uv);
        vec4 c1 = texture2D(tMirror, uv + vec2( d.x, 0.0));
        vec4 c2 = texture2D(tMirror, uv + vec2(-d.x, 0.0));
        vec4 c3 = texture2D(tMirror, uv + vec2(0.0,  d.y));
        vec4 c4 = texture2D(tMirror, uv + vec2(0.0, -d.y));
        vec4 r = clamp((c0 * 2.0 + c1 + c2 + c3 + c4) / 6.0, 0.0, 1.0);
        vec3 reflRgb = r.a > 0.02 ? clamp(r.rgb / max(r.a, 0.02), 0.0, 1.0) : waterBody;

        float reflWeight = clamp(strength * mix(0.38, 0.72, depthF), 0.05, 0.24) * smoothstep(0.08, 0.78, r.a);
        vec3 col = mix(waterBody, reflRgb * tint, reflWeight);

        // 4. 加密细密的柔和发光水底焦散光网（细化晶胞与线宽，去除白雾感）
        vec2 wFlow = w + vec2(sin(w.y * 2.8 + time * 1.05), cos(w.x * 2.6 - time * 0.95)) * 0.075;
        vec2 vC1 = voronoiCell(wFlow * 2.10 + vec2(time * 0.15, -time * 0.11), time * 1.05);
        vec2 vC2 = voronoiCell(wFlow * 3.25 + vec2(-time * 0.12, time * 0.16) + 3.7, time * 1.30);
        float glow1 = pow(1.0 - smoothstep(0.0, 0.23, vC1.x), 2.75);
        float glow2 = pow(1.0 - smoothstep(0.0, 0.19, vC2.x), 3.00);
        float causticSoft = clamp(glow1 * 0.62 + glow2 * 0.42, 0.0, 1.0);
        float causticNodes = pow(glow1 * glow2, 0.85) * 0.22;
        float causticVis = mix(0.45, 0.95, smoothstep(0.03, 0.24, wallD)) * activeScale;
        col = mix(col, vec3(0.54, 0.90, 1.0), clamp(causticSoft * 0.34 + causticNodes * 0.12, 0.0, 0.42) * causticVis);

        // 极轻度贴边浅亮水晕（严控 8cm 内，绝不令窄池水体泛白）
        float edgeGlow = (1.0 - smoothstep(0.0, 0.08, wallD)) * 0.09 * activeScale;
        col = mix(col, vec3(0.45, 0.88, 1.0), edgeGlow);

        // 5. 满池微小锐利纯白闪烁星芒光点（加密小径点光）
        float sparkles = evalSparkleDots(w, time) * activeScale;
        col = mix(col, vec3(1.0, 1.0, 1.0), clamp(sparkles * 0.85, 0.0, 0.90));

        // 6. 紧贴池壁及涉水物体周缘的纤细手绘纯白波浪双边线 + 收敛落水细环
        float wobble = (sin(w.x * 8.4 + w.y * 6.2 + time * 1.75) * 0.55
                      + cos(w.x * 5.8 - w.y * 9.2 - time * 1.45) * 0.45) * 0.009;
        float dFoam = max(0.0, wallD + wobble);
        // 内道：极贴边纤细主白线（1.2~2.4cm）
        float innerLine = 1.0 - smoothstep(0.012, 0.024, dFoam);
        // 外道：紧随 ~3.5cm 外的轻量断续伴生细线
        float outerWave = sin(w.x * 6.2 - w.y * 5.4 + time * 1.35) * 0.006;
        float outerGapBreak = smoothstep(-0.15, 0.35,
          sin(w.x * 4.2 + w.y * 4.8 - time * 0.90) + 0.55 * cos(w.x * 6.8 - w.y * 3.6 + time * 0.75));
        float outerLine = (1.0 - smoothstep(0.006, 0.013, abs(dFoam - (0.048 + outerWave))))
                        * mix(0.20, 0.65, outerGapBreak);
        float jetThinRing = smoothstep(0.92, 0.985, sin(jetPhase)) * jetEnv * 0.62;

        float foamMask = clamp(innerLine * 0.85 + outerLine * 0.60 + jetThinRing, 0.0, 0.90) * activeScale;
        col = mix(col, vec3(0.96, 0.995, 1.0), foamMask);

        // 清透饱满的水体 Alpha（边线与星光维持清晰但绝不泛白）
        float baseA = clamp(alpha * mix(0.80, 1.06, depthF), 0.20, 0.78);
        float crispA = clamp(max(foamMask * 0.90, sparkles * 0.88), 0.0, 0.93);
        float outA = max(baseA, crispA);
        gl_FragColor = vec4(col, outA);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`;

    // === 第三幕专属夜间金色波光海面 Shader（横向水波摇曳暖光倒影 + 外海远空自然淡入星幕，绝不修改第 1/2 幕 Shader） ===
    const ACT3_NIGHT_WATER_FRAG = `
      uniform sampler2D tMirror;
      uniform vec2 texelSize;
      uniform vec3 tint;
      uniform vec3 deep;
      uniform float strength;
      uniform float alpha;
      uniform float ripple;
      uniform float time;
      uniform float uEdgeFade;
      varying vec4 vUvProj;
      varying vec2 vWorldXZ;
      void main() {
        vec2 w = vWorldXZ;
        float waveA = sin(w.y * 16.0 + time * 2.2 + sin(w.x * 2.4 - time * 0.8) * 1.1);
        float waveB = cos(w.y * 25.0 - time * 2.9 + w.x * 3.1);
        vec2 off = ripple > 0.0
          ? vec2((waveA * 0.72 + waveB * 0.36) * ripple, waveB * ripple * 0.22)
          : vec2(0.0);
        vec2 uv = vUvProj.xy / vUvProj.w + off;
        vec2 d = texelSize * 1.25;
        vec4 c0 = texture2D(tMirror, uv);
        vec4 c1 = texture2D(tMirror, uv + vec2( d.x, 0.0));
        vec4 c2 = texture2D(tMirror, uv + vec2(-d.x, 0.0));
        vec4 c3 = texture2D(tMirror, uv + vec2(0.0,  d.y));
        vec4 c4 = texture2D(tMirror, uv + vec2(0.0, -d.y));
        vec4 r = clamp((c0 * 2.0 + c1 + c2 + c3 + c4) / 6.0, 0.0, 1.0);
        vec3 reflRgb = r.a > 0.02 ? clamp(r.rgb / max(r.a, 0.02), 0.0, 1.0) : deep;
        // 强化暖黄灯火与红铜火光倒影，切碎出夜间水波金色条纹并保留柔和倒影感
        float warmLum = max(reflRgb.r * 0.65 + reflRgb.g * 0.36 - reflRgb.b * 0.25, 0.0);
        float rib = 0.76 + 0.24 * sin(w.y * 19.0 + w.x * 1.8 - time * 2.6);
        vec3 litRefl = reflRgb * tint * rib + vec3(1.0, 0.74, 0.26) * pow(clamp(warmLum, 0.0, 1.0), 1.32) * 0.62 * rib;
        float rMix = strength * smoothstep(0.05, 0.68, r.a);
        vec3 col = mix(deep, litRefl, rMix);
        // 外海仅在存在倒影处渐显倒影拖尾，远空无倒影区域完全透明露出纯净繁星夜空
        float seaMask = uEdgeFade > 0.5
          ? smoothstep(0.05, 0.45, r.a) * (1.0 - smoothstep(13.0, 22.0, length((w - vec2(0.0, 0.2)) * vec2(0.68, 1.05))))
          : 1.0;
        float outA = clamp((alpha * mix(0.68, 1.0, smoothstep(0.04, 0.72, r.a)) + warmLum * 0.28) * seaMask, 0.0, 0.94);
        gl_FragColor = vec4(col, outA);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`;

    let mirrors = [];
    const _mv2 = new THREE.Vector2();
    const _mPos = new THREE.Vector3();
    const _mDir = new THREE.Vector3();
    const _mUp = new THREE.Vector3();
    const _mClear = new THREE.Color();
    const _mBias = new THREE.Matrix4().set(0.5, 0, 0, 0.5, 0, 0.5, 0, 0.5, 0, 0, 0.5, 0.5, 0, 0, 0, 1);

    /** 创建一个水平镜面反射平面并加入当前关卡（全分辨率线性过滤，支持第一幕水晶水与第三幕夜海波光 Shader）。 */
    function addMirror(opt) {
      const mirrorSamples = isMobileLike ? 0 : (isWebGL2 ? (opt.samples || 0) : 0);
      const sharedFrom = opt.sharedWith || null;
      const rt = sharedFrom
        ? sharedFrom.rt
        : new THREE.WebGLRenderTarget(4, 4, {
            type: THREE.UnsignedByteType,
            samples: mirrorSamples,
            minFilter: THREE.LinearFilter,
            magFilter: THREE.LinearFilter,
          });
      const geo = new THREE.PlaneGeometry(opt.width, opt.depth);
      geo.rotateX(-Math.PI / 2);
      geo.deleteAttribute("normal"); // 无法线 -> 跳过描边
      const uniforms = {
        tMirror: { value: rt.texture },
        texelSize: { value: new THREE.Vector2(1 / 512, 1 / 512) },
        textureMatrix: { value: new THREE.Matrix4() },
        tint: { value: new THREE.Color(opt.tint) },
        deep: { value: new THREE.Color(opt.deep) },
        strength: { value: opt.strength },
        alpha: { value: opt.alpha },
        ripple: { value: opt.ripple },
        time: { value: 0 },
      };
      if (opt.crystalWater) {
        uniforms.uShallow = { value: new THREE.Color(opt.shallow ?? 0x90ece0) };
        uniforms.uMid = { value: new THREE.Color(opt.mid ?? 0x32b4b2) };
        uniforms.uDeep = { value: new THREE.Color(opt.deep) };
        uniforms.uPoolSize = { value: new THREE.Vector2(opt.width, opt.depth) };
        uniforms.uDepthScale = { value: opt.depthScale ?? 1.0 };
        uniforms.uJetPos = { value: new THREE.Vector2(1.10, -0.26) };
        uniforms.uJetRipple = { value: 1.0 };
        const em = opt.edgeMask ?? [1, 1, 1, 1];
        uniforms.uEdgeMask = { value: new THREE.Vector4(em[0], em[1], em[2], em[3]) };
        uniforms.uPadsUp = { value: opt.padsUp ?? 0.0 };
      }
      if (opt.nightWater) {
        uniforms.uEdgeFade = { value: opt.edgeFade ?? 0.0 };
      }
      const mat = new THREE.ShaderMaterial({
        vertexShader: opt.crystalWater ? ACT1_WATER_VERT : MIRROR_VERT,
        fragmentShader: opt.crystalWater ? ACT1_WATER_FRAG : (opt.nightWater ? ACT3_NIGHT_WATER_FRAG : MIRROR_FRAG),
        uniforms,
        transparent: opt.alpha < 1.0,
        depthWrite: opt.alpha >= 1.0,
        polygonOffset: true,
        polygonOffsetFactor: -2,
        polygonOffsetUnits: -2,
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(opt.x, opt.y, opt.z);
      mesh.receiveShadow = false;
      mesh.renderOrder = opt.alpha < 1.0 ? 2 : 0;
      levelRoot.add(mesh);
      const cam = new THREE.OrthographicCamera();
      const clipY = opt.clipY !== undefined ? opt.clipY : (opt.y - 0.004);
      const m = { mesh, rt, cam, y: opt.y, resScale: opt.resScale || 1.0, sharedFrom,
        clip: new THREE.Plane(new THREE.Vector3(0, 1, 0), -clipY) };
      mirrors.push(m);
      return m;
    }

    const _mLook = new THREE.Vector3();
    let _mirrorFrameCount = 0;
    let _mirrorLastYaw = 999;
    let _mirrorLastZoom = 999;
    let _mirrorLastPanX = 999;
    let _mirrorLastPanZ = 999;

    /** 每帧在主渲染前更新所有镜面的反射纹理（移动端半分辨率、关阴影、稳态分帧轮流更新）。 */
    function updateMirrors(now) {
      if (!mirrors.length) return;
      _mirrorFrameCount++;
      renderer.getDrawingBufferSize(_mv2);
      camera.updateMatrixWorld();
      const camMoved =
        Math.abs(camYawCurrent - _mirrorLastYaw) > 0.002 ||
        Math.abs(camera.zoom - _mirrorLastZoom) > 0.002 ||
        Math.abs(userPanCurrent.x - _mirrorLastPanX) > 0.001 ||
        Math.abs(userPanCurrent.z - _mirrorLastPanZ) > 0.001;
      _mirrorLastYaw = camYawCurrent;
      _mirrorLastZoom = camera.zoom;
      _mirrorLastPanX = userPanCurrent.x;
      _mirrorLastPanZ = userPanCurrent.z;
      const refreshAll = !isMobileLike || _mirrorFrameCount <= 6 || camMoved;

      const masterMirrors = mirrors.filter((m) => !m.sharedFrom);
      const childMirrors = mirrors.filter((m) => !!m.sharedFrom);
      const timeSec = now * 0.001;

      const prevTarget = renderer.getRenderTarget();
      const prevClip = renderer.clippingPlanes;
      const prevShadow = renderer.shadowMap.autoUpdate;
      const prevShadowEnabled = renderer.shadowMap.enabled;
      renderer.shadowMap.autoUpdate = false;
      if (isMobileLike) renderer.shadowMap.enabled = false;
      mirrors.forEach(mm => { mm.mesh.visible = false; });
      const prevBg = scene.background;
      const prevClearAlpha = renderer.getClearAlpha();
      renderer.getClearColor(_mClear);
      scene.background = null;
      renderer.setClearColor(0x000000, 0);

      masterMirrors.forEach((m, idx) => {
        const effResScale = m.resScale * (isMobileLike ? 0.45 : 1.0);
        const w = Math.max(4, Math.floor(_mv2.x * effResScale));
        const h = Math.max(4, Math.floor(_mv2.y * effResScale));
        if (m.rt.width !== w || m.rt.height !== h) {
          m.rt.setSize(w, h);
          m.mesh.material.uniforms.texelSize.value.set(1.0 / w, 1.0 / h);
        }
        // 镜像相机：位置、对偶焦点与上方向严格关于 y = m.y 平面反射，避免旋转视角时瞄准偏差
        m.cam.copy(camera);
        _mPos.setFromMatrixPosition(camera.matrixWorld);
        _mUp.set(0, 1, 0).applyQuaternion(camera.quaternion);
        _mPos.y = 2 * m.y - _mPos.y;
        _mUp.y = -_mUp.y;
        m.cam.position.copy(_mPos);
        m.cam.up.copy(_mUp);
        _mLook.set(_camLookEff.x, 2 * m.y - _camLookEff.y, _camLookEff.z);
        m.cam.lookAt(_mLook);
        m.cam.updateMatrixWorld();
        m.cam.projectionMatrix.copy(camera.projectionMatrix);
        m.cam.projectionMatrixInverse.copy(camera.projectionMatrixInverse);
        m.mesh.material.uniforms.textureMatrix.value.copy(_mBias).multiply(m.cam.projectionMatrix).multiply(m.cam.matrixWorldInverse);
        m.mesh.material.uniforms.time.value = timeSec;
        if (refreshAll || (idx === (_mirrorFrameCount % Math.max(1, masterMirrors.length)))) {
          renderer.clippingPlanes = [m.clip];
          renderer.setRenderTarget(m.rt);
          renderer.clear();
          renderer.render(scene, m.cam);
        }
      });

      childMirrors.forEach((m) => {
        m.mesh.material.uniforms.texelSize.value.copy(m.sharedFrom.mesh.material.uniforms.texelSize.value);
        m.mesh.material.uniforms.textureMatrix.value.copy(m.sharedFrom.mesh.material.uniforms.textureMatrix.value);
        m.mesh.material.uniforms.time.value = timeSec;
      });

      mirrors.forEach(mm => { mm.mesh.visible = true; });
      scene.background = prevBg;
      renderer.setClearColor(_mClear, prevClearAlpha);
      renderer.setRenderTarget(prevTarget);
      renderer.clippingPlanes = prevClip;
      renderer.shadowMap.autoUpdate = prevShadow;
      renderer.shadowMap.enabled = prevShadowEnabled;
    }

    /**
     * 第三幕 5 屋连动开关实时最短求解器（32 状态 BFS），返回 1-based 点击编号序列。
     */
    function solveAct3Lights(houses) {
      const start = houses.reduce((acc, v, i) => acc | ((v ? 1 : 0) << i), 0);
      if (start === 31) return [];
      const queue = [[start, []]];
      const seen = new Set([start]);
      while (queue.length) {
        const [mask, seq] = queue.shift();
        for (let i = 0; i < 5; i++) {
          let next = mask ^ (1 << i);
          if (i > 0) next ^= (1 << (i - 1));
          if (i < 4) next ^= (1 << (i + 1));
          if (next === 31) return [...seq, i + 1];
          if (!seen.has(next)) {
            seen.add(next);
            queue.push([next, [...seq, i + 1]]);
          }
        }
      }
      return [3, 1, 5];
    }

    function findPath(startId, goalId) {
      if (startId === goalId) return [{ id: startId, teleport: false }];
      const edges = navEdgesFn();
      const adj = {};
      for (const edge of edges) {
        const [a, b, isTeleport = false] = edge;
        (adj[a] ||= []).push({ to: b, teleport: isTeleport });
        (adj[b] ||= []).push({ to: a, teleport: isTeleport });
      }
      const q = [[{ id: startId, teleport: false }]];
      const seen = new Set([startId]);
      while (q.length) {
        const path = q.shift();
        const cur = path[path.length - 1].id;
        for (const nxt of (adj[cur] || [])) {
          if (seen.has(nxt.to)) continue;
          const nextPath = [...path, { id: nxt.to, teleport: nxt.teleport }];
          if (nxt.to === goalId) return nextPath;
          seen.add(nxt.to);
          q.push(nextPath);
        }
      }
      return null;
    }

    function playSacredChime(stepIdx = 1, isStatueTrigger = false) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const pentatonic = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00];
        const baseFreq = pentatonic[Math.max(0, Math.min(pentatonic.length - 1, stepIdx - 1))];
        const now = audioCtx.currentTime;

        const playVoice = (freq, type, peakGain, dur) => {
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          g.gain.setValueAtTime(0.0008, now);
          g.gain.exponentialRampToValueAtTime(peakGain, now + 0.045);
          g.gain.exponentialRampToValueAtTime(0.0008, now + dur);
          osc.connect(g);
          g.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + dur + 0.05);
        };

        playVoice(baseFreq, "sine", 0.14, 1.45);
        playVoice(baseFreq * 2.0, "triangle", 0.055, 1.15);
        if (isStatueTrigger) {
          playVoice(baseFreq * 0.5, "triangle", 0.11, 1.95);
          playVoice(baseFreq * 1.5, "sine", 0.06, 1.70);
        }
      } catch (e) {}
    }

        uniform float uTime;
        uniform float uSpeed;
        uniform vec3 uMistDeep;
        uniform vec3 uMistBright;
        uniform vec3 uHolyCol;
        varying vec3 vWorldPos;

        float hash21(vec2 p) {
          p = fract(p * vec2(123.34, 456.21));
          p += dot(p, p + 45.32);
          return fract(p.x * p.y);
        }
        float noise2D(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          float a = hash21(i);
          float b = hash21(i + vec2(1.0, 0.0));
          float c = hash21(i + vec2(0.0, 1.0));
          float d = hash21(i + vec2(1.0, 1.0));
          return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
        }
        float fbm(vec2 p) {

          for (int k = 0; k < 4; k++) {

          float rad = length(vWorldPos.xz - vec2(0.0, -7.5));
