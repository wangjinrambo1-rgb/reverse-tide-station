      const heroGlowLight = new THREE.PointLight(theme.holyHex, 2.8, 10.5, 1.4);
      ascScene.add(sunDirLight, hemiAsc, heroGlowLight);

      // 3. 两层斜托云海平面 + 28 团漂浮浓雾云絮 + 5 道丁达尔光柱 + 180 粒上升圣光微尘
      const cloudUniformsA = {
        uTime: { value: 0 },
        uSpeed: { value: 0.75 },
        uMistDeep: { value: new THREE.Vector3(...theme.mistDeep) },
        uMistBright: { value: new THREE.Vector3(...theme.mistBright) },
        uHolyCol: { value: new THREE.Vector3(...theme.holyVec) },
      };
      const cloudUniformsB = {
        uTime: { value: 0 },
        uSpeed: { value: -1.15 },
        uMistDeep: { value: new THREE.Vector3(...theme.mistDeep) },
        uMistBright: { value: new THREE.Vector3(...theme.mistBright) },
        uHolyCol: { value: new THREE.Vector3(...theme.holyVec) },
      };
      const seaPlaneGeo = trackOwn(new THREE.PlaneGeometry(220, 220, 1, 1));
      seaPlaneGeo.rotateX(-Math.PI / 2);
      const seaMatA = trackOwn(new THREE.ShaderMaterial({
        uniforms: cloudUniformsA, vertexShader: ASCENSION_MIST_VERT, fragmentShader: ASCENSION_MIST_FRAG,
        transparent: true, depthWrite: false, fog: false,
      }));
      const seaMatB = trackOwn(new THREE.ShaderMaterial({
        uniforms: cloudUniformsB, vertexShader: ASCENSION_MIST_VERT, fragmentShader: ASCENSION_MIST_FRAG,
        transparent: true, depthWrite: false, fog: false,
      }));
      const seaMeshA = new THREE.Mesh(seaPlaneGeo, seaMatA);
      seaMeshA.position.set(0, -2.15, -7.5);
      const seaMeshB = new THREE.Mesh(seaPlaneGeo, seaMatB);
      seaMeshB.position.set(0, 1.05, -7.8);
      seaMeshB.rotation.x = Math.atan2(STEP_DY, STEP_DZ); // 随阶梯上升坡度紧贴于各待升阶梯底下
      ascScene.add(seaMeshA, seaMeshB);

      // 生成柔和雾团 Sprite 纹理
      const puffCanvas = document.createElement("canvas");
      puffCanvas.width = 128; puffCanvas.height = 128;
      const pctx = puffCanvas.getContext("2d");
      const pg = pctx.createRadialGradient(64, 64, 4, 64, 64, 64);
      pg.addColorStop(0.0, "rgba(255,255,255,0.48)");
      pg.addColorStop(0.45, "rgba(255,255,255,0.20)");
      pg.addColorStop(1.0, "rgba(255,255,255,0.0)");
      pctx.fillStyle = pg;
      pctx.fillRect(0, 0, 128, 128);
      const puffTex = trackOwn(new THREE.CanvasTexture(puffCanvas));

      const mistSprites = [];
      for (let i = 0; i < 42; i++) {
        const sm = trackOwn(new THREE.SpriteMaterial({
          map: puffTex,
          color: theme.fogHex,
          transparent: true,
          opacity: 0.30 + (i % 4) * 0.055,
          depthWrite: false,
        }));
        const sp = new THREE.Sprite(sm);
        const kApprox = (i / 42) * 16.5;
        const sideSign = i % 2 === 0 ? -1 : 1;
        const baseX = sideSign * (2.6 + (i % 6) * 1.35) + Math.sin(i * 3.1) * 1.1;
        const baseY = kApprox * STEP_DY - 0.55 + ((i % 3) - 1) * 0.65;
        const baseZ = -kApprox * STEP_DZ;
        const sc = 5.4 + (i % 5) * 1.55;
        sp.scale.set(sc, sc * 0.52, 1);
        sp.position.set(baseX, baseY, baseZ);
        sp.userData = { baseX, baseY, baseZ, spd: 0.22 + (i % 4) * 0.08, ph: i * 0.7 };
        ascScene.add(sp);
        mistSprites.push(sp);
      }

      // 5 道倾泻而下的柔光丁达尔圣光束
      const rayGeo = trackOwn(new THREE.CylinderGeometry(0.65, 4.4, 30, 16, 1, true));
      const rayMat = trackOwn(new THREE.MeshBasicMaterial({
        color: theme.holyHex,
        transparent: true,
        opacity: 0.068,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      }));
      const godRays = [
        [-5.2, 8.2, -3.0, -0.18, 0.22],
        [ 5.2, 8.6, -4.5,  0.18, 0.20],
        [-4.5, 9.8, -8.5, -0.14, 0.24],
        [ 4.5, 10.2, -10.5, 0.14, 0.22],
        [ 0.0, 11.8, -15.5, 0.00, 0.26],
      ].map(([rx, ry, rz, tz, tx]) => {
        const mesh = new THREE.Mesh(rayGeo, rayMat);
        mesh.position.set(rx, ry, rz);
        mesh.rotation.z = tz;
        mesh.rotation.x = tx;
        ascScene.add(mesh);
        return mesh;
      });

      // 260 粒漂浮上升的金色圣光微尘
      const DUST_CNT = 260;
      const dustPos = new Float32Array(DUST_CNT * 3);
      const dustSeed = new Float32Array(DUST_CNT);
      for (let i = 0; i < DUST_CNT; i++) {
        const f = i / DUST_CNT;
        dustPos[i * 3]     = (((Math.sin(i * 19.3) * 4375.1) % 1 + 1) % 1 - 0.5) * 20.0;
        dustPos[i * 3 + 1] = f * 10.5;
        dustPos[i * 3 + 2] = -f * 21.0 + 2.5;
        dustSeed[i] = i * 0.618;
      }
      const dustGeo = trackOwn(new THREE.BufferGeometry());
      dustGeo.setAttribute("position", new THREE.BufferAttribute(dustPos, 3));
      dustGeo.setAttribute("aSeed", new THREE.BufferAttribute(dustSeed, 1));
      const dustMat = trackOwn(new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: {
          uTime: { value: 0 },
          uCol: { value: new THREE.Color(theme.holyHex) },
        },
        vertexShader: `
          attribute float aSeed;
          uniform float uTime;
          varying float vAlpha;
          void main() {
            vec3 p = position;
            p.y += mod(uTime * (0.45 + mod(aSeed, 0.45)) + aSeed * 3.0, 4.2);
            p.x += sin(uTime * 0.9 + aSeed * 5.0) * 0.35;
            vAlpha = 0.45 + 0.55 * sin(uTime * 1.8 + aSeed * 7.0);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
            gl_PointSize = 3.2 + mod(aSeed * 3.0, 3.0);
          }
        `,
        fragmentShader: `
          uniform vec3 uCol;
          varying float vAlpha;
          void main() {
            float d = length(gl_PointCoord - vec2(0.5));
            if (d > 0.5) discard;
            gl_FragColor = vec4(uCol, smoothstep(0.5, 0.05, d) * clamp(vAlpha, 0.15, 0.95));
          }
        `,
      }));
      ascScene.add(new THREE.Points(dustGeo, dustMat));

      // 4. Shared materials & geometries for 11 stairs (step 0 landing + steps 1..10)
      const matStone = trackOwn(new THREE.MeshStandardMaterial({ color: theme.stoneHex, roughness: 0.62, metalness: 0.05 }));
      const matBrassTrim = trackOwn(new THREE.MeshStandardMaterial({ color: 0xd9a84e, roughness: 0.28, metalness: 0.78 }));
      const matCloakStone = trackOwn(new THREE.MeshStandardMaterial({ color: theme.cloakHex, roughness: 0.54, metalness: 0.08 }));
      const matMaskGold = trackOwn(new THREE.MeshStandardMaterial({ color: 0xe6bd68, roughness: 0.25, metalness: 0.82 }));

      const slabGeo = trackOwn(new THREE.BoxGeometry(1.78, 0.14, 0.74));
      const trimGeo = trackOwn(new THREE.BoxGeometry(1.84, 0.045, 0.05));
      const inlayGeo = trackOwn(new THREE.BoxGeometry(0.64, 0.016, 0.52));
      const ringGeo = trackOwn(new THREE.RingGeometry(0.26, 0.38, 28));
      ringGeo.rotateX(-Math.PI / 2);

      const stairObjs = [];
      for (let k = 0; k <= TOTAL_STEPS; k++) {
        const yTarget = k * STEP_DY;
        const zPos = -k * STEP_DZ;
        const g = new THREE.Group();
        const isInitShown = k <= 2;
        const curY = isInitShown ? yTarget : yTarget - 3.6;
        g.position.set(0, curY, zPos);
        g.scale.setScalar(isInitShown ? 1.0 : 0.72);
        g.visible = isInitShown;

        const slab = new THREE.Mesh(slabGeo, matStone);
        slab.position.y = -0.07;
        const frontTrim = new THREE.Mesh(trimGeo, matBrassTrim);
        frontTrim.position.set(0, -0.02, 0.36);
        const backTrim = new THREE.Mesh(trimGeo, matBrassTrim);
        backTrim.position.set(0, -0.02, -0.36);

        const inlayMat = trackOwn(new THREE.MeshStandardMaterial({
          color: theme.cloakHex,
          emissive: theme.holyHex,
          emissiveIntensity: k === 1 ? 0.55 : (k === 0 ? 0.85 : 0.08),
          roughness: 0.35,
          metalness: 0.25,
        }));
        const inlay = new THREE.Mesh(inlayGeo, inlayMat);
        inlay.position.y = 0.005;

        const ringMat = trackOwn(new THREE.MeshBasicMaterial({
          color: theme.holyHex,
          transparent: true,
          opacity: 0.0,
          side: THREE.DoubleSide,
          depthWrite: false,
        }));
        const pulseRing = new THREE.Mesh(ringGeo, ringMat);
        pulseRing.position.y = 0.018;

        g.add(slab, frontTrim, backTrim, inlay, pulseRing);
        ascScene.add(g);
        stairObjs.push({
          k, group: g, yTarget, curY,
          revealed: isInitShown,
          stepped: k === 0,
          scaleCur: isInitShown ? 1.0 : 0.72,
          inlayMat, pulseRing, ringMat,
          ringTime: -1,
        });
      }

      // 5. 两侧 5 对（共 10 尊）精雕神秘古雕像（对应第 2, 4, 6, 8, 10 级）
      const stOctPlinthGeo = trackOwn(new THREE.CylinderGeometry(1.05, 1.24, 0.72, 8));
      const stBaseRingGeo = trackOwn(new THREE.TorusGeometry(1.12, 0.046, 8, 32));
      const stBodyGeo = trackOwn(new THREE.CylinderGeometry(0.46, 0.72, 2.38, 10));
      const stShoulderGeo = trackOwn(new THREE.BoxGeometry(1.52, 0.28, 0.74));
      const stSealGeo = trackOwn(new THREE.TorusGeometry(0.24, 0.04, 8, 20));
      const stHoodGeo = trackOwn(new THREE.CylinderGeometry(0.32, 0.48, 0.86, 10));
      const stMaskGeo = trackOwn(new THREE.BoxGeometry(0.46, 0.56, 0.22));
      const stEyeGeo = trackOwn(new THREE.OctahedronGeometry(0.085, 0));
      const stArmGeo = trackOwn(new THREE.BoxGeometry(0.22, 0.22, 0.88));
      const stOrbGeo = trackOwn(new THREE.OctahedronGeometry(0.28, 0));
      const stHaloOutGeo = trackOwn(new THREE.TorusGeometry(1.32, 0.045, 8, 36));
      const stHaloInGeo = trackOwn(new THREE.TorusGeometry(0.92, 0.036, 8, 28));
      const stRayNeedleGeo = trackOwn(new THREE.ConeGeometry(0.045, 0.34, 6));
      const stDustPtGeo = trackOwn(new THREE.SphereGeometry(0.055, 6, 6));

      function createMysticStatue(side, pairIdx, stepK) {
        const root = new THREE.Group();
        const x = side * 4.65;
        const yBase = stepK * STEP_DY - 1.15;
        const z = -stepK * STEP_DZ;
        root.position.set(x, yBase, z);
        root.scale.setScalar(0.92);
        root.rotation.y = side * (-Math.PI * 0.34);

        const baseRingMat = trackOwn(new THREE.MeshBasicMaterial({ color: 0x3b485a, transparent: true, opacity: 0.45 }));
        const baseRing = new THREE.Mesh(stBaseRingGeo, baseRingMat);
        baseRing.rotation.x = Math.PI / 2;
        baseRing.position.y = 0.74;

        // 兜底占位几何体（Rodin 高精雕像就绪前展示，加载完成后隐藏）
        const fallbackGroup = new THREE.Group();
        const plinth = new THREE.Mesh(stOctPlinthGeo, matStone);
        plinth.position.y = 0.36;
        const robe = new THREE.Mesh(stBodyGeo, matStone);
        robe.position.y = 1.91;
        const shoulders = new THREE.Mesh(stShoulderGeo, matCloakStone);
        shoulders.position.y = 2.94;

        const sealMat = trackOwn(new THREE.MeshStandardMaterial({
          color: 0xd9a84e, emissive: theme.holyHex, emissiveIntensity: 0.08, roughness: 0.28, metalness: 0.78,
        }));
        const chestSeal = new THREE.Mesh(stSealGeo, sealMat);
        chestSeal.position.set(0, 2.58, 0.56);

        const headGroup = new THREE.Group();
        headGroup.position.set(0, 3.45, 0.05);
        headGroup.rotation.x = 0.14;
        const hood = new THREE.Mesh(stHoodGeo, matCloakStone);
        const mask = new THREE.Mesh(stMaskGeo, matMaskGold);
        mask.position.set(0, -0.02, 0.28);
        const eyeMat = trackOwn(new THREE.MeshStandardMaterial({
          color: 0x263442, emissive: theme.accentHex, emissiveIntensity: 0.0, roughness: 0.18,
        }));
        const eyeOrb = new THREE.Mesh(stEyeGeo, eyeMat);
        eyeOrb.position.set(0, 0.10, 0.42);
        headGroup.add(hood, mask, eyeOrb);

        [-0.58, 0.58].forEach((ax) => {
          const arm = new THREE.Mesh(stArmGeo, matStone);
          arm.position.set(ax, 2.66, 0.48);
          arm.rotation.x = 0.26;
          fallbackGroup.add(arm);
        });
        fallbackGroup.add(plinth, robe, shoulders, chestSeal, headGroup);

        // Rodin 3D 神秘守望雕像容器（独立浅克隆材质外壳以便逐对动态唤醒发光，绝不销毁共享贴图）
        const rodinHolder = new THREE.Group();

        // 掌心莲瓣托盘上方悬浮升起的琉璃八面圣球（精确对齐 _v42_ascension_manifest.json 托盘坐标）
        const orbMat = trackOwn(new THREE.MeshStandardMaterial({
          color: 0x3b4d5e, emissive: theme.holyHex, emissiveIntensity: 0.08, roughness: 0.12, metalness: 0.25,
        }));
        const orbMesh = new THREE.Mesh(stOrbGeo, orbMat);
        orbMesh.position.set(0, 2.90, 0.80);

        // 背后双重黄铜星环（位于雕像背轮外侧 z=-0.92m，沉睡态隐去、苏醒后随光渐显逆向旋转）
        const haloGroup = new THREE.Group();
        haloGroup.position.set(0, 3.18, -0.92);
        const haloMat = trackOwn(new THREE.MeshStandardMaterial({
          color: 0xd9a84e, emissive: theme.holyHex, emissiveIntensity: 0.05, roughness: 0.28, metalness: 0.80,
          transparent: true, opacity: 0.0,
        }));
        const haloOuter = new THREE.Group();
        haloOuter.add(new THREE.Mesh(stHaloOutGeo, haloMat));
        for (let rk = 0; rk < 8; rk++) {
          const a = (rk / 8) * Math.PI * 2;
          const spk = new THREE.Mesh(stRayNeedleGeo, haloMat);
          spk.position.set(Math.cos(a) * 1.48, Math.sin(a) * 1.48, 0);
          spk.rotation.z = a - Math.PI / 2;
          haloOuter.add(spk);
        }
        const haloInner = new THREE.Group();
        haloInner.add(new THREE.Mesh(stHaloInGeo, haloMat));
        haloGroup.add(haloOuter, haloInner);

        // 触发专属正面暖光源（照亮 Rodin 雕像正面细节） + 10 颗盘旋金尘粒
        const statueLight = new THREE.PointLight(theme.holyHex, 0.0, 14.0, 1.35);
        statueLight.position.set(0, 3.00, 1.55);

        const dustMatL = trackOwn(new THREE.MeshBasicMaterial({ color: theme.holyHex, transparent: true, opacity: 0.0 }));
        const dustArr = Array.from({ length: 10 }, (_, di) => {
          const dp = new THREE.Mesh(stDustPtGeo, dustMatL);
          dp.userData = { ph: di / 10, ang: (di / 10) * Math.PI * 2 };
          root.add(dp);
          return dp;
        });

        root.add(baseRing, fallbackGroup, rodinHolder, orbMesh, haloGroup, statueLight);
        ascScene.add(root);

        const item = {
          pairIdx, stepK, root,
          triggered: false, wakeMix: 0.0,
          baseRingMat, fallbackGroup, rodinHolder, rodinMats: [],
          sealMat, headGroup, eyeMat,
          orbMesh, orbMat, haloGroup, haloOuter, haloInner, haloMat,
          statueLight, dustArr, dustMatL,
        };

        loadAscensionGlb("ascension_statue_rodin", (srcScene) => {
          if (disposed) return;
          const clone = srcScene.clone(true);
          const mats = [];
          const seen = new Map();
          clone.traverse((ch) => {
            if (!ch.isMesh) return;
            ch.castShadow = false;
            ch.receiveShadow = false;
            if (!ch.material) return;
            const cloneMatShell = (m) => {
              if (seen.has(m)) return seen.get(m);
              const cm = m.clone();
              const baseEm = cm.emissive ? cm.emissive.clone() : new THREE.Color(0x000000);
              const baseEI = typeof cm.emissiveIntensity === "number" ? cm.emissiveIntensity : 0.0;
              cm.userData = Object.assign({}, cm.userData, { baseEm, baseEI });
              // 仅销毁独立克隆出的材质外壳，保留公共贴图与几何体供下一幕过场复用
              trackOwn({ dispose: () => cm.dispose() });
              mats.push(cm);
              seen.set(m, cm);
              return cm;
            };
            ch.material = Array.isArray(ch.material)
              ? ch.material.map(cloneMatShell)
              : cloneMatShell(ch.material);
          });
          item.rodinMats = mats;
          rodinHolder.add(clone);
          fallbackGroup.visible = false;
        });

        return item;
      }

      const statues = [];
      STATUE_STEPS.forEach((stepK, idx) => {
        statues.push(createMysticStatue(-1, idx, stepK));
        statues.push(createMysticStatue(+1, idx, stepK));
      });

      // 6. 尽头云门圣光牌楼大门（第 16 级之后，接入 Rodin 高精大门并对齐实测洞口净空 3.44×5.10m）
      const gateZ = -(TOTAL_STEPS + 2) * STEP_DZ - 1.20;
      const gateY = TOTAL_STEPS * STEP_DY;
      const gateGroup = new THREE.Group();
      gateGroup.position.set(0, gateY, gateZ);

      const gateFallbackGroup = new THREE.Group();
      const pilGeo = trackOwn(new THREE.BoxGeometry(0.95, 6.2, 0.95));
      const gateL = new THREE.Mesh(pilGeo, matStone);
      gateL.position.set(-2.35, 3.1, 0);
      const gateR = new THREE.Mesh(pilGeo, matStone);
      gateR.position.set(2.35, 3.1, 0);
      const gateLintel = new THREE.Mesh(trackOwn(new THREE.BoxGeometry(6.1, 0.85, 1.15)), matBrassTrim);
      gateLintel.position.set(0, 6.55, 0);
      const gateCrown = new THREE.Mesh(trackOwn(new THREE.TorusGeometry(2.35, 0.36, 12, 32, Math.PI)), matStone);
      gateCrown.position.set(0, 6.95, 0);
      gateFallbackGroup.add(gateL, gateR, gateLintel, gateCrown);

      const portalDiscMat = trackOwn(new THREE.MeshBasicMaterial({
        map: puffTex,
        color: theme.holyHex,
        transparent: true,
        opacity: 0.72,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      }));
      const GATE_OPEN_W = 3.44;
      const GATE_OPEN_H = 5.10;
      const portalDisc = new THREE.Mesh(
        trackOwn(new THREE.PlaneGeometry(GATE_OPEN_W * 0.96, GATE_OPEN_H * 0.96)),
        portalDiscMat
      );
      portalDisc.position.set(0, GATE_OPEN_H * 0.50, -0.04);
      const portalLight = new THREE.PointLight(theme.holyHex, 7.5, 24.0, 1.3);
      portalLight.position.set(0, 3.6, 1.4);
      const gateFrontLight = new THREE.PointLight(theme.sunHex, 4.2, 22.0, 1.3);
      gateFrontLight.position.set(0, 4.6, 3.6);
      gateGroup.add(gateFallbackGroup, portalDisc, portalLight, gateFrontLight);
      ascScene.add(gateGroup);

      loadAscensionGlb("ascension_gate_rodin", (srcScene) => {
        if (disposed) return;
        const gateClone = srcScene.clone(true);
        gateClone.traverse((ch) => {
          if (ch.isMesh) {
            ch.castShadow = false;
            ch.receiveShadow = false;
          }
        });
        gateGroup.add(gateClone);
        gateFallbackGroup.visible = false;
      });

      // 7. 过场主角（接入 Rodin 骨骼绑定主角：登阶 Ascend / 停立 Idle）
      const ascHero = new THREE.Group();
      const ascHeroFallback = new THREE.Group();
      const ahBody = new THREE.Mesh(trackOwn(new THREE.CylinderGeometry(0.18, 0.24, 1.15, 16)), MAT.hero);
      ahBody.position.y = 0.575;
      const ahHead = new THREE.Mesh(trackOwn(new THREE.SphereGeometry(0.19, 16, 12)), MAT.ivory);
      ahHead.position.y = 1.32;
      ascHeroFallback.add(ahBody, ahHead);
      ascHero.add(ascHeroFallback);
      ascHero.position.set(0, 0, 0);
      ascScene.add(ascHero);

      let ascHeroActor = null;
      loadRiggedCharacter("char_hero_rigged", (srcScene, clips) => {
        if (disposed) return;
        ascHeroActor = createRiggedActor(srcScene, clips, { castShadow: false, receiveShadow: false, defaultAnim: "Idle" });
        ascHeroActor.root.rotation.y = Math.PI;
        ascHero.add(ascHeroActor.root);
        ascHeroFallback.visible = false;
        trackOwn({ dispose: () => { if (ascHeroActor) { ascHeroActor.dispose(); ascHeroActor = null; } } });
      });

      // 状态驱动：全程无顿挫匀速连续登阶并锁相步频，踏完十陆阶后无缝步入云门切下一幕
      const STEP_DUR = 0.54;
      let currentStep = 0;
      let ascProgress = 0.0;
      let gateWalkProgress = 0.0;
      let enteringGate = false;
      let finishStarted = false;

      const cleanupAndEnterTarget = () => {
        if (disposed) return;
        disposed = true;
        window.__ascensionActive = false;
        while (owned.length) {
          const d = owned.pop();
          try { if (d && d.dispose) d.dispose(); } catch (e) {}
        }
        if (customFinaleRenderer && customFinaleRenderer._tag === interludeToken) {
          customFinaleRenderer = null;
        }
        document.body.classList.remove("finale-3d-mode");
        const ov = document.getElementById("ascension-overlay");
        if (ov) ov.remove();
        document.querySelectorAll(".act-tabs .btn").forEach((b) => {
          b.classList.toggle("active", Number(b.dataset.act) === toAct);
        });
        if (toAct === 2) loadAct2();
        else if (toAct === 3) loadAct3();
      };

      const finishToNextAct = () => {
        if (finishStarted || disposed) return;
        finishStarted = true;
        if (curtainEl) curtainEl.classList.add("on");
        const tGo = setTimeout(cleanupAndEnterTarget, 760);
        act1Cleanups.push(() => clearTimeout(tGo));
      };

      const onStepReached = (targetK) => {
        if (targetK <= currentStep) return;
        currentStep = targetK;
        const dot = dotEls[targetK - 1];
        if (dot) dot.classList.add("lit");

        // 唤醒目标台阶及前方两级预览台阶破雾升起
        [targetK, targetK + 1, targetK + 2].forEach((rk) => {
          if (rk <= TOTAL_STEPS && stairObjs[rk]) {
            stairObjs[rk].revealed = true;
            stairObjs[rk].group.visible = true;
          }
        });
        stairObjs[targetK].stepped = true;
        stairObjs[targetK].ringTime = 0.0;

        // 走过第 3、6、9、12、15 级时触发对应左右雕像苏醒
        let wokeAny = false;
        statues.forEach((stItem) => {
          if (stItem.stepK === targetK && !stItem.triggered) {
            stItem.triggered = true;
            wokeAny = true;
          }
        });
        playSacredChime(targetK, wokeAny);
      };

      const enterGateAndFinish = () => {
        if (finishStarted || disposed) return;
        enteringGate = true;
        gateWalkProgress = 0.0;
        const tEnd = setTimeout(finishToNextAct, 680);
        act1Cleanups.push(() => clearTimeout(tEnd));
      };

      // 仅保留一键跳过直达下幕
      document.getElementById("asc-btn-skip").addEventListener("click", (e) => {
        e.stopPropagation();
        finishToNextAct();
      });
      act1Cleanups.push(() => {
        if (!disposed) {
          disposed = true;
          window.__ascensionActive = false;
          while (owned.length) {
            const d = owned.pop();
            try { if (d && d.dispose) d.dispose(); } catch (err) {}
          }
        }
      });

      // 平滑淡幕转场进入云雾升阶 3D 世界
      if (curtainEl) curtainEl.classList.add("on");
      const tBoot = setTimeout(() => {
        if (disposed) return;
        const startMs = performance.now();
        document.body.classList.add("finale-3d-mode");
        overlay.classList.add("show");

        customFinaleRenderer = {
          _tag: interludeToken,
          resize(w, h) {
            syncAscCam(w, h);
          },
          render(dt, now) {
            if (disposed) return;
            const sec = Math.max(0, (now - startMs) * 0.001);
            cloudUniformsA.uTime.value = sec;
            cloudUniformsB.uTime.value = sec;
            dustMat.uniforms.uTime.value = sec;

            // 飘浮雾团横向穿过阶梯
            mistSprites.forEach((sp) => {
              const ud = sp.userData;
              sp.position.x = ud.baseX + Math.sin(sec * ud.spd + ud.ph) * 2.2;
              sp.position.y = ud.baseY + Math.cos(sec * 0.45 + ud.ph) * 0.25;
            });

            // 丁达尔光束轻柔呼吸
            rayMat.opacity = 0.068 + Math.sin(sec * 1.4) * 0.022;
            portalDiscMat.opacity = 0.50 + Math.sin(sec * 2.2) * 0.14;
            portalLight.intensity = 7.2 + Math.sin(sec * 2.4) * 1.5;

            // 台阶弹簧升起与符文波纹扩展
            stairObjs.forEach((so) => {
              if (so.revealed) {
                so.curY += (so.yTarget - so.curY) * Math.min(1.0, dt * 6.5);
                so.scaleCur += (1.0 - so.scaleCur) * Math.min(1.0, dt * 6.5);
                so.group.position.y = so.curY;
                so.group.scale.setScalar(so.scaleCur);
              }
              const targetGlow = so.stepped ? 2.1 : (so.revealed ? 0.55 : 0.08);
              so.inlayMat.emissiveIntensity += (targetGlow - so.inlayMat.emissiveIntensity) * Math.min(1.0, dt * 6.0);
              if (so.ringTime >= 0.0 && so.ringTime < 1.2) {
                so.ringTime += dt;
                const p = so.ringTime / 1.2;
                so.pulseRing.scale.setScalar(0.55 + p * 2.2);
                so.ringMat.opacity = (1.0 - p) * 0.85;
              } else if (so.ringTime >= 1.2) {
                so.ringMat.opacity = 0.0;
              }
            });

            // 两侧雕像苏醒动画（Rodin 本尊微仰吐辉 + 圣球自托盘升空 + 双星环逆向显旋转 + 金尘升腾）
            const holyColTmp = new THREE.Color(theme.holyHex);
            statues.forEach((stItem) => {
              if (stItem.triggered) {
                stItem.wakeMix = Math.min(1.0, stItem.wakeMix + dt * 1.9);
              }
              const wm = stItem.wakeMix;
              stItem.statueLight.intensity = wm * 8.5;
              stItem.eyeMat.emissiveIntensity = wm * 3.6;
              stItem.sealMat.emissiveIntensity = 0.08 + wm * 2.1;
              stItem.haloMat.emissiveIntensity = 0.05 + wm * 1.6;
              stItem.haloMat.opacity = wm * 0.92;
              stItem.haloGroup.scale.setScalar(0.75 + wm * 0.25);
              stItem.orbMat.emissiveIntensity = 0.08 + wm * 2.8;
              stItem.baseRingMat.color.setHex(wm > 0.05 ? theme.holyHex : 0x3b485a);
              stItem.baseRingMat.opacity = 0.42 + wm * 0.52;
              stItem.headGroup.rotation.x = 0.14 - wm * 0.19;
              if (stItem.rodinMats.length && (wm > 0.0 || stItem.triggered)) {
                stItem.rodinMats.forEach((cm) => {
                  const u = cm.userData;
                  if (u && u.baseEm) {
                    cm.emissive.copy(u.baseEm).lerp(holyColTmp, wm * 0.55);
                    cm.emissiveIntensity = u.baseEI + wm * 0.42;
                  }
                });
              }
              stItem.rodinHolder.position.y = wm * 0.08 + (wm > 0.02 ? Math.sin(sec * 2.1 + stItem.pairIdx) * 0.025 : 0);
              stItem.rodinHolder.rotation.x = -wm * 0.045;
              stItem.orbMesh.position.y = 2.90 + wm * 0.58 + (wm > 0.02 ? Math.sin(sec * 2.6 + stItem.pairIdx) * 0.08 : 0);
              stItem.orbMesh.rotation.y += dt * (0.2 + wm * 2.4);
              if (wm > 0.01) {
                stItem.haloOuter.rotation.z += dt * (0.35 + wm * 0.75);
                stItem.haloInner.rotation.z -= dt * (0.55 + wm * 1.15);
              }
              stItem.dustMatL.opacity = wm * 0.75;
              if (wm > 0.02) {
                stItem.dustArr.forEach((dp) => {
                  dp.userData.ph = (dp.userData.ph + dt * 0.42) % 1.0;
                  const t = dp.userData.ph;
                  const a = dp.userData.ang + t * 4.0;
                  dp.position.set(Math.cos(a) * (0.85 + t * 0.35), 1.6 + t * 3.1, Math.sin(a) * (0.85 + t * 0.35));
                });
              }
            });

            // 主角沿斜阶匀速平滑攀升 + Mixamo 派生 Ascend 步频严格锁相（2 阶 = 1 步周期）
            const walkingAscend = sec >= 0.28 && !finishStarted;
            if (ascHeroActor) {
              if (walkingAscend) {
                const ascDur = ascHeroActor.getClipDuration("Ascend") || 1.20;
                const ramp = Math.min(1.0, (sec - 0.28) / 0.22);
                const ascScale = (ascDur / (2.0 * STEP_DUR)) * (0.4 + 0.6 * ramp);
                ascHeroActor.play("Ascend", 0.14, false, ascScale);
                ascHeroActor.setTimeScale("Ascend", ascScale);
              } else {
                ascHeroActor.play("Idle", 0.18, false, 1.0);
              }
              ascHeroActor.update(dt);
            }
            if (walkingAscend) {
              if (!enteringGate) {
                const ramp = Math.min(1.0, (sec - 0.28) / 0.22);
                ascProgress = Math.min(TOTAL_STEPS, ascProgress + (dt / STEP_DUR) * ramp);
                const targetK = Math.min(TOTAL_STEPS, Math.max(1, Math.floor(ascProgress + 0.02)));
                while (currentStep < targetK) onStepReached(currentStep + 1);
                ascHero.position.set(0, ascProgress * STEP_DY, -ascProgress * STEP_DZ);
                ascHero.rotation.x = 0;
                if (ascProgress >= TOTAL_STEPS) enterGateAndFinish();
              } else {
                gateWalkProgress = Math.min(1.0, gateWalkProgress + dt / 1.15);
                const startZ = -TOTAL_STEPS * STEP_DZ;
                ascHero.position.z = startZ + ((gateZ + 0.4) - startZ) * gateWalkProgress;
                ascHero.position.y = TOTAL_STEPS * STEP_DY;
                ascHero.rotation.x = 0;
              }
            }

            heroGlowLight.position.set(ascHero.position.x, ascHero.position.y + 1.2, ascHero.position.z + 0.4);

            // 3/4 斜向远景长焦空灵追随镜头（右后上方远拉看天梯自左下斜伸向右上圣门，留足天际圣光留白，竖屏适度外拉保留完整构图）
            const portraitDistMul = ascCam.aspect < 1.0 ? 1.14 : 1.0;
            const camTargetX = (11.4 + Math.sin(sec * 0.32) * 0.45) * portraitDistMul;
            const camTargetY = ascHero.position.y + 4.35;
            const camTargetZ = ascHero.position.z + 14.8 * portraitDistMul;
            ascCam.position.x += (camTargetX - ascCam.position.x) * Math.min(1.0, dt * 4.2);
            ascCam.position.y += (camTargetY - ascCam.position.y) * Math.min(1.0, dt * 4.2);
            ascCam.position.z += (camTargetZ - ascCam.position.z) * Math.min(1.0, dt * 4.2);
            ascCam.lookAt(-0.35, ascHero.position.y + 2.95, ascHero.position.z - 6.8);

            renderer.setRenderTarget(null);
            renderer.render(ascScene, ascCam);
          },
          dispose() {
            if (!disposed) {
              disposed = true;
              window.__ascensionActive = false;
              while (owned.length) {
                const d = owned.pop();
                try { if (d && d.dispose) d.dispose(); } catch (err) {}
              }
            }
          },
        };

        const tReveal = setTimeout(() => {
          if (!disposed && curtainEl) curtainEl.classList.remove("on");
        }, 120);
        act1Cleanups.push(() => clearTimeout(tReveal));
      }, 680);
      act1Cleanups.push(() => clearTimeout(tBoot));
    }
    window.__startAscensionInterlude = startAscensionInterlude;

    // =========================================================================
    // 第一幕 · 验潮庭（V20 豆青瓷釉统一 · 7 件 Rodin 可动分件拼接 · 三层水位 × 浮球 × 锅炉正反转闭环）
    // =========================================================================
    function loadAct1() {
      currentAct = 1;
      resetLevel();
      document.body.classList.add("act1-mode");
      document.getElementById("act-title").textContent = "第一幕 · 验潮庭";
      setupLights(null, 0.14, 0xfff4dc, 3.35, [-14, 15, 10], false, true);
      setBaseCameraTarget(-0.15, 2.55, 0.10);
      setViewIndex(0, true);

      const act1Token = Symbol();
      window.__act1Token = act1Token;

      const st = {
        drained: false,       // 1. 左右拖转退水立桩可动红阀轮 -> 放空下层南池露出池底【朱砂红导流阀轮】
        hasWheel: false,      // 2. 步入南池底拾获【朱砂红导流阀轮】
        wheelMounted: false,  // 2.5 将拾得阀轮装入宝瓶蓄水座，待左右拖转蓄水
        refilled: false,      // 3. 左右拖转装位后的蓄水红阀轮 -> 南池涨潮浮起 6 尊莲瓣圆瓷墩
        boilerMode: "idle",   // "idle"(初始朝东+90°) / "cw"(右拖顺转增压朝北+180°灌顶池) / "ccw"(左拖逆转泄压朝西北+225°)
        northFlooded: false,  // 4. 顺转锅炉灌满顶层北池 -> 独立大浮球升顶 & 最上层 3 尊北池莲瓣台阶破水浮起
        buoyLocked: false,    // 5. 踏北三阶听示范并按【短·短·长】节奏敲响顶层铜铃锁浮球
        waterCaught: false,   // 6. 逆转锅炉转柱朝西北 & 135° 视差对齐截断注水 -> 西北阶升起 & 双门外开通关
        cleared: false
      };

      // 第一幕专属清透晶莹水流材质与豆青瓷釉清漆包装（绝不改动共享 MAT，零影响第 2/3 幕）
      const act1WaterStreamMat = new THREE.MeshStandardMaterial({
        color: 0xdffcf8, emissive: 0x6ce2d6, emissiveIntensity: 0.72,
        roughness: 0.12, transparent: true, opacity: 0.88
      });
      act1WaterStreamMat.userData.outlineParameters = { visible: false };

      const PORCELAIN_GLAZED_SET = new Set([
        "act1_nw_pedestal_rodin", "act1_ne_pedestal_rodin", "act1_west_curve_wall_rodin",
        "act1_entry_bridge_rodin", "act1_exit_bridge_rodin",
        "act1_valve_wheel_rodin", "act1_drain_gate_rodin",
        "act1_refill_valve_rodin", "act1_float_buoy_cage_rodin", "act1_float_orb_rodin",
      ]);

      function mountAct1Model(parent, glbName, pos, targetScale, rotYDeg = 0, hideOnLoad = [], meta = null, onLoaded = null) {
        const tintCeladon = new THREE.Color(0.94, 1.02, 0.99);
        const isGlazedV20 = PORCELAIN_GLAZED_SET.has(glbName);
        return mountRodinModel(parent, glbName, pos, targetScale, rotYDeg, hideOnLoad, meta, (clone) => {
          const clonedMats = new Map();
          clone.traverse((child) => {
            if (!child.isMesh || !child.material) return;
            const applyTint = (mat) => {
              if (clonedMats.has(mat)) return clonedMats.get(mat);
              if (/M_A1_ExitLightWall|M_A1_LanternGlow|M_A1_CarpetRed|M_A1_PorcelainDeckTop/.test(mat.name || "")) {
                clonedMats.set(mat, mat);
                return mat;
              }
              let cm = mat.clone();
              if (isGlazedV20 && !cm.isMeshPhysicalMaterial && cm.isMeshStandardMaterial) {
                const phys = new THREE.MeshPhysicalMaterial();
                THREE.MeshStandardMaterial.prototype.copy.call(phys, cm);
                phys.defines = { STANDARD: "", PHYSICAL: "" };
                cm = phys;
              }
              if (cm.color) cm.color.multiply(tintCeladon);
              if (isGlazedV20 && cm.isMeshPhysicalMaterial) {
                cm.roughness = Math.min(cm.roughness ?? 0.45, 0.28);
                cm.clearcoat = 0.82;
                cm.clearcoatRoughness = 0.15;
                cm.envMapIntensity = 0.96;
              }
              if (glbName === "act1_float_orb_rodin") {
                if (cm.normalScale) cm.normalScale.multiplyScalar(0.65);
                cm.envMapIntensity = 1.22;
              }
              clonedMats.set(mat, cm);
              return cm;
            };
            child.material = Array.isArray(child.material) ? child.material.map(applyTint) : applyTint(child.material);
          });
          if (onLoaded) onLoaded(clone);
        });
      }

      function addAct1HitZone(x, yBot, z, w, h, d, meta) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), MAT.hitProxy);
        mesh.position.set(x, yBot + h / 2, z);

        levelRoot.add(mesh);
        clickables.push(mesh);
        return mesh;
      }

      let drainManualRot = 0.0, drainWheelAnimRot = 0.0;

        <div class="wheel-pad-track" id="wp-track">
          <div class="wheel-pad-fill" id="wp-fill"></div>
          <div class="wheel-pad-knob" id="wp-knob">☸</div>
        </div>
      `;
      document.body.appendChild(wheelPad);

      const bellPanel = document.createElement("div");
      bellPanel.id = "act1-bell-panel";
      bellPanel.innerHTML = `
        <div class="bp-title">🔔 顶层验潮铜铃 · 节奏共鸣</div>
        <div class="bp-status" id="bp-status">🔊 请聆听 4 声示范节奏...</div>
        <div class="bp-beats">
          <div class="bp-dot" id="bp-dot-0">🔔</div>
          <div class="bp-dot" id="bp-dot-1">🔔</div>
          <div class="bp-dot" id="bp-dot-2">🔔</div>
          <div class="bp-dot" id="bp-dot-3">🔔</div>
        </div>
        <div class="bp-actions">
          <button class="btn sm coral" id="btn-bell-tap" disabled>🔔 点击敲响铜铃</button>
          <button class="btn sm" id="btn-bell-replay">🔊 重听示范</button>
          <button class="btn sm" id="btn-bell-close">✕ 暂退</button>
        </div>
      `;
      document.body.appendChild(bellPanel);

      function makeSoftRayTexture(isSpot = false) {
        const cv = document.createElement("canvas");
        cv.width = 256; cv.height = 256;
        const ctx = cv.getContext("2d");
        if (isSpot) {
          const g = ctx.createRadialGradient(128, 128, 8, 128, 128, 120);
          g.addColorStop(0.0, "rgba(255, 236, 175, 0.95)");
          g.addColorStop(0.45, "rgba(218, 244, 210, 0.42)");
          g.addColorStop(1.0, "rgba(180, 235, 210, 0.0)");
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, 256, 256);
        } else {
          const g = ctx.createLinearGradient(0, 0, 0, 256);
          g.addColorStop(0.0, "rgba(255, 242, 195, 0.85)");
          g.addColorStop(0.55, "rgba(220, 245, 200, 0.28)");
          g.addColorStop(1.0, "rgba(185, 232, 200, 0.0)");
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, 256, 256);
          ctx.globalCompositeOperation = "destination-in";
          const gx = ctx.createLinearGradient(0, 0, 256, 0);
          gx.addColorStop(0.0, "rgba(0,0,0,0)");
          gx.addColorStop(0.22, "rgba(0,0,0,1)");
          gx.addColorStop(0.78, "rgba(0,0,0,1)");
          gx.addColorStop(1.0, "rgba(0,0,0,0)");
          ctx.fillStyle = gx;
          ctx.fillRect(0, 0, 256, 256);
        }
        const tex = new THREE.CanvasTexture(cv);
        tex.needsUpdate = true;
        return tex;
      }

      // 1. V23 豆青瓷底座 + 两座去白砖平顶 Rodin 基座 + 西侧弧墙 + 入口/出口 Rodin 双桥墩 + 扩建水亭与出口双门
      mountAct1Model(levelRoot, "act1_courtyard_base", [0, 0, 0], 1.0, 0);
      mountAct1Model(levelRoot, "act1_nw_pedestal_rodin", [-4.40, 0.04, -3.05], 1.0, 0);
      mountAct1Model(levelRoot, "act1_ne_pedestal_rodin", [4.475, 0.04, -3.325], 1.0, 0);
      mountAct1Model(levelRoot, "act1_west_curve_wall_rodin", [-6.05, 0.22, 1.625], 1.0, 0);
      mountAct1Model(levelRoot, "act1_entry_bridge_rodin", [-4.40, -0.30, 5.42], 1.0, 0);
      mountAct1Model(levelRoot, "act1_exit_bridge_rodin", [-4.40, -0.30, -5.73], 1.0, 0);
      mountAct1Model(levelRoot, "act1_col_plinth", [-0.20, 0.22, -0.25], 1.0, 0);

      mountAct1Model(levelRoot, "act1_pavilion_porch_open", [-4.40, 2.65, -3.05], [2.98, 2.98, 3.88], 0, [], { type: "act1_goal", label: "玉釉穹顶水亭" });
      mountAct1Model(levelRoot, "act1_dome", [-4.40, 5.34, -3.05], 2.40, 0, [], { type: "act1_goal", label: "玉釉穹顶水亭" });

      let exitDoorL = null, exitDoorR = null;
      mountAct1Model(levelRoot, "act1_exit_doors", [-4.40, 3.04, -4.36], [1.216, 1.216, 1.216], 0, [], { type: "act1_goal", label: "水亭雕花双门 · 通往后方出口平台" }, (clone) => {
        exitDoorL = clone.getObjectByName("ANIM_Act1_ExitDoorL");
        exitDoorR = clone.getObjectByName("ANIM_Act1_ExitDoorR");
      });

      const exitInnerLight = new THREE.PointLight(0xffe092, 0.45, 8.2, 1.4);
      exitInnerLight.position.set(-4.40, 3.85, -4.36);
      levelRoot.add(exitInnerLight);

      const exitSpillLight = new THREE.PointLight(0xffdf88, 0.0, 7.0, 1.5);
      exitSpillLight.position.set(-4.40, 3.28, -2.65);
      levelRoot.add(exitSpillLight);

      const exitBackLight = new THREE.PointLight(0xffdf88, 0.0, 7.6, 1.4);
      exitBackLight.position.set(-4.40, 3.35, -5.25);
      levelRoot.add(exitBackLight);

      const rayTex = makeSoftRayTexture(false);
      const spotTex = makeSoftRayTexture(true);
      const exitRayMats = [];
      [-0.14, 0.14].forEach((rxOff, idx) => {
        const rm = new THREE.MeshBasicMaterial({
          map: rayTex, color: 0xffe8a8, transparent: true, opacity: 0.03,
          blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
        });
        rm.userData.outlineParameters = { visible: false };
        const rayMeshF = new THREE.Mesh(new THREE.PlaneGeometry(0.86, 1.95), rm);
        rayMeshF.position.set(-4.40 + rxOff, 3.55, -3.15);
        rayMeshF.rotation.x = Math.PI * 0.34;
        rayMeshF.rotation.y = (idx === 0 ? -0.18 : 0.18);
        levelRoot.add(rayMeshF);
        const rayMeshB = new THREE.Mesh(new THREE.PlaneGeometry(0.92, 2.10), rm);
        rayMeshB.position.set(-4.40 + rxOff, 3.55, -4.92);
        rayMeshB.rotation.x = -Math.PI * 0.34;
        rayMeshB.rotation.y = (idx === 0 ? 0.18 : -0.18);
        levelRoot.add(rayMeshB);
        exitRayMats.push(rm);
      });
      const floorSpotMat = new THREE.MeshBasicMaterial({
        map: spotTex, color: 0xffe8a8, transparent: true, opacity: 0.04,
        blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
      });
      floorSpotMat.userData.outlineParameters = { visible: false };
      const floorSpotF = new THREE.Mesh(new THREE.PlaneGeometry(1.75, 1.85), floorSpotMat);
      floorSpotF.rotation.x = -Math.PI / 2;

        const cv = document.createElement("canvas");
        cv.width = 128; cv.height = 128;

        const bg = ctx.createLinearGradient(0, 0, 0, 128);
        bg.addColorStop(0.0, "rgba(176, 248, 255, 0.88)");
        bg.addColorStop(0.5, "rgba(62, 188, 232, 0.52)");

        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, 128, 128);
        for (let i = 0; i < 16; i++) {

          const y = ((i * 53) % 104) + 12;

        }
        const tex = new THREE.CanvasTexture(cv);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.needsUpdate = true;
        return tex;
      }

      /** 按稳健速率渐进推进水位，接近目标最后 0.10m 柔和减速，消除瞬间消失感。 */
      function stepWaterLevel(cur, tgt, maxSpeed, dt) {
        const diff = tgt - cur;
        const dist = Math.abs(diff);
        if (dist < 1e-4) return tgt;
        const speed = dist > 0.10 ? maxSpeed : Math.max(0.025, maxSpeed * (dist / 0.10));
        const maxStep = speed * dt;
        return dist <= maxStep ? tgt : cur + Math.sign(diff) * maxStep;
      }

        } else if (st.drained) {

          m: Math.max(0.24, Math.min(0.94, tgtM + dragMidBias)),
          n: tgtN,
        };

      function syncAct1() {
        const curStage1 = st.waterCaught ? 4 : (st.buoyLocked ? 3 : (st.northFlooded ? 2 : (st.drained ? 1 : 0)));
        if (curStage1 !== lastSeranStage1) {
          lastSeranStage1 = curStage1;

      animHooks.push((dt, now) => {
        const safeDt = Math.min(dt, 0.05);
        // 拖动松手未触发时自动回零预览偏置
        if (!wheelDrag.active && !wheelPadActive) {
          dragSouthBias *= Math.exp(-safeDt * 8.0);
          dragMidBias *= Math.exp(-safeDt * 8.0);
          if (Math.abs(dragSouthBias) < 1e-4) dragSouthBias = 0.0;
          if (Math.abs(dragMidBias) < 1e-4) dragMidBias = 0.0;
        }

        // 1. 三层相互关联渐进水位推进（此消彼长、帧率无关 3.2~3.6s 连续变化过程）
        const tgts = getTideTargets();
        southWaterY = stepWaterLevel(southWaterY, tgts.s, 0.155, safeDt);
        midWaterY = stepWaterLevel(midWaterY, tgts.m, 0.095, safeDt);
        northWaterY = stepWaterLevel(northWaterY, tgts.n, 0.21, safeDt);

        const clamp01 = (v) => Math.max(0.0, Math.min(1.0, v));
        const southMoving = Math.abs(tgts.s - southWaterY) > 0.015;
        const midMoving = Math.abs(tgts.m - midWaterY) > 0.015;
        const northMoving = Math.abs(tgts.n - northWaterY) > 0.015;

        // 2. 水体透明度与深浅着色严格绑定真实水深（退水前期保持饱满水色一寸寸落退）
        const southFrac = clamp01((southWaterY - 0.242) / (0.82 - 0.242));
        southDepthScale = 0.20 + Math.pow(southFrac, 0.55) * 0.95;
        const curSouthA = 0.20 + Math.pow(southFrac, 0.42) * 0.50;
        const padsEmergence = st.refilled ? clamp01((southWaterY - 0.44) / 0.26) : 0.0;
        southPadsUp += (padsEmergence - southPadsUp) * 0.10;
        southWaterMirror.y = southWaterY;
        southWaterMirror.mesh.position.y = southWaterY;
        southWaterMirror.clip.constant = -southWaterY + 0.004;
        southWaterMirror.mesh.material.uniforms.alpha.value = curSouthA;
        southWaterMirror.mesh.material.uniforms.uDepthScale.value = southDepthScale;
        southWaterMirror.mesh.material.uniforms.uPadsUp.value = southPadsUp;
        southWaterMirror.mesh.material.uniforms.ripple.value = southMoving ? 0.0022 : 0.0012;

        const midFrac = clamp01((midWaterY - 0.24) / (0.94 - 0.24));
        midDepthScale = 0.55 + midFrac * 0.75;
        const curMidA = 0.48 + midFrac * 0.24;
        midWaterMirrors.forEach((m, idx) => {
          m.y = midWaterY;
          m.mesh.position.y = midWaterY;
          m.clip.constant = -midWaterY + 0.004;
          m.mesh.material.uniforms.alpha.value = curMidA;
          m.mesh.material.uniforms.uDepthScale.value = midDepthScale;
          m.mesh.material.uniforms.ripple.value = midMoving ? 0.0022 : (idx === 0 ? 0.0013 : 0.0011);
        });

        const northFrac = clamp01((northWaterY - 0.24) / (1.26 - 0.24));
        northDepthScale = 0.50 + northFrac * 0.85;
        const curNorthA = 0.48 + northFrac * 0.24;
        northWaterMirror.y = northWaterY;
        northWaterMirror.mesh.position.y = northWaterY;
        northWaterMirror.clip.constant = -northWaterY + 0.004;
        northWaterMirror.mesh.material.uniforms.alpha.value = curNorthA;
        northWaterMirror.mesh.material.uniforms.uDepthScale.value = northDepthScale;
        northWaterMirror.mesh.material.uniforms.ripple.value = northMoving ? 0.0020 : 0.0011;

        // 3. 开放水道跨层流动水幕同步拉伸与水纹滚动 + 水位调整期自动泛波
        const heightDiff = midWaterY - southWaterY;
        const absDiff = Math.abs(heightDiff);
        midSouthCurtain.visible = absDiff > 0.025;
        if (midSouthCurtain.visible) {
          midSouthCurtain.scale.y = absDiff;
          midSouthCurtain.position.y = (midWaterY + southWaterY) * 0.5;
          curtainMat.opacity = Math.min(0.76, 0.28 + absDiff * 1.6);
          const flowSign = (southMoving && tgts.s < southWaterY) ? -1.0 : 1.0;
          curtainTex.offset.y = (curtainTex.offset.y + safeDt * 1.15 * flowSign) % 1.0;
        }

        if (southMoving || midMoving || northMoving) {
          tideRippleTimer += safeDt;
          if (tideRippleTimer >= 0.36) {
            tideRippleTimer = 0.0;
            if (southMoving) {
              const sRx = tgts.s < southWaterY ? -2.95 : -3.10;
              const sRz = tgts.s < southWaterY ? 2.15 : 2.38;
              spawnStepRipple({ x: sRx + (Math.random() - 0.5) * 0.5, y: southWaterY + 0.012, z: sRz + (Math.random() - 0.5) * 0.4 }, 0xc8f8ff);
            }
            if (midMoving) {
              spawnStepRipple({ x: -1.45 + (Math.random() - 0.5) * 0.8, y: midWaterY + 0.012, z: 0.30 + (Math.random() - 0.5) * 0.7 }, 0xd8fbff);
            }
            if (northMoving) {
              spawnStepRipple({ x: -0.20 + (Math.random() - 0.5) * 0.5, y: northWaterY + 0.012, z: -3.10 + (Math.random() - 0.5) * 0.4 }, 0xe2fcff);
            }
          }
        } else {
          tideRippleTimer = 0.36;
        }

        // 退水桩与宝瓶阀座上独立挂载的 Rodin 红手轮同轴转动（叠加手动拖动回弹与旋转角）
        if (!wheelDrag.active && !wheelPadActive) {
          drainManualRot *= Math.exp(-safeDt * 10.0);
          refillManualRot *= Math.exp(-safeDt * 10.0);
        }
        const drainRotTarget = st.drained ? -Math.PI * 1.5 : 0.0;
        drainWheelAnimRot += (drainRotTarget - drainWheelAnimRot) * 0.14;
        drainWheelPivot.rotation.z = drainWheelAnimRot + drainManualRot;

        // 南 6 尊莲瓣圆瓷墩严格跟随南池真实水位渐进破水浮升
        if (st.refilled) {
          refillTime += safeDt;
          if (installedWheelPivot.visible) {
            refillSpinRot += safeDt * 3.0;
            installedWheelPivot.rotation.z = refillSpinRot + refillManualRot;
          }
          const padBaseF = clamp01((southWaterY - 0.34) / 0.36);
          frontPads.forEach((p, idx) => {
            const pf = clamp01(padBaseF * 1.18 - idx * 0.036);
            const tgtPadY = -0.10 + pf * 0.32;
            p.userData.baseY += (tgtPadY - p.userData.baseY) * 0.16;
          });
        } else if (installedWheelPivot.visible) {
          installedWheelPivot.rotation.z = refillManualRot;
        }

        // 顶层北池：最上层 3 尊莲瓣台阶跟随北池水位浮升 + 独立青花瓷大浮球在标笼腔内随水位升降 + 铜铃敲击共振回弹与点光闪烁
        if (st.northFlooded) {
          northFloodTime += safeDt;
          const effNorthY = st.buoyLocked ? Math.max(northWaterY, 1.16) : northWaterY;
          const nBaseF = clamp01((effNorthY - 0.58) / 0.56);
          northPads.forEach((np, ni) => {
            const nf = clamp01(nBaseF * 1.15 - ni * 0.05);
            const tgtNY = 0.18 + nf * (np.userData.targetY - 0.18);
            np.userData.baseY += (tgtNY - np.userData.baseY) * 0.15;
          });
        }
        const orbFrac = Math.max(0.0, Math.min(1.0, (northWaterY - 0.50) / 0.74));
        const orbTargetY = st.buoyLocked ? FLOAT_ORB_HIGH_Y : (FLOAT_ORB_LOW_Y + orbFrac * (FLOAT_ORB_HIGH_Y - FLOAT_ORB_LOW_Y));
        floatOrbCurrentY += (orbTargetY - floatOrbCurrentY) * 0.10;
        buoyPulse *= Math.exp(-dt * 7.0);
        buoyFlashLight.intensity *= Math.exp(-dt * 4.8);
        floatOrbGroup.position.y = floatOrbCurrentY + buoyPulse * 0.08;
        floatOrbGroup.scale.setScalar(1.0 + buoyPulse * 0.22);
        floatOrbGroup.rotation.y += dt * (st.buoyLocked ? 0.35 : 0.65) + buoyPulse * dt * 6.0;
        buoyReadyRing.visible = st.northFlooded && !st.buoyLocked;
        if (buoyReadyRing.visible) {
          buoyReadyRing.scale.setScalar(0.90 + Math.sin(now * 0.008) * 0.15 + buoyPulse * 0.25);
        }

        // 全场景浮台、南 6 尊莲瓣墩、北顶层 3 尊最上层莲瓣台阶、3 座海浪石阶实时物理踩压下沉+弹性回弹水波
        let heroStepDy = 0.0;
        const hx = heroGroup.position.x;
        const hz = heroGroup.position.z;
        pressables.forEach((p, idx) => {
          const dHoriz = Math.hypot(hx - p.cx, hz - p.cz);
          const nearV = Math.abs(heroGroup.position.y - (p.getBaseY() + 0.55)) < 1.15;
          const pressed = dHoriz < p.radius && nearV;
          if (pressed && !p.wasPressed && p.enableRipple) {
            const rWaterY = p.cz < -2.1 ? northWaterY : (p.cz > 1.7 ? southWaterY : midWaterY);
            spawnStepRipple({ x: p.cx, y: rWaterY + 0.012, z: p.cz }, 0xe6fffd);
            if (prevHeroStepId !== idx) prevHeroStepId = idx;
          }
          p.wasPressed = pressed;
          const targetDy = pressed ? -p.maxDip : 0.0;
          const force = (targetDy - p.dy) * 88.0 - p.vy * 10.5;
          p.vy += force * dt;
          p.dy += p.vy * dt;
          p.group.position.y = p.getBaseY() + p.dy;
          if (pressed && p.dy < heroStepDy) heroStepDy = p.dy;
        });
        heroVisualRoot.position.y = heroStepDy;

        // 锅炉大红飞轮：cw 模式顺转 (-) 增压 / ccw 模式逆转 (+) 泄压，并脉冲驱动蒸汽排浪（叠加手动拖动偏移）
        boilerWheelBoost *= Math.exp(-dt * 1.45);
        if (!wheelDrag.active && !wheelPadActive) boilerManualRot *= Math.exp(-dt * 10.0);
        const dirSign = st.boilerMode === "ccw" ? +1.0 : -1.0;
        const wheelBaseSpeed = st.boilerMode === "idle" ? 0.55 : (st.waterCaught ? 2.8 : 2.35);
        const wheelSpeed = wheelBaseSpeed + boilerWheelBoost;
        if (boilerWheel) {
          boilerWheelBaseRot += dirSign * dt * wheelSpeed;
          boilerWheel.rotation.z = boilerWheelBaseRot + boilerManualRot;
        }

        steamPuffs.forEach((sp) => {
          sp.userData.phase = (sp.userData.phase + dt * (0.42 + Math.min(wheelSpeed, 6.0) * 0.08)) % 1.0;
          const t = sp.userData.phase;
          sp.position.set(4.55 + Math.sin(t * 4.5) * 0.10, 4.47 + t * 1.15, -3.55 + Math.cos(t * 3.2) * 0.08);
          sp.scale.setScalar(0.55 + t * 1.30);
          sp.material.opacity = Math.sin(t * Math.PI) * 0.44;
        });
        mistPuffs.forEach((mp) => {
          mp.userData.phase = (mp.userData.phase + dt * 0.38) % 1.0;
          const t = mp.userData.phase;
          mp.position.set(-4.40 + Math.sin(t * 5.0) * 0.12, 3.05 + t * 0.52, -2.65 + Math.cos(t * 4.0) * 0.10);
          mp.scale.setScalar(0.60 + t * 0.90);
          mp.material.opacity = Math.sin(t * Math.PI) * 0.34;
        });

        // 中央旋转水柱平滑切角：idle(+90°) / cw顺转(+180°正北高抛灌北池) / ccw逆转(+225°西北视差对位莲钵)
        const targetColRotY = st.boilerMode === "ccw" ? (5 * Math.PI / 4) : (st.boilerMode === "cw" ? Math.PI : Math.PI * 0.5);
        waterColumnGroup.rotation.y += (targetColRotY - waterColumnGroup.rotation.y) * 0.095;
        const isNorthPour = st.boilerMode === "cw" && Math.abs(waterColumnGroup.rotation.y - Math.PI) < 0.24;
        northArcMesh.visible = isNorthPour;
        northSplashRipples.forEach((sr) => {
          sr.visible = isNorthPour;
          if (isNorthPour) {
            sr.userData.phase = (sr.userData.phase + dt * 0.65) % 1.0;
            const t = sr.userData.phase;
            sr.scale.setScalar(0.75 + t * 1.45);
            sr.position.y = northWaterY + 0.012;
            sr.material.opacity = (1.0 - t) * 0.80;
          }
        });

        const jScale = st.boilerMode === "ccw" ? 1.15 : 1.0;
        const yawDiff135 = Math.abs(Math.atan2(Math.sin(camYawCurrent - SNAP_ANGLES[1]), Math.cos(camYawCurrent - SNAP_ANGLES[1])));
        const colAligned225 = Math.abs(waterColumnGroup.rotation.y - 5 * Math.PI / 4) < 0.18;
        const isParallaxPouring = st.boilerMode === "ccw" && colAligned225 && yawDiff135 < 0.22;
        parallaxCutT += ((isParallaxPouring ? 1.0 : 0.0) - parallaxCutT) * Math.min(1.0, dt * 11.0);

        const bowlTargetFill = st.waterCaught ? 1.0 : (isParallaxPouring ? 0.78 : 0.0);
        bowlFillLevel += (bowlTargetFill - bowlFillLevel) * Math.min(1.0, dt * 3.8);
        const bowlSurfLocalY = 0.995 + bowlFillLevel * 0.180;
        const bowlSurfWorldY = 0.22 + bowlSurfLocalY;
        const jetCutBotLocalY = (bowlSurfWorldY + 1.2638) - 0.22;
        const jetBotLocalY = (midWaterY - 0.22) * (1.0 - parallaxCutT) + jetCutBotLocalY * parallaxCutT;
        const curJetH = Math.max(0.08, NOZ_LY_TOP - jetBotLocalY);

        steadyJet.visible = !isNorthPour;
        steadyJet.scale.set(jScale, curJetH / BASE_JET_H, jScale);
        steadyJet.position.y = jetBotLocalY + curJetH * 0.5;

        const cyCol = Math.cos(waterColumnGroup.rotation.y);
        const syCol = Math.sin(waterColumnGroup.rotation.y);
        const jetWorldX = waterColumnGroup.position.x + NOZ_LX * cyCol + NOZ_LZ * syCol;
        const jetWorldZ = waterColumnGroup.position.z - NOZ_LX * syCol + NOZ_LZ * cyCol;
        const poolRippleStrength = isNorthPour ? 0.0 : Math.max(0.0, 1.0 - parallaxCutT * 1.45);
        midWaterMirrors.forEach((wm) => {
          if (wm.mesh.material.uniforms.uJetPos) {
            wm.mesh.material.uniforms.uJetPos.value.set(jetWorldX, jetWorldZ);
            wm.mesh.material.uniforms.uJetRipple.value = poolRippleStrength;
          }
        });
        if (northWaterMirror.mesh.material.uniforms.uJetPos) {
          northWaterMirror.mesh.material.uniforms.uJetPos.value.set(-0.21, -2.97);
          northWaterMirror.mesh.material.uniforms.uJetRipple.value = isNorthPour ? 1.0 : 0.18;
        }

        steadyRipples.forEach((sr) => {
          sr.visible = !isNorthPour && parallaxCutT < 0.45;
          sr.userData.phase = (sr.userData.phase + dt * 0.62) % 1.0;
          const t = sr.userData.phase;
          const sc = (st.boilerMode === "ccw" ? 1.15 : 0.78) + t * 1.95;
          sr.scale.set(sc, sc, 1);
          sr.position.y = (midWaterY - 0.22) + 0.010;
          sr.material.opacity = (1.0 - t) * 0.76 * Math.max(0.0, 1.0 - parallaxCutT * 2.2);
        });

        jetDrops.forEach((jd) => {
          jd.visible = (st.boilerMode === "ccw");
          if (jd.visible) {
            jd.userData.phase = (jd.userData.phase + dt * 1.8) % 1.0;
            const tt = jd.userData.phase;
            jd.position.set(NOZ_LX + Math.sin(tt * 9) * 0.04, NOZ_LY_TOP - tt * curJetH, NOZ_LZ + Math.cos(tt * 7) * 0.04);
            jd.scale.setScalar(0.65 + tt * 0.55);
          }
        });

        const aimReady = (st.boilerMode === "ccw") && !st.waterCaught && viewIdx === 1;
        parallaxAimRing.visible = aimReady;
        if (aimReady) parallaxAimRing.scale.setScalar(0.88 + Math.sin(now * 0.008) * 0.18);

        const curWaterR = Math.min(0.351, 0.80 * Math.sqrt(Math.max(0.001, bowlSurfLocalY - 0.983)));
        catcherWater.visible = bowlFillLevel > 0.03;
        if (catcherWater.visible) {
          catcherWater.scale.set(curWaterR, curWaterR, 1);
          catcherWater.position.y = bowlSurfLocalY;
        }
        const pourActive = isParallaxPouring || st.waterCaught;
        catcherRings.forEach((cr) => {
          cr.visible = catcherWater.visible && pourActive;
          if (cr.visible) {
            cr.userData.phase = (cr.userData.phase + dt * 0.72) % 1.0;
            const tt = cr.userData.phase;
            const ringR = curWaterR * (0.18 + tt * 0.68);
            cr.scale.set(ringR, ringR, 1);
            cr.position.y = bowlSurfLocalY + 0.008;
            cr.material.opacity = (1.0 - tt) * (isParallaxPouring ? 0.62 : 0.34);
          }
        });
        catcherSplashes.forEach((sp) => {
          sp.visible = isParallaxPouring;
          if (sp.visible) {
            sp.userData.phase = (sp.userData.phase + dt * 1.45) % 1.0;
            const tt = sp.userData.phase;
            const rSp = 0.02 + tt * Math.min(0.13, curWaterR * 0.40);
            const hSp = 4.0 * tt * (1.0 - tt) * 0.060;
            sp.position.set(Math.cos(sp.userData.ang) * rSp, bowlSurfLocalY + hSp, Math.sin(sp.userData.ang) * rSp);
            sp.scale.setScalar(0.55 + Math.sin(tt * Math.PI) * 0.45);
            sp.material.opacity = Math.sin(tt * Math.PI) * 0.78;
          }
        });

        // 导灌成功后：西北压水石阶升起 + 水亭雕花双门向亭后外推敞开 (±108°)
        if (st.waterCaught) {
          nwStairsGroup.visible = true;
          nwStairCurrentBaseY += (1.87 - nwStairCurrentBaseY) * 0.11;
          doorOpenT += (1.0 - doorOpenT) * 0.075;
        } else {
          nwStairCurrentBaseY += (1.10 - nwStairCurrentBaseY) * 0.10;
          doorOpenT += (0.0 - doorOpenT) * 0.10;
        }
        const openRad = doorOpenT * (108.0 * Math.PI / 180.0);
        if (exitDoorL) exitDoorL.rotation.y = +openRad;
        if (exitDoorR) exitDoorR.rotation.y = -openRad;
        exitInnerLight.intensity = 0.45 + doorOpenT * 4.5;
        exitSpillLight.intensity = doorOpenT * 3.4;
        exitBackLight.intensity = doorOpenT * 4.0;
        exitRayMats.forEach((rm) => { rm.opacity = 0.03 + doorOpenT * 0.46; });
        floorSpotMat.opacity = 0.04 + doorOpenT * 0.54;
      });

      function operateBoiler(dir) {
        walkToAndRun("boiler_deck", () => {
          playWaterRush();
          if (dir === "cw") {
            st.boilerMode = "cw";
            st.northFlooded = true;
            boilerWheelBoost = 8.0;
            playHornTone(329.63, 0.36);
            focusCutscene({ x: -0.15, y: 1.85, z: -1.75 }, 1.22, 3600);
            showToast("锅炉顺转增压，北池水位上涨。", 3600);
            syncAct1();
            return;
          }
          if (dir === "ccw") {
            if (!st.buoyLocked) {
              playHornTone(185.0, 0.25);
              showToast("顶层标笼的锁扣似乎尚未合拢。", 3200);
              return;
            }
            st.boilerMode = "ccw";
            boilerWheelBoost = 8.5;
            triggerHeroInteract();
            playHornTone(293.66, 0.36);
            focusCutscene({ x: -0.75, y: 1.75, z: -0.85 }, 1.22, 3400);
            showToast("锅炉转向泄压，水流转向西北方。", 3600);
            syncAct1();
          }
        }, "眼下还过不去。");
      }

      // === 第一幕：左右拖动旋轮 + 底部操作浮条 + 顶层铜铃节奏系统 ===
      function triggerDrainComplete() {
        walkToAndRun("drain_pos", () => {
          dragSouthBias = 0.0;
          dragMidBias = 0.0;
          if (!st.drained) {
            st.drained = true;
            triggerHeroInteract();
            closeWheelPad();
            playWaterRush();
            focusCutscene({ x: -0.40, y: 1.05, z: 1.35 }, 1.22, 3600);
            showToast("南池退潮，中池水位上涨。", 3600);
            syncAct1();
          } else {
            showToast("退水立桩已处于放空位。", 2200);
          }
        });
      }

      function triggerRefillComplete() {
        walkToAndRun("refill_pos", () => {
          dragSouthBias = 0.0;
          dragMidBias = 0.0;
          if (!st.hasWheel) {
            showToast("阀座似乎缺了一枚阀轮。");
            return;
          }
          st.wheelMounted = true;
          if (!st.refilled) {
            st.refilled = true;
            triggerHeroInteract();
            closeWheelPad();
            playWaterRush();
            focusCutscene({ x: 0.20, y: 1.05, z: 1.60 }, 1.20, 3400);
            showToast("阀轮旋紧回灌，南池水位回升。", 3600);
            syncAct1();
          }
        });
      }

      // 底部精致旋转阀轮拖动浮条（点击 3D 旋轮弹出，可直接拖动滑块，也可在 3D 上直接拖动）
      const wheelPadEl = document.getElementById("act1-wheel-pad");
      const wheelPadTitle = document.getElementById("wp-title");
      const wheelPadSub = document.getElementById("wp-sub");
      const wheelPadTrack = document.getElementById("wp-track");
      const wheelPadFill = document.getElementById("wp-fill");
      const wheelPadKnob = document.getElementById("wp-knob");
      let wheelPadMode = null; // "drain" | "refill" | "boiler"
      let wheelPadActive = false;
      let wheelPadStartX = 0;
      let wheelPadLastTick = 0;
      const WHEEL_PAD_LIMIT = 104;
      const WHEEL_PAD_TRIG = 78;

      function resetWheelPadKnob() {
        if (wheelPadKnob) wheelPadKnob.style.transform = "translateX(0px)";
        if (wheelPadFill) { wheelPadFill.style.left = "50%"; wheelPadFill.style.width = "0px"; }
      }

      function closeWheelPad() {
        wheelPadMode = null;
        wheelPadActive = false;
        resetWheelPadKnob();
        if (wheelPadEl) wheelPadEl.classList.remove("show");
      }

      function syncBottomFloatOffset() {
        syncBottomFloatPanels();
      }
      window.addEventListener("resize", syncBottomFloatOffset);
      act1Cleanups.push(() => window.removeEventListener("resize", syncBottomFloatOffset));

      function openWheelPad(mode) {
        closeNpcDialog();
        closeBellPanel(false);
        wheelPadMode = mode;
        resetWheelPadKnob();
        if (mode === "drain") {
          wheelPadTitle.textContent = "🔄 退水立桩红阀轮";
          wheelPadSub.textContent = "按住红手轮向左或向右拖动拧开退水闸";
        } else if (mode === "refill") {
          wheelPadTitle.textContent = "🔄 宝瓶蓄水红阀轮";
          wheelPadSub.textContent = "按住红手轮向左或向右拖动拧紧蓄水涨潮";
        } else {
          wheelPadTitle.textContent = "☸ 蒸汽锅炉大红飞轮";
          wheelPadSub.textContent = "← 向左拖：逆转西北 | 向右拖：顺转灌顶池 →";
        }
        syncBottomFloatOffset();
        wheelPadEl.classList.add("show");
      }

      document.getElementById("wp-close").addEventListener("click", () => closeWheelPad());
      const onWheelPadDown = (e) => {
        if (currentAct !== 1 || !wheelPadMode) return;
        e.preventDefault();
        e.stopPropagation();
        wheelPadActive = true;
        wheelPadStartX = e.clientX;
        wheelPadLastTick = 0;
      };
      function applyDragWaterPreview(mode, absFrac) {
        const f = Math.max(0.0, Math.min(1.0, absFrac));
        if (mode === "drain" && !st.drained) {
          dragSouthBias = -0.045 * f;
          dragMidBias = +0.030 * f;
        } else if (mode === "refill" && st.hasWheel && !st.refilled) {
          dragSouthBias = +0.045 * f;
          dragMidBias = -0.030 * f;
        }
      }

      const onWheelPadMove = (e) => {
        if (!wheelPadActive || !wheelPadMode) return;
        const dx = Math.max(-WHEEL_PAD_LIMIT, Math.min(WHEEL_PAD_LIMIT, e.clientX - wheelPadStartX));
        wheelPadKnob.style.transform = `translateX(${dx}px)`;
        if (dx >= 0) {
          wheelPadFill.style.left = "50%";
          wheelPadFill.style.width = `${dx}px`;
          wheelPadFill.style.background = "linear-gradient(90deg, rgba(235,130,85,0.28), rgba(217,84,67,0.72))";
        } else {
          wheelPadFill.style.left = `calc(50% + ${dx}px)`;
          wheelPadFill.style.width = `${-dx}px`;
          wheelPadFill.style.background = "linear-gradient(90deg, rgba(35,148,128,0.72), rgba(74,188,162,0.28))";
        }
        const ratio = dx / WHEEL_PAD_TRIG;
        applyDragWaterPreview(wheelPadMode, Math.abs(ratio));
        if (wheelPadMode === "drain") drainManualRot = -ratio * Math.PI * 1.45;
        else if (wheelPadMode === "refill") refillManualRot = ratio * Math.PI * 1.45;
        else if (wheelPadMode === "boiler") boilerManualRot = -ratio * Math.PI * 1.2;

        if (Math.abs(dx - wheelPadLastTick) >= 18) {
          wheelPadLastTick = dx;
          playRatchetTick(dx >= 0 ? 1.12 : 0.88);
        }
        if (Math.abs(dx) >= WHEEL_PAD_TRIG) {
          const curMode = wheelPadMode;
          wheelPadActive = false;
          resetWheelPadKnob();
          if (curMode === "drain") triggerDrainComplete();
          else if (curMode === "refill") triggerRefillComplete();
          else if (curMode === "boiler") {
            closeWheelPad();
            operateBoiler(dx > 0 ? "cw" : "ccw");
          }
        }
      };
      const onWheelPadUp = () => {
        if (!wheelPadActive) return;
        wheelPadActive = false;
        resetWheelPadKnob();
      };
      wheelPadTrack.addEventListener("pointerdown", onWheelPadDown);
      window.addEventListener("pointermove", onWheelPadMove);
      window.addEventListener("pointerup", onWheelPadUp);
      window.addEventListener("pointercancel", onWheelPadUp);
      act1Cleanups.push(() => {
        wheelPadTrack.removeEventListener("pointerdown", onWheelPadDown);
        window.removeEventListener("pointermove", onWheelPadMove);
        window.removeEventListener("pointerup", onWheelPadUp);
        window.removeEventListener("pointercancel", onWheelPadUp);
      });

      // 3D 机关直接按住左/右拖动旋转（捕获阶段优先拦截可旋阀轮，非可旋处完全放行视角旋转）
      const dragHudEl = document.getElementById("act1-wheel-drag-hud");
      const dragHudText = document.getElementById("wd-text");
      const dragHudBar = document.getElementById("wd-bar");
      const wheelDrag = { active: false, mode: null, startX: 0, maxAbsDx: 0, lastTickDx: 0, lastDx: 0 };
      const WHEEL_3D_TRIG = 84;

      const onWheel3DDown = (e) => {
        if (currentAct !== 1 || e.button !== 0 || e.target !== renderer.domElement) return;
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const hits = raycaster.intersectObjects(clickables.filter(isObjWorldVisible), false);
        if (!hits.length) return;
        const u = hits[0].object.userData || {};
        let mode = null;
        if (u.type === "act1_drain" && !st.drained) mode = "drain";
        else if (u.type === "act1_refill" && st.hasWheel && !st.refilled) mode = "refill";
        else if (u.type === "act1_boiler" && st.refilled && !(st.boilerMode === "ccw" && !st.waterCaught && viewIdx === 1)) mode = "boiler";
        if (!mode) return;

        e.stopImmediatePropagation();
        e.preventDefault();
        closeNpcDialog();
        wheelDrag.active = true;
        wheelDrag.mode = mode;
        wheelDrag.startX = e.clientX;
        wheelDrag.maxAbsDx = 0;
        wheelDrag.lastTickDx = 0;
        wheelDrag.lastDx = 0;
        if (mode === "refill" && !st.wheelMounted) {
          st.wheelMounted = true;
          installedWheelPivot.visible = true;
        }
        hoverTag.style.display = "none";
        wrap.style.cursor = "ew-resize";
        dragHudEl.style.left = `${e.clientX}px`;
        dragHudEl.style.top = `${e.clientY}px`;
        dragHudBar.style.width = "0%";
        dragHudText.textContent = mode === "boiler"
          ? "☸ 向左拖逆转 · 向右拖顺转"
          : (mode === "drain" ? "🔄 左右拖动旋开退水阀轮 0%" : "🔄 左右拖动旋紧蓄水阀轮 0%");
        dragHudEl.style.display = "block";
      };

      const onWheel3DMove = (e) => {
        if (!wheelDrag.active) return;
        e.stopImmediatePropagation();
        const dx = e.clientX - wheelDrag.startX;
        wheelDrag.lastDx = dx;
        wheelDrag.maxAbsDx = Math.max(wheelDrag.maxAbsDx, Math.abs(dx));
        const pct = Math.min(100, Math.round((Math.abs(dx) / WHEEL_3D_TRIG) * 100));
        dragHudEl.style.left = `${e.clientX}px`;
        dragHudEl.style.top = `${e.clientY}px`;
        dragHudBar.style.width = `${pct}%`;
        applyDragWaterPreview(wheelDrag.mode, Math.abs(dx) / WHEEL_3D_TRIG);

        if (wheelDrag.mode === "drain") {
          drainManualRot = -(dx / WHEEL_3D_TRIG) * Math.PI * 1.45;
          dragHudText.textContent = `🔄 正在旋开退水红阀轮 ${pct}%`;
        } else if (wheelDrag.mode === "refill") {
          refillManualRot = (dx / WHEEL_3D_TRIG) * Math.PI * 1.45;
          dragHudText.textContent = `🔄 正在旋紧蓄水红阀轮 ${pct}%`;
        } else if (wheelDrag.mode === "boiler") {
          boilerManualRot = -(dx / WHEEL_3D_TRIG) * Math.PI * 1.2;
          dragHudText.textContent = dx >= 0
            ? `↻ 向右顺转灌北池 ${pct}%`
            : `↺ 向左逆转朝西北 ${pct}%`;
        }

        if (Math.abs(dx - wheelDrag.lastTickDx) >= 20) {
          wheelDrag.lastTickDx = dx;
          playRatchetTick(dx >= 0 ? 1.12 : 0.88);
        }

        if (Math.abs(dx) >= WHEEL_3D_TRIG) {
          const doneMode = wheelDrag.mode;
          const dirDx = dx;
          wheelDrag.active = false;
          wheelDrag.mode = null;
          dragHudEl.style.display = "none";
          wrap.style.cursor = "";
          if (doneMode === "drain") triggerDrainComplete();
          else if (doneMode === "refill") triggerRefillComplete();
          else if (doneMode === "boiler") operateBoiler(dirDx >= 0 ? "cw" : "ccw");
        }
      };

      const onWheel3DUp = (e) => {
        if (!wheelDrag.active) return;
        e.stopImmediatePropagation();
        const wasClick = wheelDrag.maxAbsDx < 12;
        const clickMode = wheelDrag.mode;
        wheelDrag.active = false;
        wheelDrag.mode = null;
        dragHudEl.style.display = "none";
        wrap.style.cursor = "";
        if (wasClick) {
          if (clickMode === "drain") {
            walkToAndRun("drain_pos", () => openWheelPad("drain"));
          } else if (clickMode === "refill") {
            walkToAndRun("refill_pos", () => {
              st.wheelMounted = true;
              syncAct1();
              openWheelPad("refill");
            });
          } else if (clickMode === "boiler") {
            walkToAndRun("boiler_deck", () => openWheelPad("boiler"), "眼下还登不上那座高台。");
          }
        } else {
          showToast("转动幅度还差一点。", 2000);
        }
      };

      renderer.domElement.addEventListener("pointerdown", onWheel3DDown, true);
      window.addEventListener("pointermove", onWheel3DMove, true);
      window.addEventListener("pointerup", onWheel3DUp, true);
      window.addEventListener("pointercancel", onWheel3DUp, true);
      act1Cleanups.push(() => {
        renderer.domElement.removeEventListener("pointerdown", onWheel3DDown, true);
        window.removeEventListener("pointermove", onWheel3DMove, true);
        window.removeEventListener("pointerup", onWheel3DUp, true);
        window.removeEventListener("pointercancel", onWheel3DUp, true);
      });

      // === 顶层验潮铜铃：预设节奏示范 + 鼠标复现 + 3D/UI 声光特效 ===
      const BELL_DEMO_GAPS = [420, 420, 920];
      const bellPanelEl = document.getElementById("act1-bell-panel");
      const bellStatusEl = document.getElementById("bp-status");
      const bellTapBtn = document.getElementById("btn-bell-tap");

      function spawnBellBurstEffect(beatIdx, isDemo = false) {
        playRhythmBell(beatIdx, isDemo);
        buoyPulse = 1.0;
        const fxColor = isDemo ? 0x7dfae4 : 0xffd258;
        buoyFlashLight.color.setHex(fxColor);
        buoyFlashLight.intensity = isDemo ? 4.2 : 6.2;

        // 双层立体扩散声波环
        const centerY = Math.max(floatOrbCurrentY, FLOAT_ORB_HIGH_Y) + 0.14;
        [
          { r0: 0.32, r1: 0.44, tiltX: -Math.PI / 2, tiltZ: 0 },
          { r0: 0.28, r1: 0.36, tiltX: -Math.PI / 2 + 0.45, tiltZ: 0.35 },
        ].forEach((cfg) => {
          const ring = new THREE.Mesh(
            new THREE.RingGeometry(cfg.r0, cfg.r1, 32),
            new THREE.MeshBasicMaterial({ color: fxColor, side: THREE.DoubleSide, transparent: true, opacity: 0.92 })
          );
          ring.material.userData.outlineParameters = { visible: false };
          ring.position.set(-1.72, centerY, -3.45);
          ring.rotation.x = cfg.tiltX;
          ring.rotation.z = cfg.tiltZ;
          levelRoot.add(ring);
          let life = 0;
          animHooks.push((dt) => {
            if (!ring.parent) return;
            life += dt;
            const s = 1.0 + life * 4.4;
            ring.scale.set(s, s, 1);
            ring.position.y += dt * 0.48;
            ring.material.opacity = Math.max(0, 0.92 * (1.0 - life / 0.72));
            if (life >= 0.72) levelRoot.remove(ring);
          });
        });

        // 北池水面共鸣波纹
        spawnStepRipple({ x: -1.72, y: northWaterY + 0.015, z: -3.45 }, isDemo ? 0x92fcf0 : 0xffe488);
        const wRing = new THREE.Mesh(
          new THREE.RingGeometry(0.45, 0.56, 32),
          new THREE.MeshBasicMaterial({ color: fxColor, side: THREE.DoubleSide, transparent: true, opacity: 0.78 })
        );
        wRing.material.userData.outlineParameters = { visible: false };
        wRing.rotation.x = -Math.PI / 2;
        wRing.position.set(-1.72, northWaterY + 0.022, -3.45);
        levelRoot.add(wRing);
        let wl = 0;
        animHooks.push((dt) => {
          if (!wRing.parent) return;
          wl += dt;
          const sc = 1.0 + wl * 3.2;
          wRing.scale.set(sc, sc, 1);
          wRing.position.y = northWaterY + 0.022;
          wRing.material.opacity = Math.max(0, 0.78 * (1.0 - wl / 0.85));
          if (wl >= 0.85) levelRoot.remove(wRing);
        });

        // 6 颗螺旋上升光粒特效
        for (let k = 0; k < 6; k++) {
          const sp = new THREE.Mesh(
            new THREE.SphereGeometry(0.048, 8, 6),
            new THREE.MeshBasicMaterial({ color: k % 2 === 0 ? fxColor : 0xffffff, transparent: true, opacity: 0.92 })
          );
          sp.material.userData.outlineParameters = { visible: false };
          const a0 = (k / 6) * Math.PI * 2 + beatIdx * 0.6;
          sp.position.set(-1.72 + Math.cos(a0) * 0.34, centerY - 0.12, -3.45 + Math.sin(a0) * 0.34);
          levelRoot.add(sp);
          let pl = 0;
          animHooks.push((dt) => {
            if (!sp.parent) return;
            pl += dt;
            const ang = a0 + pl * 4.5;
            const rad = 0.34 + pl * 0.55;
            sp.position.set(-1.72 + Math.cos(ang) * rad, centerY - 0.12 + pl * 1.15, -3.45 + Math.sin(ang) * rad);
            sp.scale.setScalar(Math.max(0.15, 1.0 - pl * 0.85));
            sp.material.opacity = Math.max(0, 0.92 * (1.0 - pl / 0.78));
            if (pl >= 0.78) levelRoot.remove(sp);
          });
        }
      }

      function handleBellTap() {
        if (bellState.phase === "demo") {
          showToast("请先听完示范节奏。", 1800);
          return;
        }
        if (bellState.phase !== "listen") return;
        const idx = bellState.taps.length;
        if (idx >= 4) return;
        const ts = performance.now();
        bellState.taps.push(ts);
        triggerHeroInteract(new THREE.Vector3(-1.72, FLOAT_ORB_HIGH_Y, -3.45));
        spawnBellBurstEffect(idx, false);
        if (bellDotEls[idx]) bellDotEls[idx].classList.add("user-hit");

        if (bellState.taps.length < 4) {
          bellStatusEl.textContent = `已敲响第 ${idx + 1} / 4 声`;
          return;
        }

        const t = bellState.taps;
        const d1 = t[1] - t[0];
        const d2 = t[2] - t[1];
        const d3 = t[3] - t[2];
        const ok =
          d1 >= 150 && d1 <= 850 &&
          d2 >= 150 && d2 <= 850 &&
          Math.abs(d1 - d2) <= 360 &&
          d3 >= 600 && d3 <= 1950 &&
          d3 >= Math.max(d1, d2) * 1.32;

        if (ok) {
          bellState.phase = "solved";
          st.buoyLocked = true;
          bellTapBtn.disabled = true;
          bellDotEls.forEach((d) => { if (d) { d.classList.remove("demo-hit"); d.classList.add("user-hit"); } });
          bellStatusEl.textContent = "✨ 铜铃共鸣！大浮球已扣稳顶位！";

          bellStatusEl.textContent = "⚠️ 节拍似乎差了一些，即将重播示范...";
          bellState.phase = "demo";
          bellTapBtn.disabled = true;
          bellState.taps = [];
          bellState.timers.push(setTimeout(() => {
            if (currentAct === 1 && !st.buoyLocked) playBellDemo();
          }, 1150));
        }
      }
