    // === 单指拖拽旋转 / 双指捏合缩放 + 双指平移场景 / 点击射线交互 ===
    let isDragging = false, dragStartX = 0, dragMoved = false;
    const activePointers = new Map();
    let isPinching = false, wasPinching = false, pinchLastDist = 0, pinchLastCenter = null;

    function getPinchDistance() {
      const pts = Array.from(activePointers.values());
      if (pts.length < 2) return 0;
      return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    }

    function getPinchCenter() {
      const pts = Array.from(activePointers.values());
      if (pts.length < 2) return null;
      return { x: (pts[0].x + pts[1].x) * 0.5, y: (pts[0].y + pts[1].y) * 0.5 };
    }

    ["gesturestart", "gesturechange"].forEach((ev) => renderer.domElement.addEventListener(ev, (e) => e.preventDefault(), { passive: false }));
    renderer.domElement.addEventListener("pointerdown", (e) => {
      if (customFinaleRenderer) return;
      if (e.target && e.target.closest && (e.target.closest("#npc-dialog") || e.target.closest("#light-studio-wrap"))) return;
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY, type: e.pointerType });
      if (activePointers.size >= 2) {
        isDragging = false;
        dragMoved = true;
        isPinching = true;
        wasPinching = true;
        pinchLastDist = getPinchDistance();
        pinchLastCenter = getPinchCenter();
        return;
      }
      isDragging = true;
      dragStartX = e.clientX;
      dragMoved = false;
    });

    function isObjWorldVisible(o) {
      let cur = o;
      while (cur) {
        if (!cur.visible) return false;
        cur = cur.parent;
      }
      return true;
    }

    window.addEventListener("pointermove", (e) => {
      if (activePointers.has(e.pointerId)) {
        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY, type: e.pointerType });
      }
      if (customFinaleRenderer) {
        hoverTag.style.display = "none";
        wrap.style.cursor = "";
        return;
      }
      if (isPinching && activePointers.size >= 2) {
        const curDist = getPinchDistance();
        const curCenter = getPinchCenter();
        if (pinchLastDist > 12 && curDist > 12) {
          userPinchZoomTarget = THREE.MathUtils.clamp(userPinchZoomTarget * (curDist / pinchLastDist), 0.85, 2.80);
        }
        if (pinchLastCenter && curCenter) {
          const dxPx = curCenter.x - pinchLastCenter.x;
          const dyPx = curCenter.y - pinchLastCenter.y;
          if (Math.abs(dxPx) > 0.1 || Math.abs(dyPx) > 0.1) {
            if (cutsceneTimers.length) clearCutsceneSequence(true);
            const effZoom = Math.max(0.25, camera.zoom || 1.0);
            const visW = (camera.right - camera.left) / effZoom;
            const visH = (camera.top - camera.bottom) / effZoom;
            const dxW = dxPx * (visW / Math.max(1, window.innerWidth));
            const dyW = dyPx * (visH / Math.max(1, window.innerHeight));
            const cosY = Math.cos(camYawCurrent);
            const sinY = Math.sin(camYawCurrent);
            const panFwd = dyW / Math.sin(camPitch);
            userPanTarget.x += -dxW * cosY - panFwd * sinY;
            userPanTarget.z += dxW * sinY - panFwd * cosY;
            clampUserPanTarget();
          }
        }
        syncZoomResetBtn();
        pinchLastDist = curDist;
        pinchLastCenter = curCenter;
        hoverTag.style.display = "none";
        return;
      }
      if (isDragging) {
        const dx = e.clientX - dragStartX;
        const dragThresh = e.pointerType === "touch" ? 10 : 6;
        if (Math.abs(dx) > dragThresh) dragMoved = true;
        if (dragMoved) {
          if (cutsceneTimers.length) clearCutsceneSequence(true);
          camYawTarget -= dx * 0.008;
          dragStartX = e.clientX;
        }
        hoverTag.style.display = "none";
        wrap.style.cursor = "grabbing";
        return;
      }
      if (e.pointerType === "touch") {
        hoverTag.style.display = "none";
        wrap.style.cursor = "";
        return;
      }
      if (npcDialogState && e.target && e.target.closest && e.target.closest("#npc-dialog")) {
        hoverTag.style.display = "none";
        wrap.style.cursor = "";
        return;
      }
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(clickables.filter(isObjWorldVisible), false);
      wrap.style.cursor = hits.length ? "pointer" : "";
      if (hits.length && hits[0].object.userData.label) {
        hoverTag.textContent = hits[0].object.userData.label;
        hoverTag.style.left = e.clientX + "px";
        hoverTag.style.top = e.clientY + "px";
        hoverTag.style.display = "block";
      } else {
        hoverTag.style.display = "none";
      }
    });

    function finishCanvasPointer(e, isCancel) {
      activePointers.delete(e.pointerId);
      if (activePointers.size < 2) {
        isPinching = false;
        pinchLastDist = 0;
        pinchLastCenter = null;
      }
      if (customFinaleRenderer) {
        isDragging = false;
        if (activePointers.size === 0) wasPinching = false;
        return;
      }
      if (wasPinching) {
        isDragging = false;
        wrap.style.cursor = "";
        if (activePointers.size === 0) wasPinching = false;
        return;
      }
      if (!isDragging) return;
      isDragging = false;
      wrap.style.cursor = "";
      if (isCancel) return;
      if (dragMoved) {
        let norm = ((camYawTarget % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
        let bestIdx = 0, bestDiff = 99;
        SNAP_ANGLES.forEach((a, i) => {
          let d = Math.abs(norm - a);
          d = Math.min(d, Math.PI * 2 - d);
          if (d < bestDiff) { bestDiff = d; bestIdx = i; }
        });
        setViewIndex(bestIdx);
        return;
      }

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(clickables.filter(isObjWorldVisible), false);
      if (!hits.length) return;
      const u = hits[0].object.userData;
      if (!(u.type && /npc_seran/.test(u.type))) closeNpcDialog();
      if (u.type === "node") {
        walkToAndRun(u.id, navNodes[u.id].onArrive);
      } else if (window.__onObjectClick) {
        window.__onObjectClick(u, hits[0].point);
      }
    }

    window.addEventListener("pointerup", (e) => finishCanvasPointer(e, false));
    window.addEventListener("pointercancel", (e) => finishCanvasPointer(e, true));

    const questToggleBtn = document.getElementById("btn-quest-toggle");
    if (questToggleBtn) {
      questToggleBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const qb = document.getElementById("quest-box");
        if (!qb) return;
        const collapsed = qb.classList.toggle("collapsed");
        questToggleBtn.textContent = collapsed ? "▾" : "▴";
      });
    }
    const resetCameraView = (e) => {
      if (e) e.stopPropagation();
      userPinchZoomTarget = 1.0;
      userPanTarget.set(0, 0, 0);
      syncZoomResetBtn();
    };
    const zoomResetBtn = document.getElementById("btn-zoom-reset");
    if (zoomResetBtn) zoomResetBtn.addEventListener("click", resetCameraView);
    const mobileViewResetBtn = document.getElementById("btn-mobile-view-reset");
    if (mobileViewResetBtn) mobileViewResetBtn.addEventListener("click", resetCameraView);

    document.getElementById("btn-rot-l").addEventListener("click", () => setViewIndex(viewIdx - 1));
    document.getElementById("btn-rot-r").addEventListener("click", () => setViewIndex(viewIdx + 1));
    const resetCurrentAct = () => {
      if (currentAct === 1) loadAct1();
      if (currentAct === 2) loadAct2();
      if (currentAct === 3) loadAct3();
    };
    document.getElementById("btn-reset").addEventListener("click", resetCurrentAct);
    const mobileResetBtn = document.getElementById("btn-mobile-reset");
    if (mobileResetBtn) mobileResetBtn.addEventListener("click", resetCurrentAct);
    window.addEventListener("keydown", (e) => {
      if (customFinaleRenderer) return;
      if (e.key === "Escape") { closeNpcDialog(); return; }
      if (e.key === "q" || e.key === "Q") setViewIndex(viewIdx - 1);
      if (e.key === "e" || e.key === "E") setViewIndex(viewIdx + 1);
    });

    document.querySelectorAll(".act-tabs .btn[data-act]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".act-tabs .btn[data-act]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const act = Number(btn.dataset.act);
        if (act === 1) loadAct1();
        if (act === 2) loadAct2();
        if (act === 3) loadAct3();
      });
    });

    window.addEventListener("resize", () => {
      applyMainCameraProjection();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.getDrawingBufferSize(_rtSize);
      const rw = Math.max(1, Math.floor(_rtSize.x));
      const rh = Math.max(1, Math.floor(_rtSize.y));
      mainRT.setSize(rw, rh);
      edgeInfoRT.setSize(rw, rh);
      compositeMat.uniforms.uTexelSize.value.set(1.0 / rw, 1.0 / rh);
      compositeMat.uniforms.uEdgeStep.value = 1.0;
      syncCompactBottomLabels();
      const angEl = document.getElementById("angle-box");
      if (angEl) angEl.textContent = isPortraitHudLayout() ? `🧭 ${SNAP_DEG[viewIdx]}°` : `🧭 正交视角：${SNAP_DEG[viewIdx]}°`;
      syncBottomFloatPanels();
      if (customFinaleRenderer && customFinaleRenderer.resize) {
        customFinaleRenderer.resize(window.innerWidth, window.innerHeight);
      }
    });

    // === 主循环 ===
    let lastTime = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      let heroIsMoving = false;
      let movedHoriz = 0.0;
      let remBudget = walkSpeed * dt;
      while (walkQueue.length > 0 && remBudget > 1e-5) {
        const step = walkQueue[0];
        const target = navNodes[step.id].pos;
        if (step.teleport) {
          heroGroup.position.copy(target);
          heroNode = step.id;
          walkQueue.shift();
          refreshNodeHighlights();
          break;
        }
        const dx = target.x - heroGroup.position.x;
        const dy = target.y - heroGroup.position.y;
        const dz = target.z - heroGroup.position.z;
        const dist = Math.hypot(dx, dy, dz);
        const hDist = Math.hypot(dx, dz);
        if (hDist > 0.015) {
          heroTargetYaw = Math.atan2(dx, dz);
          heroIsMoving = true;
        }
        if (dist <= remBudget || dist < 0.05) {
          movedHoriz += hDist;
          remBudget -= dist;
          heroGroup.position.copy(target);
          heroNode = step.id;
          walkQueue.shift();
          refreshNodeHighlights();
          if (walkQueue.length === 0) {
            if (pendingArrivalCallback) {
              const cb = pendingArrivalCallback;
              pendingArrivalCallback = null;
              cb();
            } else if (navNodes[step.id].onArrive) {
              navNodes[step.id].onArrive();
            }
            break;
          }
        } else {
          const stepDist = remBudget;
          heroGroup.position.x += (dx / dist) * stepDist;
          heroGroup.position.y += (dy / dist) * stepDist;
          heroGroup.position.z += (dz / dist) * stepDist;
          movedHoriz += stepDist * (hDist / dist);
          remBudget = 0;
        }
      }

      if (heroInteractTimer > 0) heroInteractTimer = Math.max(0, heroInteractTimer - dt);
      let yawDiff = heroTargetYaw - heroVisualRoot.rotation.y;
      while (yawDiff > Math.PI) yawDiff -= Math.PI * 2;
      while (yawDiff < -Math.PI) yawDiff += Math.PI * 2;
      heroVisualRoot.rotation.y += yawDiff * Math.min(1.0, dt * 11.0);
      if (heroActor) {
        if (heroIsMoving) {
          heroInteractTimer = 0.0;
          const walkClipDur = heroActor.getClipDuration("Walk") || 1.20;
          const natWalkSpeed = HERO_WALK_STRIDE / Math.max(walkClipDur, 0.2);
          const effHorizSpeed = walkQueue.length > 0 ? (movedHoriz / Math.max(dt, 1e-4)) : walkSpeed;
          const walkScale = THREE.MathUtils.clamp(effHorizSpeed / natWalkSpeed, 0.85, 2.25);
          heroActor.play("Walk", 0.09, false, walkScale);
          heroActor.setTimeScale("Walk", walkScale);
        } else if (heroInteractTimer <= 0 && heroActor.currentName !== "Interact") {
          heroActor.play("Idle", 0.20, false, 1.0);
        }
        heroActor.update(dt);
      }

      for (const fn of animHooks) fn(dt, now);
      if (customFinaleRenderer) {
        customFinaleRenderer.render(dt, now);
      } else {
        updateCameraPos();
        updateMirrors(now);
        renderSceneWithSmartOutline();
      }
    }

    loadAct1();
    setTimeout(() => {
      ["ascension_statue_rodin", "ascension_gate_rodin"].forEach((gn) => {
        if (glbCache[gn]) return;
        gltfLoader.load(`./assets/${gn}.glb?v=42`, (gltf) => {
          enhanceMaterials(gltf.scene);
          glbCache[gn] = gltf.scene;
        }, undefined, () => {});
      });
      ["char_hero_rigged", "char_seran_rigged"].forEach((cn) => {
        loadRiggedCharacter(cn, () => {});
      });
    }, 1800);
    const _urlInterlude = new URLSearchParams(window.location.search).get("interlude");
    if (_urlInterlude === "12" || _urlInterlude === "23") {
      setTimeout(() => startAscensionInterlude(_urlInterlude === "12" ? 1 : 2, _urlInterlude === "12" ? 2 : 3), 2800);
    }
    animate(performance.now());
    if (new URLSearchParams(window.location.search).get("testPan") === "1") {
      const _runPanTest = () => {
        const ld = document.getElementById("loading");
        if (ld && getComputedStyle(ld).display !== "none" && parseFloat(getComputedStyle(ld).opacity || "1") > 0.05) {
          setTimeout(_runPanTest, 350);
          return;
        }
        setTimeout(() => {
          const cv = renderer.domElement;
          const cx = window.innerWidth * 0.5;
          const cy = window.innerHeight * 0.5;
          const mk = (type, id, x, y) => new PointerEvent(type, { pointerId: id, pointerType: "touch", clientX: x, clientY: y, bubbles: true, cancelable: true });
          cv.dispatchEvent(mk("pointerdown", 101, cx - 30, cy));
          cv.dispatchEvent(mk("pointerdown", 102, cx + 30, cy));
          // 第1段：张开双指放大约 2.1x
          for (let i = 1; i <= 8; i++) {
            const half = 30 + (36 * i) / 8;
            window.dispatchEvent(mk("pointermove", 101, cx - half, cy));
            window.dispatchEvent(mk("pointermove", 102, cx + half, cy));
          }
          // 第2段：两指同步向左上方平移，将右侧蒸汽锅炉房移入屏幕视野
          for (let i = 1; i <= 10; i++) {
            const tx = (-115 * i) / 10;
            const ty = (-35 * i) / 10;
            window.dispatchEvent(mk("pointermove", 101, cx - 66 + tx, cy + ty));
            window.dispatchEvent(mk("pointermove", 102, cx + 66 + tx, cy + ty));
          }
          window.dispatchEvent(mk("pointerup", 101, cx - 181, cy - 35));
          window.dispatchEvent(mk("pointerup", 102, cx - 49, cy - 35));
        }, 900);
      };
      setTimeout(_runPanTest, 1200);
    }
  </script>
</body>
